name: pr375-u1-remediation-r4

on:
  push:
    branches:
      - feat/physics-tablet-standalone
    paths:
      - .github/workflows/pr375-u1-remediation-r4.yml

permissions:
  contents: write

concurrency:
  group: pr375-u1-remediation-r4
  cancel-in-progress: false

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct U1 r3 candidate and correct residual specificity
        shell: bash
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, yaml

          workflow = Path('.github/workflows/pr375-u1-remediation-r3.yml')
          data = yaml.safe_load(workflow.read_text(encoding='utf-8'))
          steps = data['jobs']['remediate-and-verify']['steps']
          patch = next(s for s in steps if s.get('name') == 'Apply bounded U1 remediation')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', patch['run']], check=True)

          marker = 'id="pr375-u1-remediation"'
          pages = []
          for p in Path('standalone').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  continue
              pat = re.compile(r'(<style id="pr375-u1-remediation">)(.*?)(</style>)', re.S)
              m = pat.search(text)
              assert m, p
              body = m.group(2)
              residual = '\n.badge,.study-kicker{font-size:14px!important}\n'
              if residual.strip() not in body:
                  body += residual
              text = text[:m.start()] + m.group(1) + body + m.group(3) + text[m.end():]
              p.write_text(text, encoding='utf-8')
              pages.append(str(p))

          assert len(pages) == 20, f'expected 20 U1 pages, got {len(pages)}: {pages}'
          print('U1 r4 residual specificity correction applied to 20/20 pages')
          PY

      - name: Install Chromium
        shell: bash
        run: |
          npm install -g playwright@1.55.0
          playwright install chromium

      - name: Re-run exact 80-render U1 gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          data = yaml.safe_load(Path('.github/workflows/pr375-u1-remediation-r3.yml').read_text(encoding='utf-8'))
          step = next(s for s in data['jobs']['remediate-and-verify']['steps'] if s.get('name') == 'Run 80-render Chromium gate')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], check=True)
          PY

      - name: Commit verified U1 learner remediation
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standalone
          git diff --cached --quiet && { echo 'No U1 learner delta to commit'; exit 1; }
          git commit -m "fix(physics): remediate PR375 U1 tablet typography and layout"

      - name: Reconcile concurrent non-learner changes and push
        shell: bash
        run: |
          git fetch origin feat/physics-tablet-standalone
          remote_sha=$(git rev-parse origin/feat/physics-tablet-standalone)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            learner_changes=$(git diff --name-only "$GITHUB_SHA".."$remote_sha" -- standalone | grep -E '\.html$' || true)
            if [ -n "$learner_changes" ]; then
              echo "Learner HTML advanced during U1 audit; refusing stale replay:"
              echo "$learner_changes"
              exit 1
            fi
            git rebase "$remote_sha"
          fi
          git push origin HEAD:feat/physics-tablet-standalone
