name: pr375-u1-workflow-repair

on:
  push:
    branches:
      - feat/physics-tablet-standalone
    paths:
      - .github/workflows/pr375-u1-workflow-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Repair async audit wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pr375-u1-remediation.yml')
          s = p.read_text(encoding='utf-8')
          needle1 = "          const { chromium } = require('playwright');\n"
          repl1 = needle1 + "          (async () => {\n"
          assert needle1 in s and "          (async () => {\n" not in s
          s = s.replace(needle1, repl1, 1)
          needle2 = "          JS\n          node /tmp/u1-audit.cjs"
          repl2 = "          })().catch(err => { console.error(err); process.exit(1); });\n          JS\n          node /tmp/u1-audit.cjs"
          assert needle2 in s
          s = s.replace(needle2, repl2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify branch has not advanced
        shell: bash
        run: |
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/physics-tablet-standalone | cut -f1)"
          echo "trigger=$GITHUB_SHA remote=$REMOTE_HEAD"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
      - name: Commit repair and self-remove
        shell: bash
        run: |
          rm .github/workflows/pr375-u1-workflow-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr375-u1-remediation.yml .github/workflows/pr375-u1-workflow-repair.yml
          git diff --cached --check
          git commit -m "chore(pr375): fix U1 browser audit runner"
          git push origin HEAD:feat/physics-tablet-standalone
