name: v31-plan-handover-194

on:
  push:
    branches:
      - relay/v31-plan-handover-194
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed Issue 169 branch
        uses: actions/checkout@v4
        with:
          ref: readiness/issue-169-grade9-exit-v31
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3.1
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: edb845f06f32c87453dee6fbfcc2f84937017279
          path: _common_v31
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relay dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Write provider-readback handover target
        run: |
          cat > /tmp/handover-target.yaml <<'YAML'
          schema_version: relay-v3.1-handover-target
          authority: PROVIDER_READBACK
          provider: GITHUB
          repository: reallaksh19/Grade9V3
          kind: PULL_REQUEST
          number: 194
          title: "Grade 9: derive exit readiness under Relay V3.1"
          url: https://github.com/reallaksh19/Grade9V3/pull/194
          state: DRAFT
          observed_at: "2026-09-22T16:43:02Z"
          provider_ref: github:reallaksh19/Grade9V3#194@a3c50cae8dbfa8f54f7021f8298e2d204f1ad1db
          YAML

      - name: Expose standalone three-pass contract for planning
        run: |
          mkdir -p skills
          cp -R _common_v31/skills/three-pass-prompt-generator skills/three-pass-prompt-generator

      - name: Prove handover authorization
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py HANDOVER .

      - name: Plan complex handover
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/plan_handover.py .             --tx-id TX-V31-PLAN-HANDOVER-ISS169-001             --event-id EVT-V31-PLAN-HANDOVER-ISS169-001             --actor chatgpt-sol-exit-v31-20260922             --target-observation /tmp/handover-target.yaml             --base-ref origin/main             --complex

      - name: Validate V3.1 authority after handover plan
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate

      - name: Commit handover plan to Issue 169 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "[relay-v3.1] plan handover for Issue 169"
          git push origin HEAD:readiness/issue-169-grade9-exit-v31
