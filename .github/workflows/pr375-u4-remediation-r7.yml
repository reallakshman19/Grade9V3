name: pr375-u4-remediation-r7

on:
  push:
    branches:
      - feat/physics-tablet-standalone
    paths:
      - .github/workflows/pr375-u4-remediation-r7.yml

permissions:
  contents: write

concurrency:
  group: pr375-u4-remediation-r7
  cancel-in-progress: false

jobs:
  commit-validated-u4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/physics-tablet-standalone
          fetch-depth: 0

      - name: Pin exact branch head and prove learner HTML unchanged since green audit
        shell: bash
        run: |
          echo "AUDIT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --quiet 9f9e28d5d3ed73ff8e329589ff913e2607f2673f..HEAD -- standalone/ || {
            echo "Learner HTML changed after the fully green U4 audit; refusing replay-only commit."
            git diff --name-only 9f9e28d5d3ed73ff8e329589ff913e2607f2673f..HEAD -- standalone/
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct the exact green U4 candidate
        shell: bash
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          data = yaml.safe_load(Path('.github/workflows/pr375-u4-remediation-r5.yml').read_text(encoding='utf-8'))
          for step_name in [
              'Reconstruct reviewed U4 candidate',
              'Contain long phone formula without page clipping',
              'Verify exact U4 static denominator',
          ]:
              step = next(s for s in data['jobs']['remediate-verify-commit']['steps'] if s.get('name') == step_name)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], check=True)
          PY

      - name: Ensure feature branch did not advance during replay
        shell: bash
        run: |
          remote_sha=$(git ls-remote origin refs/heads/feat/physics-tablet-standalone | awk '{print $1}')
          test "$remote_sha" = "$AUDIT_BASE_SHA" || { echo "branch advanced from $AUDIT_BASE_SHA to $remote_sha; refusing to overwrite"; exit 1; }

      - name: Commit validated U4 remediation and remove U4 one-shot workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr375-u4-remediation.yml \
                 .github/workflows/pr375-u4-remediation-r2.yml \
                 .github/workflows/pr375-u4-remediation-r3.yml \
                 .github/workflows/pr375-u4-diagnostic-r4.yml \
                 .github/workflows/pr375-u4-remediation-r5.yml \
                 .github/workflows/pr375-u4-remediation-r6.yml \
                 .github/workflows/pr375-u4-remediation-r7.yml
          git add standalone/core1a-motion-1d-straight-line-tablet.html \
                  standalone/core1a-motion-in-a-plane-tablet.html \
                  standalone/core1a-physics-nlm-tablet.html \
                  standalone/core1a-vector-add-sub-tablet.html \
                  standalone/core2-motion-in-a-plane-tablet.html \
                  standalone/core2-physics-thrust-pressure-tablet.html \
                  standalone/practice/*.html
          git commit -m "fix(physics): remediate PR375 U4 accessibility findings"
          git push origin HEAD:feat/physics-tablet-standalone
