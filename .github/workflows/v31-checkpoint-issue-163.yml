name: v31-checkpoint-issue-163

on:
  push:
    branches:
      - relay/v31-checkpoint-issue-163
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed Issue 163 branch
        uses: actions/checkout@v4
        with:
          ref: integration/issue-163-portable-workbench
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3.1
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: edb845f06f32c87453dee6fbfcc2f84937017279
          path: _common_v31
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate active V3.1 authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_default.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate

      - name: Re-run Issue 163 focused acceptance
        run: |
          python -m Shared.tools.build_portable_workbench --check
          python Shared/tools/build_manifest.py --check
          python -m unittest tests.test_portable_workbench
          node --test tests/portable_workbench.test.mjs
          node --test tests/workbench_runtime.test.mjs
          git diff --exit-code origin/main --             Shared/workbench             Shared/library             Shared/publication_host             Physics             Chemistry             Mathematics             public/core-learning             standalone/core-learning

      - name: Prove V3.1 checkpoint authorization
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py CHECKPOINT . --base-ref origin/main

      - name: Build exact V3.1 checkpoint
        env:
          CHECKPOINT_RUN_ID: ${{ github.run_id }}
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/material_basis.py .             --base-ref origin/main > /tmp/material.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          material = json.loads(Path("/tmp/material.json").read_text(encoding="utf-8"))["material_basis"]
          run_id = os.environ["CHECKPOINT_RUN_ID"]
          cp = {
              "schema_version": "relay-v3.1-checkpoint",
              "id": "CP-PORTABLE-163-V31-001",
              "ep": "EP-PORTABLE-163-V31-001",
              "material_result": {
                  "head": material["head"],
                  "relevant_paths_digest": material["relevant_paths_digest"],
                  "dependency_digest": material["dependency_digest"],
              },
              "acceptance": [
                  {
                      "id": "AC-163-PACKAGE",
                      "result": "PASS",
                      "evidence": [
                          f"V3.1 checkpoint workflow {run_id}: Python and Node portable package validation PASS",
                          "Version mismatch, executable payload and pixel-placement falsifiers fail closed.",
                          "Portable host contains no eval or new Function.",
                      ],
                  },
                  {
                      "id": "AC-163-HOSTS",
                      "result": "PASS",
                      "evidence": [
                          f"V3.1 checkpoint workflow {run_id}: real Chrome cross-host proof PASS",
                          "The same long-division package executes in repository static, external plain-HTML and true single-file hosts.",
                          "Single-file host has no runtime network/CDN dependency.",
                      ],
                  },
                  {
                      "id": "AC-163-CROSS-SUBJECT",
                      "result": "PASS",
                      "evidence": [
                          f"V3.1 checkpoint workflow {run_id}: long-division, Redox and integration package tests PASS",
                          "All three packages share one component/IR/adapter/scene-package contract without Core edits.",
                      ],
                  },
                  {
                      "id": "AC-163-BOUNDARY",
                      "result": "PASS",
                      "evidence": [
                          f"V3.1 checkpoint workflow {run_id}: protected-path diff against main PASS",
                          "Shared/workbench, Shared/library, publication host, learner shell and canonical subject trees remain unchanged.",
                          "Redox and integration rows remain NON_CANONICAL_COMPILED_PROOF fixtures.",
                      ],
                  },
                  {
                      "id": "AC-163-PARITY",
                      "result": "PASS",
                      "evidence": [
                          f"V3.1 checkpoint workflow {run_id}: build_portable_workbench --check PASS",
                          "Public, external and single-file artifacts are generated through one deterministic build path.",
                      ],
                  },
                  {
                      "id": "AC-163-REPO",
                      "result": "PASS",
                      "evidence": [
                          "exact-head pinned V3.1 run 35753230251 PASS",
                          "exact-head guardrails run 35753230397 PASS",
                          f"V3.1 checkpoint workflow {run_id}: manifest freshness and focused acceptance PASS",
                      ],
                  },
              ],
              "validation": {
                  "focused_tests": "PASS",
                  "spec_delivery": "PASS",
                  "full_guardrails": "PASS",
              },
              "quality": {
                  "policy": "STANDARD",
                  "result": "CLEAR",
              },
              "known_limitations": [
                  "Historical V3 checkpoints remain migration evidence only and are not promoted into native V3.1 acceptance.",
                  "Because V3.1 accepted-progress projection counts native checkpoints, historical completed roadmap work is not represented as V3.1 accepted progress.",
                  "Redox and integration are portability proof fixtures, not newly canonicalized subject records.",
              ],
              "discoveries": [
                  "Issue 163 technical acceptance survives a clean protocol-line migration from V3 to V3.1 without Core or subject-data changes.",
                  "The portable package/runtime boundary remains data-only, versioned and fail-closed under V3.1 revalidation.",
                  "Provider delivery can proceed from the fresh V3.1 checkpoint; the former V3 checkpoint is not needed as live authority.",
              ],
              "handoff": {
                  "what_changed": [
                      "The active delivery lane was migrated to Common@edb845f06f32c87453dee6fbfcc2f84937017279 Engineering Relay V3.1.",
                      "Issue 163 was re-admitted under EP-PORTABLE-163-V31-001 and re-proven instead of importing the old V3 checkpoint.",
                      "Permanent relay CI now validates the V3.1 selector/foundation/cutover.",
                  ],
                  "what_is_true_now": [
                      "PR 192 portability implementation passes all six V3.1 acceptance criteria.",
                      "Core, canonical subject truth and the Issue 175 learner shell remain outside portability ownership.",
                      f"Accepted V3.1 material head is {material['head']}.",
                  ],
                  "what_remains_uncertain": [
                      "Historical programme completion is preserved in roadmap/migration evidence but does not count as native V3.1 accepted progress without native checkpoints.",
                      "Grade-9 exit readiness Issue 169 remains a separate lane after Issue 163 provider closeout.",
                  ],
                  "do_not_break": [
                      "Do not re-enable Engineering Relay V3.",
                      "Do not promote relay-v3 checkpoints/events as relay-v3.1 authority.",
                      "Do not add executable package data or learner-mastery policy to portability.",
                  ],
                  "attempted_and_rejected": [
                      "Reusing the prior V3 checkpoint as V3.1 acceptance was rejected; acceptance was re-run natively.",
                      "Rewriting prior relay-v3 event history into relay-v3.1 events was rejected.",
                  ],
                  "resume_from": [
                      "Run V3.1 PR_READY and MERGE authorization on PR 192.",
                      "If GitHub remains mergeable, merge PR 192, sync provider readback, close the V3.1 task and reconcile WP-PORTABLE-163 COMPLETE.",
                  ],
                  "first_successor_action": "Perform the separately authorized V3.1 delivery transition for PR 192 if provider and V3.1 merge gates are green.",
              },
          }
          Path("/tmp/cp-portable-v31.yaml").write_text(
              yaml.safe_dump(cp, sort_keys=False),
              encoding="utf-8",
          )
          print(yaml.safe_dump(cp, sort_keys=False), end="")
          PY

      - name: Accept fresh V3.1 checkpoint
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . checkpoint             --tx-id TX-V31-CP-ISS163-001             --event-id EVT-V31-CP-ISS163-001             --actor chatgpt-sol-portable-v31-20260922             --checkpoint /tmp/cp-portable-v31.yaml             --base-ref origin/main

      - name: Publish V3.1 handover
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . handover             --tx-id TX-V31-HANDOVER-ISS163-001             --event-id EVT-V31-HANDOVER-ISS163-001             --actor chatgpt-sol-portable-v31-20260922             --base-ref origin/main

      - name: Validate accepted V3.1 authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate

      - name: Commit checkpoint and handover to PR 192
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "[relay-v3.1] accept Issue 163 portability checkpoint"
          git push origin HEAD:integration/issue-163-portable-workbench
