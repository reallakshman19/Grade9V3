name: v31-validate-issue-169

on:
  push:
    branches:
      - relay/v31-validate-issue-169
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed Issue 169 branch
        uses: actions/checkout@v4
        with:
          ref: delivery/issue-169-grade9-exit-v31
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3.1
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: edb845f06f32c87453dee6fbfcc2f84937017279
          path: _common_v31
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate V3.1 authority and manifest write
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_default.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py TEST .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py MATERIAL_WRITE .             --path docs/architecture-manifest.json --base-ref origin/main

      - name: Run focused Grade-9 exit falsifiers
        run: python -m unittest tests.test_grade9_exit

      - name: Prove protected domains unchanged
        run: |
          git diff --exit-code origin/main --             Shared/tools/learner_evidence.py             Shared/library             Shared/publication_host             Physics             Learners

      - name: Regenerate and check architecture manifest
        run: |
          python Shared/tools/build_manifest.py
          python Shared/tools/build_manifest.py --check

      - name: Commit generated manifest if changed
        run: |
          if git diff --quiet -- docs/architecture-manifest.json; then
            echo "architecture manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json
          git commit -m "docs: regenerate architecture manifest for Grade 9 exit view"
          git push origin HEAD:delivery/issue-169-grade9-exit-v31
