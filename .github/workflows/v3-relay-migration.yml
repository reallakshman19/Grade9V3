name: V3 relay migration bootstrap

on:
  push:
    branches:
      - fix/issue-169-grade9-exit-reconcile-v25
    paths:
      - '.github/workflows/v3-relay-migration.yml'

permissions:
  contents: write

jobs:
  bootstrap-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Grade9V3 branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-169-grade9-exit-reconcile-v25
          fetch-depth: 0
      - name: Checkout pinned Common V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 9c7b7cab8337e231c36d62453e1ed907da1c37d8
          path: .relay-common
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install relay dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Validate V2.5 source state for migration
        run: python .relay-common/skills/engineering-pr-delivery-v2.5/scripts/validate_repo_state.py .
      - name: Bootstrap staged V3 authority transaction
        run: |
          python .relay-common/skills/engineering-pr-delivery-v3/scripts/v25_migration.py . bootstrap \
            --tx-id TX-MIGRATE-G9EXIT-001 \
            --event-id EVT-MIGRATE-G9EXIT-001 \
            --actor chatgpt-sol-v3-migration-20260922 \
            --owner-outcome "Complete Grade9V3 Grade-9 Physics exit-readiness reconciliation and establish an evidence-honest Grade-10 transition under the delivered six-Core contract." \
            --current-goal "Reconcile Issue #169 on PR #181 by porting only valid Grade-9 exit logic, preserving categorical learner evidence and separating Core2B changed-demand availability, independent observation, and transition-requiredness."
      - name: Validate staged V3 foundation
        run: python .relay-common/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
      - name: Confirm protocol remains staged until cutover
        run: python .relay-common/skills/engineering-pr-delivery-v3/scripts/protocol_default.py .
      - name: Commit staged V3 migration
        run: |
          git config user.name "relay-v3-migration"
          git config user.email "relay-v3-migration@users.noreply.github.com"
          git add relay/
          git diff --cached --quiet && exit 0
          git commit -m "relay: bootstrap staged V3 authority"
          git push origin HEAD:fix/issue-169-grade9-exit-reconcile-v25
