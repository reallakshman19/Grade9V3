name: relay-continue-issue126-scope-correction
on:
  push:
    branches:
      - relay/continue-issue126-scope-correction
permissions:
  contents: write
jobs:
  continue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explorer/issue-126-circular-dynamics
          fetch-depth: 0
      - name: Ensure base ref
        run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1c168695f237a8bef184a9e189be80fab87d1e78
          path: _common_v31
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Release initial Issue 126 lease
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . release-lease \
            --tx-id TX-V31-ISS126-SCOPE-RELEASE-001 \
            --event-id EVT-V31-ISS126-SCOPE-RELEASE-001 \
            --actor chatgpt-sol-issue126-v31-20260923 \
            --reason ADMINISTRATIVE \
            --base-ref origin/main \
            --expected-custody-epoch 1
      - name: Build continuation admission
        run: |
          cat > /tmp/issue126-continuation.yaml <<'YAML'
          schema_version: relay-v3.1-task-admission
          roadmap:
            disposition: REVISED_EXISTING_WP
            new_revision: RM-V31-ISS126-CIRCULAR-DYNAMICS-002
            basis:
              - "Direct Owner continuation at 2026-09-23T06:15:40Z: proceed next."
              - "Exact-head guardrails run 35825854570 exposed three residual failures after all semantic/schema/compiler/generated checks passed."
              - "Two failures are stale audit expectations for intentional non-default R6; one reveals missing Core1A/Core1B route coverage for the new R6 microtopic."
              - "Current EP does not own the two stale-audit test files, so continuation is re-admitted instead of silently widening scope."
              - "Protocol basis remains Common@1c168695f237a8bef184a9e189be80fab87d1e78 Engineering Relay V3.1."
            work_package:
              id: WP-ISS126-CIRCULAR-DYNAMICS
              title: Deliver circular-dynamics force-role explorer without expanding default Grade-9 scope
              weight: 3
              state: ACTIVE
              depends_on:
                - WP-CANONICAL-174-MOTION
                - WP-CANONICAL-174-NLM
          ep:
            schema_version: relay-v3.1-ep
            id: EP-ISS126-CIRCULAR-DYNAMICS-V31-002
            work_package: WP-ISS126-CIRCULAR-DYNAMICS
            outcome:
              statement: "Finish Issue 126 on the existing PR 200 tree by preserving the R5 Grade-9 meaning/ceiling/default boundary, completing R6 self-study route coverage, and updating only the audit tests made stale by the intentional non-default R6 extension."
            basis:
              predecessor_checkpoint: null
              material_base: 468672368d963e1a27c091759fa52c6c5dac3339
              protocol_basis: "reallaksh19/Common@1c168695f237a8bef184a9e189be80fab87d1e78:skills/engineering-pr-delivery-v3.1"
              semantic_dependencies:
                - path: Physics/library/phy-kin-1d-motion.v1.json
                  reason: "Canonical R6 capability/microtopic/route owner."
                - path: Physics/matrices/phy-kin-1d-motion.rungs.json
                  reason: "R5/R6 default-boundary and strict ladder ordering."
                - path: Physics/library/phy-nlm-first-law.v1.json
                  reason: "Newton-II and friction dependencies."
                - path: Physics/gates/foundational-relations.v1.json
                  reason: "Circular quantitative authority."
                - path: docs/grade9/G9-1-MOTION-AUTHORING-AUDIT.md
                  reason: "Human-readable Grade-9 versus Owner-extension scope authority."
                - path: tests/test_grade9_default_extension_routing.py
                  reason: "Frozen audited non-default extension inventory surfaced by full guardrails."
                - path: tests/test_grade9_motion_scope.py
                  reason: "Frozen six-rung Grade-9 spine expectation surfaced by full guardrails."
                - path: tests/test_grade9_motion1d_vertical_gravity_agent_a_atlas.py
                  reason: "Session-readiness regression witness for route completeness."
            scope:
              write:
                - .github/workflows/v3-relay.yml
                - Physics/gates/foundational-relations.v1.json
                - Physics/library/phy-kin-1d-motion.v1.json
                - Physics/matrices/phy-kin-1d-motion.rungs.json
                - docs/grade9/G9-1-MOTION-AUTHORING-AUDIT.md
                - public/physics/motion-1d/explorers/circular-dynamics/index.html
                - tests/test_issue126_circular_dynamics_explorer.py
                - tests/test_gates.py
                - tests/test_issue19_physics_content.py
                - tests/test_grade9_physics_learner_loop.py
                - tests/test_library.py
                - tests/test_grade9_default_extension_routing.py
                - tests/test_grade9_motion_scope.py
                - tests/test_grade9_motion1d_vertical_gravity_agent_a_atlas.py
                - tools/data.js
                - public/data/data.js
                - docs/architecture-manifest.json
              read:
                - Physics/library/**
                - Physics/matrices/**
                - Physics/gates/**
                - Shared/library/**
                - Shared/tools/**
                - docs/grade9/**
                - tests/**
              protect:
                - Learners/**
                - Mathematics/**
                - Chemistry/**
                - agents/relay/**
                - Shared/publication_host/**
                - Shared/workbench/**
                - standalone/**
              prohibit:
                - "Do not remove or weaken R5's centripetal-force ceiling."
                - "Do not make R6 default_entry_eligible."
                - "Do not reinterpret the R5 100->99 coordinate-only adjustment as a syllabus or teaching downgrade."
                - "Do not add a separate centripetal-force arrow to inertial-frame FBDs."
                - "Do not assert static friction equals mu_s N except at the declared limiting boundary."
                - "Do not add rotating-frame centrifugal force without explicit non-inertial-frame labeling."
                - "Do not merge without a fresh accepted checkpoint and explicit Owner MERGE authority."
            acceptance:
              - id: AC-126-BOUNDARY
                statement: "R5 retains its elementary Grade-9 meaning, capability, ceiling and default eligibility; its ladder coordinate changes only from 100 to 99 to preserve strict prerequisite ordering, while R6 is a non-default Owner extension at 100."
                evidence_requirements:
                  - test: "tests/test_issue126_circular_dynamics_explorer.py::CircularDynamicsExplorerContract::test_r5_boundary_is_preserved_and_r6_is_nondefault"
                  - test: "tests/test_grade9_default_extension_routing.py"
                  - test: "tests/test_grade9_motion_scope.py"
              - id: AC-126-PHYSICS
                statement: "Radial acceleration, radial Newton-II, vertical-circle top/bottom, and minimum-speed claims are gate-owned; flat-curve capacity reuses the canonical static-friction bound."
                evidence_requirements:
                  - test: "tests/test_issue126_circular_dynamics_explorer.py::CircularDynamicsExplorerContract::test_quantitative_relations_are_gate_owned"
              - id: AC-126-FALLACY
                statement: "The canonical representation and explorer treat centripetal as the role of the net radial force, not an additional interaction."
                evidence_requirements:
                  - test: "tests/test_issue126_circular_dynamics_explorer.py::CircularDynamicsExplorerContract::test_no_extra_centripetal_force_arrow"
              - id: AC-126-EXPLORER
                statement: "Explorer visualizes velocity-direction change before forces and implements radial/tangential axes, m-v-r scaling, flat-curve threshold, tangent cut path, and vertical-circle transfer; R6 has complete Core1A/Core1B self-study route coverage."
                evidence_requirements:
                  - test: "tests/test_issue126_circular_dynamics_explorer.py"
                  - test: "tests/test_grade9_motion1d_vertical_gravity_agent_a_atlas.py::Grade9Motion1DVerticalGravityAgentAAtlas::test_matrix_remains_session_ready"
              - id: AC-126-SCOPE
                statement: "The slice remains circular dynamics only and does not alter learner state, exit readiness, Grade-10/11 scope, or Mathematics."
                evidence_requirements:
                  - oracle: "PR changed-file set and focused boundary tests."
              - id: AC-126-REPO
                statement: "Repository guardrails pass and v31-relay validates against exact Common@1c168695f237a8bef184a9e189be80fab87d1e78."
                evidence_requirements:
                  - oracle: "GitHub Actions guardrails + v31-relay on exact PR head."
              - id: AC-126-ROUTING
                statement: "Ordinary Grade-9 routing excludes R6, while explicit Owner extension routing remains available."
                evidence_requirements:
                  - test: "tests/test_grade9_default_extension_routing.py"
            quality_policy:
              level: STANDARD
              independent_review: OPTIONAL
            admission_policy:
              qualification: NOT_REQUIRED
              question_policy: NONE
            next:
              first_action: "Add the R6 Core1A/Core1B teaching route; revise only stale extension/scope tests to distinguish the six-rung required Grade-9 spine from non-default R6; regenerate manifest and rerun exact-head guardrails."
              stop_conditions:
                - "Stop if any fix makes R6 default or changes R5 teaching meaning/ceiling."
                - "Stop if guardrail repair requires changing learner state, Mathematics, Grade-10/11 scope, or shared routing semantics."
                - "Stop before merge without fresh checkpoint and explicit Owner MERGE authority."
          lease:
            id: LEASE-ISS126-CIRCULAR-DYNAMICS-V31-002
            executor_id: chatgpt-sol-issue126-v31-20260923
            method: DETERMINISTIC
            qualification: null
            owner_basis: null
            branch: explorer/issue-126-circular-dynamics
            recovery_after_seconds: 3600
            recovery_policy: TAKEOVER_AFTER_EXPIRY
          delivery:
            required: true
            primary_vehicle:
              provider: GITHUB
              kind: PULL_REQUEST
              number: 200
          YAML
      - name: Admit continuation transactionally
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . admit-task \
            --tx-id TX-V31-ISS126-SCOPE-ADMIT-002 \
            --event-id EVT-V31-ISS126-SCOPE-ADMIT-002 \
            --actor chatgpt-sol-issue126-v31-20260923 \
            --admission /tmp/issue126-continuation.yaml \
            --base-ref origin/main
      - name: Validate continuation authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate
      - name: Commit relay after-images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "relay: continue issue126 after guardrail scope correction"
          git push origin HEAD:explorer/issue-126-circular-dynamics
