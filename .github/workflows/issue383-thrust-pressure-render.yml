name: issue383-thrust-pressure-render

on:
  push:
    branches:
      - physics/thrust-pressure-competitive-383
    paths:
      - ".github/workflows/issue383-thrust-pressure-render.yml"
      - "Physics/library/phy-thrust-pressure.v1.json"
      - "Physics/library/exam-bank/thrust-pressure-competitive.v1.json"
      - "Physics/assets/representations/REP-PHY-THRUST-*.svg"
      - "Physics/assets/representations/REP-PHY-PRESSURE-*.svg"
      - "products/physics/phy-thrust-pressure.manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python render dependencies
        run: pip install --quiet jsonschema pypdf cffi

      - name: Install pinned Chromium harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build governed Core1A/Core2 HTML and PDFs
        id: build
        continue-on-error: true
        run: |
          python3 Shared/tools/build_products.py build --only phy-thrust-pressure --static

      - name: Run exact product browser audit
        if: steps.build.outcome == 'success'
        id: browser
        continue-on-error: true
        run: |
          node tools/site-audit/core-page-audit.mjs \
            publication/products/physics/phy-thrust-pressure \
            --http-root . \
            --json publication/products/physics/phy-thrust-pressure/browser-audit.json

      - name: Record exact-head render status
        if: always()
        run: |
          mkdir -p artifacts/issue383
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path("artifacts/issue383/render-status.json")
          out.write_text(json.dumps({
              "head": os.environ.get("GITHUB_SHA"),
              "manifest": "products/physics/phy-thrust-pressure.manifest.json",
              "build_outcome": "${{ steps.build.outcome }}",
              "browser_outcome": "${{ steps.browser.outcome }}",
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload governed product and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue383-thrust-pressure-${{ github.sha }}
          if-no-files-found: warn
          path: |
            publication/products/physics/phy-thrust-pressure/**
            publication/standalone/products/physics/phy-thrust-pressure.html
            publication/standalone/products/physics/phy-thrust-pressure.receipt.json
            artifacts/issue383/render-status.json

      - name: Enforce build result
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Enforce browser result
        if: steps.build.outcome == 'success' && steps.browser.outcome != 'success'
        run: exit 1
