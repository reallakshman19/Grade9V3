name: chemistry-integrate-once

on:
  push:
    branches: [feat/chemistry-tablet-standalone]
    paths:
      - ".github/workflows/chemistry-integrate-once.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chemistry-tablet-standalone
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: pip install --quiet jsonschema
      - name: Publish Chemistry Practice and register learner routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          out = root / 'public/standalone/practice/chemistry'
          out.mkdir(parents=True, exist_ok=True)
          copies = {
              'standalone/core1a-chemistry-behaviour-of-gases-tablet.html': 'behaviour-of-gases.html',
              'standalone/core1a-chemistry-chemical-bonding-tablet.html': 'chemical-bonding.html',
              'standalone/core1a-chemistry-redox-reactions-tablet.html': 'redox-reactions.html',
              'standalone/core1a-chemistry-some-basic-concepts-tablet.html': 'some-basic-concepts.html',
          }
          for source, target in copies.items():
              text = (root / source).read_text(encoding='utf-8')
              text = text.replace('../public/index.html', '../../../index.html')
              text = text.replace('../public/question-bank/index.html', '../../../question-bank/index.html?subject=Chemistry')
              (out / target).write_text(text, encoding='utf-8', newline='\n')

          hub = '''<!doctype html>
          <html lang="en" data-g9-shell>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <title>Chemistry Practice · Grade9V3</title>
            <link rel="stylesheet" href="../../../css/site.css">
            <link rel="stylesheet" href="../../../css/tablet-12-7.css">
            <style>
              body{margin:0;background:var(--bg);color:var(--text)}
              .practice-shell{max-width:1180px;margin:0 auto;padding:24px 18px 48px}
              .practice-hero{padding:20px 0 12px}.practice-hero h1{font-size:32px;margin:0 0 8px}
              .practice-hero p{font-size:16px;color:var(--text-muted);max-width:860px;line-height:1.6}
              .practice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
              .practice-card{border:1px solid var(--border);background:var(--bg-card);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
              .practice-card h2{font-size:20px;margin:0}.practice-card p{font-size:15px;line-height:1.55;color:var(--text-muted);margin:0}
              .practice-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}.practice-actions a{min-height:48px;display:inline-flex;align-items:center}
              .practice-meta{display:flex;gap:8px;flex-wrap:wrap}.practice-note{font-size:14px;color:var(--text-muted)}
              @media(max-width:720px){.practice-hero h1{font-size:28px}}
            </style>
          </head>
          <body>
          <header class="site-nav">
            <a href="../../../index.html" class="brand-link"><span class="logo-icon">⚡</span><span>Grade9V3 Knowledge Portal</span></a>
            <nav class="nav-links" aria-label="Primary">
              <a href="../../../index.html">Home</a><a href="../../../physics/index.html">Physics</a>
              <a href="../../../chemistry/index.html" class="active chem-link">Chemistry</a><a href="../../../mathematics/index.html">Mathematics</a>
              <a href="../../../question-bank/index.html?subject=Chemistry" data-site-question-bank>Question Bank</a>
            </nav>
          </header>
          <main class="practice-shell">
            <div class="breadcrumb"><a href="../../../index.html">Home</a><span class="sep">/</span><a href="../../../chemistry/index.html">Chemistry</a><span class="sep">/</span><span class="current">Practice</span></div>
            <section class="practice-hero">
              <div class="practice-meta"><span class="badge chem">Chemistry Practice</span><span class="badge ok">Blueprint 1.9</span><span class="badge neutral">Tablet-ready</span></div>
              <h1>🧪 Chemistry Practice Library</h1>
              <p>Four governed Core 1A concept books, paired with the subject-filtered canonical Question Bank. Redox and Mole Concept link directly to their admitted question collections; Bonding and Gases remain practice-only until canonical questions are admitted.</p>
              <div class="practice-actions"><a class="btn outline" href="../../../question-bank/index.html?subject=Chemistry">Browse 46 canonical Chemistry questions →</a></div>
            </section>
            <section class="practice-grid" aria-label="Chemistry practice modules">
              <article class="practice-card"><div class="practice-meta"><span class="badge chem">Core 1A</span><span class="badge ok">Gases</span></div><h2>Behaviour of Gases</h2><p>Gas-law models, molecular-speed reasoning, ideal/real-gas boundaries and validity conditions.</p><div class="practice-actions"><a class="btn primary-chem" href="behaviour-of-gases.html">Open Practice →</a></div><span class="practice-note">Canonical topic questions: not yet admitted.</span></article>
              <article class="practice-card"><div class="practice-meta"><span class="badge chem">Core 1A</span><span class="badge ok">Bonding</span></div><h2>Chemical Bonding &amp; Molecular Structure</h2><p>Lewis structures, VSEPR, formal charge, polarity, molecular orbital reasoning and hydrogen bonding.</p><div class="practice-actions"><a class="btn primary-chem" href="chemical-bonding.html">Open Practice →</a></div><span class="practice-note">Canonical topic questions: not yet admitted.</span></article>
              <article class="practice-card"><div class="practice-meta"><span class="badge chem">Core 1A</span><span class="badge ok">Redox</span></div><h2>Redox Reactions</h2><p>Oxidation-state bookkeeping, agent roles, reaction classification and half-reaction balancing.</p><div class="practice-actions"><a class="btn primary-chem" href="redox-reactions.html">Open Practice →</a><a class="btn outline" href="../../../question-bank/index.html?subject=Chemistry&amp;topic=Redox%20Reactions">26 canonical questions</a></div></article>
              <article class="practice-card"><div class="practice-meta"><span class="badge chem">Core 1A</span><span class="badge ok">Mole Concept</span></div><h2>Some Basic Concepts of Chemistry</h2><p>Mole scale, stoichiometry, concentration, limiting reagent and quantitative chemical reasoning.</p><div class="practice-actions"><a class="btn primary-chem" href="some-basic-concepts.html">Open Practice →</a><a class="btn outline" href="../../../question-bank/index.html?subject=Chemistry&amp;topic=Some%20Basic%20Concepts%20of%20Chemistry%20%2F%20Mole%20Concept%20%2F%20Stoichiometry">20 canonical questions</a></div></article>
            </section>
          </main>
          <script src="../../../js/site-header.js" data-site-root="../../../" data-site-parent="../../../chemistry/index.html"></script>
          </body></html>
          '''
          (out / 'index.html').write_text('\n'.join(line.strip() if line.startswith('          ') else line for line in hub.splitlines()) + '\n', encoding='utf-8')

          portal_path = root / 'public/chemistry/index.html'
          portal = portal_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          if 'Chemistry Practice Library' not in portal:
              marker = '''  <div class="chapter-card" style="margin-top: 18px;">
              <div class="chapter-header">
                <div class="chapter-title">
                  <span>🧪</span>
                  <span>Audited Chemistry Master Suites</span>'''
              practice = '''  <div class="chapter-card" style="margin-top: 18px; border-color: rgba(52, 211, 153, 0.45);">
              <div class="chapter-header">
                <div class="chapter-title"><span>🧪</span><span>Chemistry Practice Library</span></div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;"><span class="badge ok">Blueprint 1.9</span><span class="badge chem">4 Core 1A books</span></div>
              </div>
              <p style="color:var(--text-muted);font-size:14px;margin:0 0 14px;">Tablet-ready governed practice paired with the canonical Chemistry Question Bank. Redox and Mole Concept expose direct question hand-offs without duplicating question authority.</p>
              <div style="display:flex;gap:10px;flex-wrap:wrap;"><a class="btn primary-chem" href="../standalone/practice/chemistry/index.html">Open Chemistry Practice →</a><a class="btn outline" href="../question-bank/index.html?subject=Chemistry">Chemistry Question Bank</a></div>
            </div>
          '''
              if marker not in portal:
                  raise SystemExit('Chemistry portal insertion marker not found')
              portal = portal.replace(marker, practice + marker, 1)
              portal_path.write_text(portal, encoding='utf-8', newline='\n')

          resources_path = root / 'Chemistry/question-bank/resources.v1.json'
          resources = json.loads(resources_path.read_text(encoding='utf-8'))
          additions = [
              {'id':'RES-CHEM-PRACTICE-GASES','kind':'revision','title':'Behaviour of Gases · Core 1A Practice','topic':'JEE Main Chemistry · Gaseous State','path':'standalone/practice/chemistry/behaviour-of-gases.html','keywords':['chemistry','practice','gases','gas laws','kinetic theory','core1a','blueprint 1.9'],'order':30,'status':'PUBLISHED'},
              {'id':'RES-CHEM-PRACTICE-BONDING','kind':'revision','title':'Chemical Bonding · Core 1A Practice','topic':'JEE Main Chemistry · Chemical Bonding & Molecular Structure','path':'standalone/practice/chemistry/chemical-bonding.html','keywords':['chemistry','practice','chemical bonding','vsepr','molecular structure','core1a','blueprint 1.9'],'order':30,'status':'PUBLISHED'},
              {'id':'RES-CHEM-PRACTICE-REDOX','kind':'revision','title':'Redox Reactions · Core 1A Practice','topic':'Redox Reactions','path':'standalone/practice/chemistry/redox-reactions.html','keywords':['chemistry','practice','redox','oxidation state','balancing','core1a','blueprint 1.9'],'order':30,'status':'PUBLISHED'},
              {'id':'RES-CHEM-PRACTICE-MOLE','kind':'revision','title':'Mole Concept & Stoichiometry · Core 1A Practice','topic':'Some Basic Concepts of Chemistry / Mole Concept / Stoichiometry','path':'standalone/practice/chemistry/some-basic-concepts.html','keywords':['chemistry','practice','mole concept','stoichiometry','concentration','core1a','blueprint 1.9'],'order':30,'status':'PUBLISHED'},
          ]
          by_id = {row['id']: row for row in resources.get('resources', [])}
          for row in additions:
              by_id[row['id']] = row
          resources['resources'] = list(by_id.values())
          resources_path.write_text(json.dumps(resources, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          search_path = root / 'public/data/site-search-resources.js'
          raw = search_path.read_text(encoding='utf-8').strip()
          prefix = 'window.GRADE9_SITE_SEARCH_RESOURCES='
          if not raw.startswith(prefix):
              raise SystemExit('unexpected site-search-resources format')
          payload = raw[len(prefix):]
          if payload.endswith(';'):
              payload = payload[:-1]
          rows = json.loads(payload)
          new_search = [
              {'title':'Chemistry Practice Library','path':'standalone/practice/chemistry/index.html','kind':'practice','keywords':['chemistry','practice','standalone','tablet','offline','blueprint 1.9','redox','mole concept','stoichiometry','bonding','gases']},
              {'title':'Behaviour of Gases — Core 1A Practice','path':'standalone/practice/chemistry/behaviour-of-gases.html','kind':'practice','keywords':['chemistry','practice','gases','gas laws','kinetic theory','core1a']},
              {'title':'Chemical Bonding — Core 1A Practice','path':'standalone/practice/chemistry/chemical-bonding.html','kind':'practice','keywords':['chemistry','practice','bonding','vsepr','molecular structure','core1a']},
              {'title':'Redox Reactions — Core 1A Practice','path':'standalone/practice/chemistry/redox-reactions.html','kind':'practice','keywords':['chemistry','practice','redox','oxidation state','balancing','core1a']},
              {'title':'Mole Concept & Stoichiometry — Core 1A Practice','path':'standalone/practice/chemistry/some-basic-concepts.html','kind':'practice','keywords':['chemistry','practice','mole','stoichiometry','concentration','core1a']},
          ]
          by_path = {row['path']: row for row in rows}
          for row in new_search:
              by_path[row['path']] = row
          search_path.write_text(prefix + json.dumps(list(by_path.values()), ensure_ascii=False, separators=(',', ':')) + ';\n', encoding='utf-8')

          manifest_path = root / 'docs/.pages-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          mappings = [
              ('public/standalone/practice/chemistry/index.html','standalone/practice/chemistry/index.html'),
              ('public/standalone/practice/chemistry/behaviour-of-gases.html','standalone/practice/chemistry/behaviour-of-gases.html'),
              ('public/standalone/practice/chemistry/chemical-bonding.html','standalone/practice/chemistry/chemical-bonding.html'),
              ('public/standalone/practice/chemistry/redox-reactions.html','standalone/practice/chemistry/redox-reactions.html'),
              ('public/standalone/practice/chemistry/some-basic-concepts.html','standalone/practice/chemistry/some-basic-concepts.html'),
          ]
          targets = {row['target'] for row in manifest['files']}
          for source, target in mappings:
              if target not in targets:
                  manifest['files'].append({'source': source, 'target': target})
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test = '''from pathlib import Path
          import json, unittest
          ROOT=Path(__file__).resolve().parents[1]
          class ChemistryPracticeIntegration(unittest.TestCase):
              def test_practice_projection_and_search(self):
                  folder=ROOT/'public/standalone/practice/chemistry'
                  for name in ('index.html','behaviour-of-gases.html','chemical-bonding.html','redox-reactions.html','some-basic-concepts.html'):
                      self.assertTrue((folder/name).is_file(), name)
                  hub=(folder/'index.html').read_text(encoding='utf-8')
                  self.assertIn('subject=Chemistry', hub)
                  self.assertIn('26 canonical questions', hub)
                  self.assertIn('20 canonical questions', hub)
                  raw=(ROOT/'public/data/site-search-resources.js').read_text(encoding='utf-8').strip()
                  rows=json.loads(raw.split('=',1)[1].rstrip(';'))
                  paths={row['path'] for row in rows}
                  self.assertTrue({f'standalone/practice/chemistry/{name}' for name in ('index.html','behaviour-of-gases.html','chemical-bonding.html','redox-reactions.html','some-basic-concepts.html')} <= paths)
              def test_question_bank_resource_links(self):
                  doc=json.loads((ROOT/'Chemistry/question-bank/resources.v1.json').read_text(encoding='utf-8'))
                  ids={row['id'] for row in doc['resources']}
                  self.assertTrue({'RES-CHEM-PRACTICE-GASES','RES-CHEM-PRACTICE-BONDING','RES-CHEM-PRACTICE-REDOX','RES-CHEM-PRACTICE-MOLE'} <= ids)
          if __name__=='__main__': unittest.main()
          '''
          (root/'tests/test_chemistry_practice_integration.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n', encoding='utf-8')
          PY
      - name: Rebuild canonical browser, Question Bank resources and search indexes
        run: |
          python3 Shared/tools/build_question_bank_web.py
          python3 Shared/tools/build_question_bank_platform.py --write
          python3 Shared/tools/build_search_index.py \
            --library-dirs Physics/library Chemistry/library Mathematics/library \
            --output-index public/data/search-index.v1.json \
            --output-manifest public/data/search-index-manifest.v1.json
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py
      - name: Verify Chemistry practice and Blueprint 1.9 conformance
        run: |
          python3 -m unittest tests.test_chemistry_tablet_standalone tests.test_chemistry_practice_integration
          python3 Shared/tools/standalone_conformance.py \
            standalone/core1a-chemistry-behaviour-of-gases-tablet.html \
            standalone/core1a-chemistry-chemical-bonding-tablet.html \
            standalone/core1a-chemistry-redox-reactions-tablet.html \
            standalone/core1a-chemistry-some-basic-concepts-tablet.html \
            public/standalone/practice/chemistry/index.html \
            public/standalone/practice/chemistry/behaviour-of-gases.html \
            public/standalone/practice/chemistry/chemical-bonding.html \
            public/standalone/practice/chemistry/redox-reactions.html \
            public/standalone/practice/chemistry/some-basic-concepts.html \
            --enforce
          python3 Shared/tools/verify_search_index.py \
            --index public/data/search-index.v1.json \
            --manifest public/data/search-index-manifest.v1.json \
            --library-dirs Physics/library Chemistry/library Mathematics/library \
            --enforce
          python3 Shared/tools/build_pages_site.py --check
      - name: Commit deterministic integration result
        run: |
          rm .github/workflows/chemistry-integrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(chemistry): publish Blueprint 1.9 practice and QB integration"
          git push origin HEAD:feat/chemistry-tablet-standalone
