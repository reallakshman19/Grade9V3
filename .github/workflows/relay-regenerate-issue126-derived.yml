name: relay-regenerate-issue126-derived
on:
  push:
    branches:
      - relay/regenerate-issue126-derived
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explorer/issue-126-circular-dynamics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate repository-derived artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Enforce generated-write whitelist
        run: |
          allowed='^(docs/architecture-manifest\.json|tools/data\.js|public/data/data\.js)$'
          bad="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "Generator changed out-of-scope files:"
            echo "$bad"
            exit 1
          fi
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js public/data/data.js
          if git diff --cached --quiet; then
            echo "No generated drift"
            exit 0
          fi
          git commit -m "chore: regenerate issue126 derived artifacts"
          git push origin HEAD:explorer/issue-126-circular-dynamics
