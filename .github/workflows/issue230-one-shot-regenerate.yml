name: issue230-one-shot-regenerate

on:
  push:
    branches:
      - issue-212-214-motion-portable-declaration

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-212-214-motion-portable-declaration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet jsonschema
      - name: Regenerate Atlas and repository artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit generated bytes and remove one-shot workflow
        run: |
          rm .github/workflows/issue230-one-shot-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[#212][#214] Regenerate Atlas portable declaration artifacts"
          git push origin HEAD:issue-212-214-motion-portable-declaration
