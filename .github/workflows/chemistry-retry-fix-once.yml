name: chemistry-retry-fix-once

on:
  push:
    branches: [feat/chemistry-tablet-standalone]
    paths:
      - ".github/workflows/chemistry-retry-fix-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chemistry-tablet-standalone
      - name: Repair generated test indentation and retrigger integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/chemistry-integrate-once.yml')
          s=p.read_text(encoding='utf-8')
          pattern=r"\(root/'tests/test_chemistry_practice_integration\.py'\)\.write_text\([^\n]+encoding='utf-8'\)"
          replacement="(root/'tests/test_chemistry_practice_integration.py').write_text(__import__('textwrap').dedent(test).lstrip(), encoding='utf-8')"
          s2,n=re.subn(pattern,replacement,s,count=1)
          if n != 1:
              raise SystemExit(f'expected one test-writer replacement, got {n}')
          p.write_text(s2,encoding='utf-8',newline='\n')
          PY
          rm .github/workflows/chemistry-retry-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(chemistry): dedent generated integration test"
          git push origin HEAD:feat/chemistry-tablet-standalone
