              - "Current main advanced to bf20357037f2e9a916a4fa42ea83a075d6ed0351 only through disjoint competitive-exam template files."
              - "EP-002 material_base was branch-local and therefore could not be checkpointed against current main; custody was administratively released."
              - "Branch 7f8090782e50183449cad5026e4eb85cd637807c now has current main as an ancestor with the two disjoint template updates incorporated."
              - "No Issue 126 product semantics changed during the base reconciliation."
            work_package:
