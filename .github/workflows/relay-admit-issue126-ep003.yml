        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . admit-task             --tx-id TX-V31-ADMIT-ISS126-003             --event-id EVT-V31-ADMIT-ISS126-003             --actor chatgpt-sol-issue126-v31-20260923             --admission /tmp/issue126-ep003.yaml             --base-ref origin/main
