            id: EP-ISS126-CIRCULAR-DYNAMICS-V31-003
            work_package: WP-ISS126-CIRCULAR-DYNAMICS
            outcome:
              statement: "Finish Issue 126 on PR 200 by preserving the R5 Grade-9 meaning/ceiling/default boundary, keeping R6 non-default, and accepting the already-green circular-dynamics force-role explorer against a material basis that is an ancestor of current main."
            basis:
