name: relay-readmit-issue211-test-baseline
on:
  push:
    branches:
      - relay/readmit-issue211-test-baseline
permissions:
  contents: write
jobs:
  readmit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readiness/issue-211-core-contracts
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1c168695f237a8bef184a9e189be80fab87d1e78
          path: _common_v31
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Release EP-001 custody for bounded scope reconciliation
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . release-lease             --tx-id TX-V31-ISS211-SCOPE-RELEASE-002             --event-id EVT-V31-ISS211-SCOPE-RELEASE-002             --actor chatgpt-sol-issue211-v31-20260923             --reason ADMINISTRATIVE             --base-ref origin/main             --expected-custody-epoch 1
      - name: Build EP-002 admission
        run: |
          cat > /tmp/issue211-readmission.yaml <<'YAML'
          schema_version: relay-v3.1-task-admission
          roadmap:
            disposition: MAPPED_EXISTING_WP
            new_revision: RM-V31-ISS211-CORE-READINESS-002
            basis:
              - "Gate-1 exact-head guardrails exposed three pre-existing current-main test-harness failures from merged Issue 126."
              - "All five Issue-211 Core readiness falsifiers passed; no Core production-code defect was demonstrated."
              - "Scope expansion is test-harness-only and does not authorize Physics canonical truth changes."
              - "Protocol basis remains Common@1c168695f237a8bef184a9e189be80fab87d1e78."
            work_package:
              id: WP-ISS211-CORE-READINESS
              title: Audit and harden six-Core projection and host contracts
              weight: 4
              state: ACTIVE
              depends_on:
                - WP-LEARNER-175-PRODUCTION
                - WP-PORTABLE-163
          ep:
            schema_version: relay-v3.1-ep
            id: EP-ISS211-CORE-READINESS-V31-002
            work_package: WP-ISS211-CORE-READINESS
            outcome:
              statement: "Finish Gate 1 by preserving the already-correct subject-neutral Core contracts, retaining the Issue-211 contract map/falsifiers, and reconciling three stale current-main test expectations introduced by merged circular-dynamics truth without modifying Physics canonical data."
            basis:
              predecessor_checkpoint: CP-ISS125-ACCELERATED-FRAMES-V31-001
              material_base: c768c53270b559297d316ead70f50ef6e7a99ba9
              protocol_basis: "reallaksh19/Common@1c168695f237a8bef184a9e189be80fab87d1e78:skills/engineering-pr-delivery-v3.1"
              semantic_dependencies:
                - path: Shared/library/compile_inputs.py
                  reason: "Six-Core compiler authority."
                - path: Shared/tools/core_learning_projection_adapter.py
                  reason: "Interactive A/B projection seam."
                - path: Shared/tools/build_core_learning_data.py
                  reason: "Bucket availability and projection builder."
                - path: Shared/workbench/core-learning-page.mjs
                  reason: "Reveal/support state-machine authority."
                - path: tests/test_gates.py
                  reason: "Executable gate-falsifier inventory must cover merged circular-dynamics gate."
                - path: tests/test_issue19_physics_content.py
                  reason: "Frozen Grade-9 Owner-extension gate inventory must reflect merged canonical gates."
                - path: tests/test_library.py
                  reason: "Renderer-backlog expectation must reflect current canonical representation inventory."
            scope:
              write:
                - Shared/library/package.schema.json
                - Shared/library/matrix.schema.json
                - Shared/library/request.schema.json
                - Shared/library/compile_inputs.py
                - Shared/tools/core_learning_projection_adapter.py
                - Shared/tools/build_core_learning_data.py
                - Shared/workbench/core-learning-page.mjs
                - Shared/workbench/core-learning-host.mjs
                - tests/test_core_learning_adapter.py
                - tests/core_learning_page.test.mjs
                - tests/core_learning_host.test.mjs
                - tests/test_issue211_core_readiness.py
                - tests/test_gates.py
                - tests/test_issue19_physics_content.py
                - tests/test_library.py
                - public/core-learning/data.js
                - docs/readiness/CORE-CONTRACT-MAP.md
                - docs/architecture-manifest.json
              read:
                - Shared/library/**
                - Shared/tools/**
                - Shared/workbench/**
                - Physics/library/**
                - Physics/matrices/**
                - Physics/gates/**
                - public/core-learning/**
                - tests/**
              protect:
                - Learners/**
                - Physics/library/**
                - Physics/matrices/**
                - Physics/gates/**
                - Chemistry/**
                - Mathematics/**
                - Shared/portable/**
                - public/js/topic-atlas.js
                - tools/data.js
                - public/data/data.js
                - standalone/**
                - agents/relay/**
              prohibit:
                - "Do not change Physics canonical truth to make stale tests pass."
                - "Do not create new subject content or add a seventh Core."
                - "Do not infer Core roles from browser text or raw DOM."
                - "Do not add subject-specific identifier switches in Shared code."
                - "Do not interpret interaction events as learner mastery."
                - "Do not disclose the Core2B protected move before learner commitment."
                - "Do not silently omit unsupported buckets."
                - "Do not merge before an accepted checkpoint and explicit Owner MERGE authority."
            acceptance:
              - id: AC-211-MAP
                statement: "A reviewer-readable Core contract map records Core1/Core2, A/B semantics, ownership, version seams, input/output fields and current PASS/PARTIAL/MISSING evidence."
                evidence_requirements:
                  - oracle: "docs/readiness/CORE-CONTRACT-MAP.md exists and records PASS/PARTIAL/MISSING evidence for every Gate-1 requirement."
              - id: AC-211-REVEAL
                statement: "Core1B attempt-before-reveal and Core2B protected-decision semantics remain distinct and are falsified by focused tests."
                evidence_requirements:
                  - test: tests/test_issue211_core_readiness.py
                  - test: tests/core_learning_page.test.mjs
              - id: AC-211-SOURCE
                statement: "Core2 source identity, options/subparts, reasoning crux and independent check survive compilation/projection without invented custody."
                evidence_requirements:
                  - test: tests/test_core_learning_adapter.py
                  - test: tests/test_issue211_core_readiness.py
              - id: AC-211-FAILCLOSED
                statement: "Missing or incompatible refs/bindings and unsupported buckets produce named findings rather than silent absence or plausible fallback."
                evidence_requirements:
                  - test: tests/test_issue211_core_readiness.py
              - id: AC-211-NEUTRAL
                statement: "Shared Core code remains subject-neutral with no topic-specific switches and no academic-validity or mastery decisions moved into visual runtime."
                evidence_requirements:
                  - oracle: "python Shared/tools/topic_independence_guard.py"
              - id: AC-211-REPO
                statement: "Focused Python/Node suites, generated-artifact freshness, manifest check, and repository guardrails pass on the exact PR head, including reconciled current-main circular-dynamics baseline tests."
                evidence_requirements:
                  - oracle: "GitHub Actions guardrails + v31-relay on exact PR head."
            quality_policy:
              level: STANDARD
              independent_review: OPTIONAL
            admission_policy:
              qualification: NOT_REQUIRED
              question_policy: NONE
            next:
              first_action: "Update only the three stale test-harness expectations proven by current-main circular-dynamics truth, then rerun exact-head guardrails."
              stop_conditions:
                - "Stop if any repair requires changing Physics canonical truth."
                - "Stop if any Issue-211 Core falsifier fails after baseline reconciliation."
                - "Stop if projection envelope changes become necessary without a migration."
                - "Stop before merge without accepted checkpoint and explicit Owner MERGE authority."
          lease:
            id: LEASE-ISS211-CORE-READINESS-V31-002
            executor_id: chatgpt-sol-issue211-v31-20260923
            method: DETERMINISTIC
            qualification: null
            owner_basis: null
            branch: readiness/issue-211-core-contracts
            recovery_after_seconds: 3600
            recovery_policy: TAKEOVER_AFTER_EXPIRY
          delivery:
            required: true
            primary_vehicle:
              provider: GITHUB
              kind: PULL_REQUEST
              number: 219
          YAML
      - name: Admit EP-002
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . admit-task             --tx-id TX-V31-ADMIT-ISS211-002             --event-id EVT-V31-ADMIT-ISS211-002             --actor chatgpt-sol-issue211-v31-20260923             --admission /tmp/issue211-readmission.yaml             --base-ref origin/main
      - name: Validate authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate
      - name: Commit Relay scope reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "relay: reconcile issue211 test baseline scope"
          git push origin HEAD:readiness/issue-211-core-contracts
