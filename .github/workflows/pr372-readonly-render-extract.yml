name: pr372-readonly-render-extract

on:
  push:
    paths:
      - .github/workflows/pr372-readonly-render-extract.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR372 head read-only
        uses: actions/checkout@v4
        with:
          ref: edba5daf43371b4f5142ccc3ae16a1a1af6ba7a6
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render exact Motion in 2D Core1A/Core2 pages
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from Shared.tools import render_core

          manifest = Path("products/physics/phy-kin-2d-motion.manifest.json")
          pages, gaps, digest = render_core.build(manifest, mode="PAGES")
          if gaps:
              raise SystemExit("render gaps: " + json.dumps(gaps, indent=2))
          out = Path("artifacts/pr372-render")
          out.mkdir(parents=True, exist_ok=True)
          for name in ("core1a.html", "core2.html"):
              data = pages[name].encode("utf-8")
              (out / name).write_bytes(data)
          meta = {
              "source_pr": 372,
              "source_head": "edba5daf43371b4f5142ccc3ae16a1a1af6ba7a6",
              "manifest": manifest.as_posix(),
              "mode": "PAGES",
              "render_digest": digest,
              "core1a_sha256": hashlib.sha256((out / "core1a.html").read_bytes()).hexdigest(),
              "core2_sha256": hashlib.sha256((out / "core2.html").read_bytes()).hexdigest(),
          }
          (out / "metadata.json").write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(meta, indent=2))
          PY
      - name: Upload exact PR372 rendered HTML
        uses: actions/upload-artifact@v4
        with:
          name: pr372-motion2d-core1a-core2-html
          path: artifacts/pr372-render/
          if-no-files-found: error
