name: Projectile stress regenerate
on:
  push:
    branches: [motion2d-six-core-20260926]
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion2d-six-core-20260926
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade jsonschema
      - name: Regenerate derived repository outputs
        run: |
          python3 Shared/tools/build_question_bank_web.py
          python3 Shared/tools/build_web_data.py
          python3 Shared/tools/build_core_learning_data.py
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
      - name: Run required validation
        run: |
          python3 Shared/tools/escape_state_guard.py
          python3 Shared/tools/core_template_contract.py
          python3 Shared/tools/core_authority_contract.py
          python3 Shared/tools/topic_independence_guard.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_projectile_stress_delivery -v
      - name: Commit generated files
        run: |
          git config user.name "grade9v3-regenerator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate projectile stress derived outputs [generated]"
            git push origin HEAD:motion2d-six-core-20260926
          fi
