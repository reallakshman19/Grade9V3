name: relay-release-issue126-ep002
on:
  push:
    branches:
      - relay/release-issue126-ep002
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explorer/issue-126-circular-dynamics
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1c168695f237a8bef184a9e189be80fab87d1e78
          path: _common_v31
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Release stale execution custody
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . release-lease             --tx-id TX-V31-ISS126-BASE-RELEASE-003             --event-id EVT-V31-ISS126-BASE-RELEASE-003             --actor chatgpt-sol-issue126-v31-20260923             --reason ADMINISTRATIVE             --base-ref origin/main             --expected-custody-epoch 1
      - name: Validate released foundation
        run: python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
      - name: Commit release after-images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "relay: release issue126 ep002 for base reconciliation"
          git push origin HEAD:explorer/issue-126-circular-dynamics
