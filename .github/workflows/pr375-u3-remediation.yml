          s=rd('standalone/practice/core2-motion-in-a-plane-tablet.html'); need(s.count('class="question-stem-card"')==59,'59 stems not restored'); need(s.count('class="opt-text"')==236,'236 options not restored'); need('Auto-expand solution' not in s,'option still auto-reveals solution')
          for p in math_pages: need('data-u3-katex-runtime' in rd(p),f'{p}: KaTeX runtime missing')
          for p in pages: need('data-u3-print-fix' in rd(p),f'{p}: print fix missing')
          print('U3 patched files:',len(set(changed)))
          for p in sorted(set(changed)): print(p)
          PY
          git diff --check

      - name: Install Chromium verifier
        shell: bash
        run: |
          npm install -g playwright@1.56.1
          playwright install chromium

      - name: Verify U3 runtime
