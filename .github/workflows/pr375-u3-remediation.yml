              body=m.group(2); need('question-stem-card' not in body,f'{q}: already patched')
              pos=body.find('</header>'); need(pos>=0,f'{q}: header missing'); pos+=9
              conditions=''.join(f'<li>{html.escape(str(x))}</li>' for x in cond if str(x).strip())
              block=f'<section class="question-stem-card" aria-label="Question stem"><div class="question-stem-label">Question</div><p class="question-stem-text">{html.escape(stem)}</p>'+(f'<ul class="question-condition-list">{conditions}</ul>' if conditions else '')+'</section>'
              body=body[:pos]+block+body[pos:]
              buttons=[]
              for i,v in enumerate(opts):
                  L=chr(65+i); txt=re.sub(rf'^\s*(?:\({L}\)|{L}[\.\):])\s*','',str(v).strip(),count=1,flags=re.I)
                  need(txt,f'{q}: option {L} empty'); buttons.append(f'<button class="opt-btn" data-opt="{L}"><span class="opt-letter">{L}</span><span class="opt-text">{html.escape(txt)}</span></button>')
              rowhtml='<div class="option-selector-row">'+''.join(buttons)+'</div>'
              body,c=re.subn(r'<div class="option-selector-row">\s*<button class="opt-btn" data-opt="A">.*?</button>\s*<button class="opt-btn" data-opt="B">.*?</button>\s*<button class="opt-btn" data-opt="C">.*?</button>\s*<button class="opt-btn" data-opt="D">.*?</button>\s*</div>',rowhtml,body,count=1,flags=re.S)
              need(c==1,f'{q}: option row not replaced')
              s=s[:m.start()]+m.group(1)+body+m.group(3)+s[m.end():]
          css='''<style data-u3-question-content>.question-stem-card{margin:14px 0;padding:16px 18px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;background:var(--bg-surface)}.question-stem-label{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}.question-stem-text{margin:0;font-size:16px;line-height:1.58;color:var(--text-primary)}.question-condition-list{margin:10px 0 0;padding-left:1.25rem;color:var(--text-secondary);line-height:1.5}.option-selector-row{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px!important}.opt-btn{justify-content:flex-start!important;text-align:left!important;gap:10px!important;min-height:52px!important;height:auto!important;white-space:normal!important;padding:10px 12px!important}.opt-letter{display:inline-grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:1px solid currentColor;font-weight:850}.opt-text{display:block;line-height:1.4}@media(max-width:720px){.option-selector-row{grid-template-columns:1fr}}</style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          a="""    const correctOpt = card.getAttribute('data-correct-opt');\n    const optBtns = card.querySelectorAll('.opt-btn');\n    const solDetails = card.querySelector('details.solution-reveal');\n\n    optBtns.forEach(btn => {\n"""
          b="""    const correctOpt = card.getAttribute('data-correct-opt');\n    const optBtns = card.querySelectorAll('.opt-btn');\n    const solDetails = card.querySelector('details.solution-reveal');\n    const qNum = card.getAttribute('data-question');\n    const storedChoice = qNum ? g9SafeStorage.getItem(`g9_c2_q${qNum}_opt`) : null;\n    if (storedChoice) { const restored=[...optBtns].find(x=>x.getAttribute('data-opt')===storedChoice); if(restored) restored.classList.add(storedChoice===correctOpt?'selected-correct':'selected-incorrect'); }\n\n    optBtns.forEach(btn => {\n"""
          need(a in s,'core2 option init anchor missing'); s=s.replace(a,b,1)
          a="""        // Auto-expand solution\n        if (solDetails) {\n          solDetails.open = true;\n        }\n"""; need(a in s,'core2 auto-open anchor missing'); s=s.replace(a,"        if (qNum) g9SafeStorage.setItem(`g9_c2_q${qNum}_opt`, choice);\n",1)
          a="""      submitBtn.addEventListener('click', () => {\n        const text = textarea.value.trim();\n        if (text) {\n"""; b="""      submitBtn.addEventListener('click', () => {\n        const text = textarea.value.trim();\n        const selected = card.querySelector('.opt-btn.selected-correct, .opt-btn.selected-incorrect');\n        if (!text && !selected) { textarea.focus(); return; }\n        if (text) {\n"""; need(a in s,'core2 submit anchor missing'); s=s.replace(a,b,1)
          a="        g9SafeStorage.removeItem(`g9_c2_q${qNum}`);\n"; need(a in s,'core2 clear anchor missing'); s=s.replace(a,a+"        g9SafeStorage.removeItem(`g9_c2_q${qNum}_opt`);\n",1)
          wr(p,s)

          # U3-6/U3-12: fixed-size arrowheads, expanded canvas, readable/deconflicted labels, and concept state persistence.
          for p in ['standalone/core2-physics-thrust-pressure-tablet.html','standalone/practice/core2-physics-thrust-pressure-tablet.html']:
              s=rd(p); s,c=re.subn(r'<marker(?![^>]*\bmarkerUnits=)','<marker markerUnits="userSpaceOnUse"',s); need(c>0,f'{p}: markers missing')
              need(s.count('viewBox="0 0 440 300"')>=6,f'{p}: concept viewboxes missing'); s=s.replace('viewBox="0 0 440 300"','viewBox="0 0 560 340"')
              fix='''<style data-u3-svg-fix>figure[data-g9-figure] svg text{font-size:14px!important;paint-order:stroke;stroke:var(--card,#fff);stroke-width:3px;stroke-linejoin:round}figure[data-g9-figure] svg{overflow:visible}</style><script data-u3-svg-layout>(()=>{const ov=(a,b,p=4)=>!(a.x+a.width+p<=b.x||b.x+b.width+p<=a.x||a.y+a.height+p<=b.y||b.y+b.height+p<=a.y);function go(svg){if(!svg||svg.dataset.u3Busy==='1')return;svg.dataset.u3Busy='1';try{const v=svg.viewBox.baseVal;if(!v?.width)return;const ts=[...svg.querySelectorAll('text')].filter(t=>t.getClientRects().length);for(const t of ts){if(!t.dataset.u3x){t.dataset.u3x=t.getAttribute('x')||'0';t.dataset.u3y=t.getAttribute('y')||'0'}t.setAttribute('x',t.dataset.u3x);t.setAttribute('y',t.dataset.u3y);t.removeAttribute('transform')}const done=[];for(const t of ts){let b;try{b=t.getBBox()}catch(_){continue}let dx=0,dy=0;if(b.x<v.x+8)dx+=v.x+8-b.x;if(b.x+b.width>v.x+v.width-8)dx-=b.x+b.width-(v.x+v.width-8);if(b.y<v.y+8)dy+=v.y+8-b.y;if(b.y+b.height>v.y+v.height-8)dy-=b.y+b.height-(v.y+v.height-8);for(let k=0;k<12;k++){t.setAttribute('transform',`translate(${dx} ${dy})`);b=t.getBBox();const h=done.find(x=>ov(b,x));if(!h)break;const d=(h.y+h.height+7)-b.y,u=(h.y-7)-(b.y+b.height);dy+=(b.y+d+b.height<=v.y+v.height-8)?d:u}try{done.push(t.getBBox())}catch(_){}}}finally{svg.dataset.u3Busy='0'}}function install(){for(const svg of [...document.querySelectorAll('article[data-g9-role="CORE1A"] figure[data-g9-figure] svg')].slice(0,6)){go(svg);new MutationObserver(()=>requestAnimationFrame(()=>go(svg))).observe(svg,{subtree:true,childList:true,attributes:true,attributeFilter:['x','y','display','class']})}}document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(install))})();</script>'''
              s=s.replace('</head>',fix+'\n</head>',1)
              need("function saveCore2State(a){if(a.dataset.g9Role!=='CORE2')return;" in s,f'{p}: save guard missing'); s=s.replace("function saveCore2State(a){if(a.dataset.g9Role!=='CORE2')return;","function saveCore2State(a){if(!a?.dataset.g9Unit)return;",1)
              need("function restoreCore2State(a,lock){if(a.dataset.g9Role!=='CORE2')return;" in s,f'{p}: restore guard missing'); s=s.replace("function restoreCore2State(a,lock){if(a.dataset.g9Role!=='CORE2')return;","function restoreCore2State(a,lock){if(!a?.dataset.g9Unit)return;",1)
              wr(p,s)

          # U3-8: do not reveal worked answers for empty attempts.
          p='standalone/practice/core1a-sba-06-07-trajectory-and-height-tablet.html'; s=rd(p)
          a="""    btn.addEventListener('click', () => {\n      const parent = btn.closest('.workspace-box');\n      const rev = parent?.querySelector('details.solution-reveal');\n      if (rev) rev.open = true;\n    });\n"""; b="""    btn.addEventListener('click', () => {\n      const parent = btn.closest('.workspace-box');\n      const ta = parent?.querySelector('.faded-textarea');\n      const rev = parent?.querySelector('details.solution-reveal');\n      if (!ta || !ta.value.trim()) { ta?.focus(); return; }\n      if (rev) rev.open = true;\n    });\n"""; need(a in s,f'{p}: check handler missing'); wr(p,s.replace(a,b,1))
          p='standalone/practice/physics-motion-in-a-plane-interactive-suite.html'; s=rd(p)
          a="onclick=\"document.getElementById('reconAnswer').style.display='block'; if(window.renderAllMath) window.renderAllMath();\">Check Understanding</button>"; b="onclick=\"const v=document.getElementById('reconInput'); if(!v.value.trim()){v.focus();return;} document.getElementById('reconAnswer').style.display='block'; if(window.renderAllMath) window.renderAllMath();\">Check Understanding</button>"; need(a in s,f'{p}: check-understanding anchor missing'); wr(p,s.replace(a,b,1))

          # U3-9: numeric prediction fields must reject arbitrary text/units.
          p='standalone/practice/core2a-projectile-study.html'; s=rd(p)
          a='const round = (value, digits = 2) => Number(value.toFixed(digits));\n'; need(a in s,f'{p}: round anchor missing'); s=s.replace(a,a+'const isNumericPrediction = (value) => /^[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)(?:e[+-]?\\d+)?$/i.test(String(value ?? "").trim());\n',1)
          a='''    if (action === "commit") {\n      try { this._dispatchStudy({ type: "COMMIT_ATTEMPT" }); }\n      catch (error) { this._announce(error.code === "GENUINE_ATTEMPT_REQUIRED" ? "Make a prediction before you commit." : error.message); }\n      return;\n    }\n'''; b='''    if (action === "commit") {\n      if ((this.state.owner === "Q21" || this.state.owner === "Q23") && !isNumericPrediction(this.state.attempt)) { this._announce("Enter a numerical prediction without units before you commit."); this.shadowRoot?.querySelector("[data-attempt-text]")?.focus(); return; }\n      try { this._dispatchStudy({ type: "COMMIT_ATTEMPT" }); }\n      catch (error) { this._announce(error.code === "GENUINE_ATTEMPT_REQUIRED" ? "Make a prediction before you commit." : error.message); }\n      return;\n    }\n'''; need(a in s,f'{p}: commit anchor missing'); wr(p,s.replace(a,b,1))

          # U3-7/U3-10: print is content-only; provide an explicit favicon to stop fallback 404s.
          print_css='''<style data-u3-print-fix>@media print{[data-g9-shell-header],[data-g9-breadcrumb],.practice-hub-link,.hub-return,#theme-toggle-btn,#themeToggle,.theme-toggle,.theme-toggle-btn,.search-bar,.search-box,.search-container,.search-controls,.filter-bar,.tab-nav,.tab-bar,.tabs,.topic-tabs,.filter-tabs,.jump-nav,.jump-controls,#jump-select,#search-input,#clear-search-btn,.g9-cu-nav,.g9-stage-controls,.workspace-actions,.attempt-actions,.controls,.angle-picker,.open-btn,[data-g9-action="search"],[data-g9-action="display"]{display:none!important}html,body{overflow:visible!important}main,.container,.main-container{max-width:none!important;width:auto!important}article,figure,.solution-card,.formula-card{break-inside:avoid}}</style>'''
          icon='<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ctext y=%2252%22 font-size=%2252%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">'
          for p in pages:
