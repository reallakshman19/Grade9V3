name: pr375-u3-remediation

on:
  push:
    branches: [feat/physics-tablet-standalone]
    paths: [.github/workflows/pr375-u3-remediation.yml]

permissions:
  contents: write

concurrency:
  group: pr375-u3-remediation
  cancel-in-progress: false

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply U3 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, json, re, subprocess

          old_head='46c667db4b23e3a5fb00c588825ea28bf60987c4'
          changed=[]
          def rd(p): return Path(p).read_text(encoding='utf-8')
          def wr(p,s):
              q=Path(p); old=q.read_text(encoding='utf-8')
              if old!=s: q.write_text(s,encoding='utf-8'); changed.append(p)
          def need(c,m):
              if not c: raise RuntimeError(m)

          base=subprocess.check_output(['git','merge-base','origin/main','HEAD'],text=True).strip()
          pages=subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','standalone'],text=True).splitlines()
          pages=[p for p in pages if p.endswith('.html') and (p.count('/')==1 or p.startswith('standalone/practice/'))]
          need(len(pages)==20,f'expected 20 standalone HTML pages, got {len(pages)}: {pages}')

          safe='''<script data-u3-safe-storage>\nconst g9SafeStorage=window.g9SafeStorage=(()=>{const s=()=>{try{return window["localStorage"]}catch(_){return null}};return{getItem:k=>{try{const x=s();return x?x.getItem(k):null}catch(_){return null}},setItem:(k,v)=>{try{const x=s();if(x)x.setItem(k,v)}catch(_){}},removeItem:k=>{try{const x=s();if(x)x.removeItem(k)}catch(_){}},clear:()=>{try{const x=s();if(x)x.clear()}catch(_){}}}})();\n</script>'''
          storage_pages=[
            'standalone/practice/core1a-physics-motion-2d-ncert-tablet.html',
            'standalone/practice/core1a-physics-nlm-tablet.html',
            'standalone/practice/core1a-physics-vectors-tablet.html',
            'standalone/practice/core1a-sba-06-07-trajectory-and-height-tablet.html',
            'standalone/practice/core1a-sba-motion-in-a-plane-master-tablet.html',
            'standalone/practice/core2-motion-1d-straight-line-tablet.html',
            'standalone/practice/core2-motion-consolidated-practice-tablet.html',
            'standalone/practice/core2-motion-in-a-plane-tablet.html']
          for p in storage_pages:
              s=rd(p)
              s=re.sub(r'(?<![\w$])(?:window\.)?localStorage\b','g9SafeStorage',s)
              if 'data-u3-safe-storage' not in s:
                  m=re.search(r'<head\b[^>]*>',s,re.I); need(m,f'{p}: head missing')
                  s=s[:m.end()]+safe+s[m.end():]
              wr(p,s)

          # U3-1: orphan Tailwind config is a load-time ReferenceError.
          p='standalone/practice/motion-in-1d-master-suite.html'; s=rd(p)
          s,n=re.subn(r'\n\s*<script>\s*tailwind\.config\s*=\s*\{.*?\}\s*</script>\s*','\n',s,count=1,flags=re.S)
          need(n==1,f'{p}: tailwind config block not found'); wr(p,s)

          # U3-2/U3-3: repair escaped-control corruption and ensure local KaTeX auto-render.
          katex='''<link rel="stylesheet" href="../../public/vendor/katex/0.16.8/katex.min.css">\n<script defer src="../../public/vendor/katex/0.16.8/katex.min.js"></script>\n<script defer src="../../public/vendor/katex/0.16.8/contrib/auto-render.min.js"></script>\n<script data-u3-katex-runtime>window.renderAllMath=function(root){const t=root||document.body;if(!t||!window.renderMathInElement)return;window.renderMathInElement(t,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\\\[",right:"\\\\]",display:true},{left:"\\\\(",right:"\\\\)",display:false},{left:"$",right:"$",display:false}],throwOnError:false})};document.addEventListener("DOMContentLoaded",()=>window.renderAllMath(document.body));</script>'''
          math_pages=['standalone/practice/core1a-physics-nlm-tablet.html','standalone/practice/core1a-physics-vectors-tablet.html','standalone/practice/core1a-sba-motion-in-a-plane-master-tablet.html','standalone/practice/motion-in-2d-master-suite.html']
          for p in math_pages:
              s=rd(p).replace('\x0bec',r'\vec').replace('\x0crac',r'\frac').replace('\t'+'heta',r'\theta')
              need('\x0b' not in s and '\x0c' not in s,f'{p}: control character remains')
              if 'data-u3-katex-runtime' not in s:
                  s=re.sub(r'\s*<link\b[^>]*katex[^>]*>\s*','\n',s,flags=re.I)
                  s=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*(?:katex\.min\.js|auto-render\.min\.js)["\'][^>]*></script>\s*','\n',s,flags=re.I)
                  need('</head>' in s,f'{p}: head close missing'); s=s.replace('</head>',katex+'\n</head>',1)
              wr(p,s)

          # U3-4: recover the 59 candidate stems/options only into this review HTML; canonical libraries remain rolled back.
          old=json.loads(subprocess.check_output(['git','show',f'{old_head}:Physics/library/phy-kin-2d-motion.v1.json'],text=True))
          rec={}
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          for row in walk(old):
              ext=row.get('extensions') if isinstance(row,dict) else None
              src=str(ext.get('grade9v3:source_html','')) if isinstance(ext,dict) else ''
              m=re.search(r'core2-motion-in-a-plane-tablet\.html#T0*([1-9]\d*)$',src)
              if m and 1<=int(m.group(1))<=59: rec[int(m.group(1))]=row
          need(len(rec)==59,f'recovered {len(rec)} challenge records, expected 59')
          p='standalone/practice/core2-motion-in-a-plane-tablet.html'; s=rd(p)
          for n in range(59,0,-1):
