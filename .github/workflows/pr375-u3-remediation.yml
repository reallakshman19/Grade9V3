          const storage=pages.filter(p=>/practice\/(?:core1a-physics-motion-2d-ncert|core1a-physics-nlm|core1a-physics-vectors|core1a-sba-06-07-trajectory-and-height|core1a-sba-motion-in-a-plane-master|core2-motion-1d-straight-line|core2-motion-consolidated-practice|core2-motion-in-a-plane)-tablet\.html$/.test(p));
          (async()=>{const b=await chromium.launch({headless:true}),ctx=await b.newContext({viewport:{width:1366,height:854}}),base='http://127.0.0.1:8103/';try{
