name: PR397 regenerate architecture manifest

on:
  push:
    branches:
      - fix/publish-physics-practice

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publish-physics-practice
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate repository architecture artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit generated outputs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr397-regenerate-architecture.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate architecture manifest"
          git push origin HEAD:fix/publish-physics-practice
