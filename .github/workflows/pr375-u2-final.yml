# Replay U2 on the current post-U1 + practice-content learner-page head.
name: pr375-u2-final

on:
  push:
    branches:
      - feat/physics-tablet-standalone
    paths:
      - .github/workflows/pr375-u2-final.yml
      - .github/u2/pr375_u2_remediate.py
      - .github/u2/pr375_u2_audit.js
      - .github/u2/pr375_u2_testfix.py

permissions:
  contents: write

concurrency:
  group: pr375-u2-final
  cancel-in-progress: true

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply bounded U2 remediation
        run: |
          python3 .github/u2/pr375_u2_remediate.py
          python3 .github/u2/pr375_u2_testfix.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("standalone/practice/motion-in-2d-master-suite.html")
          text = path.read_text(encoding="utf-8")
          text, n = re.subn(
              r'(<g id="sbTeacherChalk" style="display: none;"></g>\n)[ \t]+\n',
              r'\1',
              text,
              count=1,
          )
          assert n == 1, "expected one whitespace-only line after duplicate-id collapse"
          path.write_text(text, encoding="utf-8")
          PY
          git checkout -- .github/workflows/learner-quality.yml

      - name: Static U2 regression
        run: python3 -m unittest tests.test_pr375_u2_standalone

      - name: Install Chromium audit dependency outside repository
        run: |
          npm install --prefix /tmp/u2-final-node --package-lock=false playwright@1.56.1
          /tmp/u2-final-node/node_modules/.bin/playwright install --with-deps chromium

      - name: Browser U2 regression
        shell: bash
        run: |
          python3 -m http.server 8766 --directory . >/tmp/pr375-u2-final-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket, time
          for _ in range(100):
              try:
                  with socket.create_connection(("127.0.0.1", 8766), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("local HTTP server did not start")
          PY
          NODE_PATH=/tmp/u2-final-node/node_modules node .github/u2/pr375_u2_audit.js

      - name: Commit verified U2 remediation locally
        shell: bash
        run: |
          rm -f .github/u2/pr375_u2_remediate.py \
                .github/u2/pr375_u2_audit.js \
                .github/u2/pr375_u2_testfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing to include workflow changes in product commit."
            git diff --cached --name-only
            exit 1
          fi
          git diff --cached --check
          git commit -m "fix(physics): remediate PR375 U2 navigation offline findings"

      - name: Reconcile scaffolding-only head advances and push
        shell: bash
        run: |
          branch=feat/physics-tablet-standalone
          git fetch origin "$branch"
          remote_sha="$(git rev-parse origin/$branch)"
          echo "trigger=$GITHUB_SHA remote=$remote_sha"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            git diff --name-only "$GITHUB_SHA..origin/$branch" | tee /tmp/u2-final-advanced.txt
            if grep -Ev '^\.github/' /tmp/u2-final-advanced.txt | grep -q .; then
              echo "Non-scaffolding branch advance detected; refusing to overwrite learner/product changes."
              exit 1
            fi
            git rebase "origin/$branch"
          fi
          git push origin HEAD:"$branch"
