name: issue225-regenerate-generated-artifacts

on:
  push:
    branches:
      - issue-225-motion-shared-clock-portable-source

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-225-motion-shared-clock-portable-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - name: Regenerate canonical outputs
        run: |
          python3 Shared/tools/build_portable_workbench.py
          python3 Shared/tools/build_manifest.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portable-workbench standalone/portable-workbench tests/fixtures/portable-workbench/external-host.html tools/data.js public/data/data.js docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "[#225] regenerate combined portable and web artifacts"
          git push origin HEAD:issue-225-motion-shared-clock-portable-source
