name: issue-280-regenerate-after-main

on:
  push:
    branches:
      - issue-280/core-demand-bridge

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-280/core-demand-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - name: Refresh prompt composer data
        run: python3 Shared/tools/build_prompt_composer_data.py
      - name: Refresh Pages mirror
        run: python3 Shared/tools/build_pages_site.py
      - name: Refresh governed artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit generated artifacts
        run: |
          git config user.name "grade9v3-artifact-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/prompt-composer-data.js docs/data/prompt-composer-data.js \
            docs/.pages-manifest.json docs/architecture-manifest.json docs/prompts \
            public/core-learning public/js/core-learning standalone/core-learning tools/data.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: refresh generated artifacts after main reconciliation"
          git push origin HEAD:issue-280/core-demand-bridge
