name: tmp-refresh-pr375-manifest

on:
  push:
    branches:
      - feat/physics-tablet-standalone

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/physics-tablet-standalone
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate builder-owned manifest artifacts
        run: python3 Shared/tools/build_manifest.py

      - name: Commit exact generated outputs when changed
        run: |
          if git diff --quiet -- docs/architecture-manifest.json tools/data.js; then
            echo 'No generated manifest drift remains.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture-manifest.json tools/data.js
          git commit -m 'chore(manifest): refresh generated architecture manifest'
          git push origin HEAD:feat/physics-tablet-standalone
