name: issue228-regenerate-portable
on:
  push:
    branches: [issue-228-compile-motion-portable]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-228-compile-motion-portable
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - run: |
          python3 Shared/tools/build_portable_workbench.py
          python3 Shared/tools/build_manifest.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portable-workbench standalone/portable-workbench tests/fixtures/portable-workbench/external-host.html tools/data.js public/data/data.js docs/architecture-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[#228] regenerate canonical portable package outputs"
          git push origin HEAD:issue-228-compile-motion-portable
