name: issue-280-regenerate-once

on:
  push:
    branches:
      - issue-280/core-demand-bridge

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-280/core-demand-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet jsonschema
      - name: Regenerate governed artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit generated artifacts
        run: |
          git config user.name "grade9v3-artifact-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/architecture-manifest.json docs/prompts/projectile-stress-set.generated.md \
            public/core-learning public/js/core-learning standalone/core-learning tools/data.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: regenerate governed artifacts for issue 280"
          git push origin HEAD:issue-280/core-demand-bridge
