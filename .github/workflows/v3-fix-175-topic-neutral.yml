name: v3-fix-175-topic-neutral

on:
  push:
    branches:
      - relay/v3-fix-175-topic-neutral
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed builder branch
        uses: actions/checkout@v4
        with:
          ref: builder/core-learning-pages-r1
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Revalidate V3 write authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . \
            --path Shared/tools/build_core_learning_data.py --base-ref origin/main
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . \
            --path docs/architecture-manifest.json --base-ref origin/main

      - name: Topic independence is clean
        run: python Shared/tools/topic_independence_guard.py

      - name: Regenerate governed outputs
        run: python Shared/tools/build_manifest.py

      - name: Production adapter and Core semantics
        run: |
          python -m unittest tests.test_core_learning_adapter
          node --test tests/core_learning_page.test.mjs tests/core_learning_host.test.mjs
          python -m unittest tests.test_core_projection_pipeline tests.test_core_projection_contract
          python Shared/tools/build_manifest.py --check

      - name: Real browser production journey
        run: python -m unittest tests.test_workbench_runtime

      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json public/core-learning public/js/core-learning standalone/core-learning
          if git diff --cached --quiet; then
            echo "No generated output changes required."
          else
            git commit -m "Web builder: refresh production generated outputs"
            git push origin HEAD:builder/core-learning-pages-r1
          fi
