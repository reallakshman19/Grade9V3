name: relay-park-issue201-pass1
on:
  push:
    branches:
      - relay/park-issue201-pass1
permissions:
  contents: write
jobs:
  park:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: question-bank/pass1-provenance
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1c168695f237a8bef184a9e189be80fab87d1e78
          path: _common_v31
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Reconfirm delivery authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py PR_READY .             --expected-custody-epoch 1
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py MERGE .             --expected-custody-epoch 1 || true
      - name: Build NO_CHANGE roadmap reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          roadmap = yaml.safe_load(Path("relay/ROADMAP/ROADMAP.yaml").read_text())
          doc = {
              "schema_version": "relay-v3.1-roadmap-reconciliation",
              "authority": "PROPOSED_RECONCILIATION",
              "expected_revision": roadmap["revision"],
              "disposition": "NO_CHANGE",
              "basis": [
                  "CP-ISS201-EXAM-BANK-PASS1-V31-001 accepted with all acceptance criteria PASS.",
                  "PR 202 remains delivery-pending; no programme concept change is required.",
                  "Pass 1 remains provenance/custody only: no practice-set, exam, learner-route, Grade-10/11, or Mathematics expansion."
              ],
              "roadmap_after": roadmap,
          }
          Path("/tmp/issue201-roadmap-reconciliation.yaml").write_text(
              yaml.safe_dump(doc, sort_keys=False), encoding="utf-8"
          )
          PY
      - name: Record roadmap reconciliation
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . reconcile-roadmap             --tx-id TX-V31-ISS201-ROADMAP-003             --event-id EVT-V31-ISS201-ROADMAP-003             --actor chatgpt-sol-issue201-v31-20260923             --reconciliation /tmp/issue201-roadmap-reconciliation.yaml             --base-ref origin/main             --expected-custody-epoch 1
      - name: Stage standalone three-pass contract ephemerally
        run: |
          mkdir -p skills/three-pass-prompt-generator
          cp _common_v31/skills/three-pass-prompt-generator/SKILL.md skills/three-pass-prompt-generator/SKILL.md
          cp _common_v31/skills/three-pass-prompt-generator/schema.md skills/three-pass-prompt-generator/schema.md
          cp _common_v31/skills/three-pass-prompt-generator/validate.py skills/three-pass-prompt-generator/validate.py
      - name: Write provider target observation
        run: |
          cat > /tmp/pr202-target.yaml <<'YAML'
          schema_version: relay-v3.1-handover-target
          authority: PROVIDER_READBACK
          provider: GITHUB
          repository: reallaksh19/Grade9V3
          kind: PULL_REQUEST
          number: 202
          title: "Pass 1: provenance-first competitive-exam question bank"
          url: https://github.com/reallaksh19/Grade9V3/pull/202
          state: READY
          observed_at: "2026-09-23T08:56:01Z"
          provider_ref: "github:reallaksh19/Grade9V3/pull/202@097aaa5028a7e8a679c7fb6e14a55453179a53e5"
          YAML
      - name: Reconfirm fenced HANDOVER authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py HANDOVER .             --expected-custody-epoch 1
      - name: Plan verified handover
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          scripts = Path("_common_v31/skills/engineering-pr-delivery-v3.1/scripts").resolve()
          sys.path.insert(0, str(scripts))
          import plan_handover
          import relay_can
          original = plan_handover.can_action
          plan_handover.can_action = lambda root, action: relay_can.evaluate(
              root, action, expected_custody_epoch=1
          )
          try:
              result = plan_handover.plan_handover(
                  Path(".").resolve(),
                  tx_id="TX-V31-ISS201-PLAN-HANDOVER-003",
                  event_id="EVT-V31-ISS201-PLAN-HANDOVER-003",
                  actor="chatgpt-sol-issue201-v31-20260923",
                  target_path=Path("/tmp/pr202-target.yaml"),
                  base_ref="origin/main",
                  complex_mode=True,
              )
          finally:
              plan_handover.can_action = original
          print(f"{result['id']}: {result['status']}")
          PY
      - name: Release execution custody gracefully
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . release-lease             --tx-id TX-V31-ISS201-RELEASE-003             --event-id EVT-V31-ISS201-RELEASE-003             --actor chatgpt-sol-issue201-v31-20260923             --reason HANDOFF             --base-ref origin/main             --expected-custody-epoch 1
      - name: Validate released foundation
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate
      - name: Commit Relay parking state only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "relay: park issue 201 pending merge authority"
          git push origin HEAD:question-bank/pass1-provenance
