name: v3-checkpoint-portable-192

on:
  push:
    branches:
      - relay/v3-checkpoint-portable-192
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed portability branch
        uses: actions/checkout@v4
        with:
          ref: integration/issue-163-portable-workbench
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Re-run portable package and browser proof
        run: |
          python -m unittest tests.test_portable_workbench
          node --test tests/portable_workbench.test.mjs
          node --test tests/workbench_runtime.test.mjs
          python -m Shared.tools.build_portable_workbench --check
          python Shared/tools/build_manifest.py --check

      - name: Re-prove protected Core and subject truth unchanged
        run: |
          git diff --exit-code origin/main --             Shared/workbench             Shared/library             Shared/publication_host             Physics             Chemistry             Mathematics             public/core-learning             standalone/core-learning

      - name: Verify checkpoint authorization
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py CHECKPOINT .             --base-ref origin/main

      - name: Build exact portability checkpoint
        env:
          CHECKPOINT_RUN_ID: ${{ github.run_id }}
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/material_basis.py .             --base-ref origin/main > /tmp/material.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          material = json.loads(Path("/tmp/material.json").read_text(encoding="utf-8"))["material_basis"]
          run_id = os.environ["CHECKPOINT_RUN_ID"]
          cp = {
              "schema_version": "relay-v3-checkpoint",
              "id": "CP-PORTABLE-163-001",
              "ep": "EP-PORTABLE-163-001",
              "material_result": {
                  "head": material["head"],
                  "relevant_paths_digest": material["relevant_paths_digest"],
                  "dependency_digest": material["dependency_digest"],
              },
              "acceptance": [
                  {
                      "id": "AC-163-PACKAGE",
                      "result": "PASS",
                      "evidence": [
                          f"checkpoint workflow {run_id}: Python/Node package validation PASS",
                          "Version seams are explicit and mismatch/executable/pixel payloads fail closed.",
                          "Portable host contains no eval or new Function.",
                      ],
                  },
                  {
                      "id": "AC-163-HOSTS",
                      "result": "PASS",
                      "evidence": [
                          f"checkpoint workflow {run_id}: real Chrome proof PASS",
                          "Same long-division package executes in repository static, external plain-HTML and single-file hosts.",
                          "Single-file host reports zero subresource requests after document load.",
                      ],
                  },
                  {
                      "id": "AC-163-CROSS-SUBJECT",
                      "result": "PASS",
                      "evidence": [
                          f"checkpoint workflow {run_id}: long-division, Redox and integration package tests PASS",
                          "All three share one component/IR/adapter/scene-package version contract.",
                      ],
                  },
                  {
                      "id": "AC-163-BOUNDARY",
                      "result": "PASS",
                      "evidence": [
                          f"checkpoint workflow {run_id}: protected-path diff PASS",
                          "Shared/workbench Core and Physics/Chemistry/Mathematics canonical paths are unchanged.",
                          "Redox/integration rows are explicitly NON_CANONICAL_COMPILED_PROOF fixtures.",
                          "Semantic event assertions contain no mastery interpretation.",
                      ],
                  },
                  {
                      "id": "AC-163-PARITY",
                      "result": "PASS",
                      "evidence": [
                          f"checkpoint workflow {run_id}: build_portable_workbench --check PASS",
                          "Public, external and single-file hosts are generated from one source/build path.",
                      ],
                  },
                  {
                      "id": "AC-163-REPO",
                      "result": "PASS",
                      "evidence": [
                          "pinned v3-relay push run 35748334348 PASS",
                          "guardrails push run 35748334423 PASS",
                          f"checkpoint workflow {run_id}: generated manifest freshness PASS",
                      ],
                  },
              ],
              "validation": {
                  "focused_tests": "PASS",
                  "spec_delivery": "PASS",
                  "full_guardrails": "PASS",
              },
              "quality": {
                  "policy": "STANDARD",
                  "result": "CLEAR",
              },
              "known_limitations": [
                  "Redox and integration are compiled portability proof fixtures, not newly promoted canonical subject records.",
                  "The external-host proof is plain HTML consuming generated portable assets from the static origin; it deliberately does not own Grade9V3 learner routing or academic data.",
              ],
              "discoveries": [
                  "Delivered Semantic Workbench Core requires no source modification to support portable package and external/offline hosts.",
                  "A declarative adapter table is sufficient for the three cross-subject transfer witnesses.",
                  "Single-file embedding can reuse the exact delivered runtime/component sources while removing only module import statements during deterministic generation.",
              ],
              "handoff": {
                  "what_changed": [
                      "Added a versioned data-only portable package contract and declarative adapter host.",
                      "Generated repository, external plain-HTML and true single-file host forms from one source.",
                      "Added long-division, Redox and integration portability witnesses plus migration guidance.",
                  ],
                  "what_is_true_now": [
                      "Component API, Transformation IR, adapter API and scene-package versions are explicit and fail closed.",
                      "Long division reuses the existing Core witness; Redox and integration are provenance-labelled compiled proof fixtures.",
                      "Delivered Core, canonical subject data and Issue 175 learner shell remain unchanged.",
                      f"Accepted material head is {material['head']}.",
                  ],
                  "what_remains_uncertain": [
                      "Future promotion of the Redox/integration proof fixtures into canonical subject packages is outside Issue 163.",
                      "Grade-9 exit-readiness Issue 169 remains a separate roadmap lane.",
                  ],
                  "do_not_break": [
                      "Do not put executable code into portable package data.",
                      "Do not make portability own learner mastery, support policy or page composition.",
                      "Do not silently accept incompatible API/package versions.",
                  ],
                  "attempted_and_rejected": [
                      "Using bespoke Redox page JavaScript as portable runtime authority was rejected; it remains reference provenance only.",
                      "Modifying Shared/workbench Core for portability was unnecessary and therefore rejected.",
                  ],
                  "resume_from": [
                      "Deliver PR 192 through the V3 provider transition.",
                      "After provider closeout, reconcile WP-PORTABLE-163 COMPLETE and close Issue 163.",
                  ],
                  "first_successor_action": "If PR 192 is merged, sync provider readback, close the V3 task and reconcile the roadmap before any separate exit-readiness work.",
              },
          }
          Path("/tmp/cp-portable.yaml").write_text(
              yaml.safe_dump(cp, sort_keys=False),
              encoding="utf-8",
          )
          PY

      - name: Accept portability checkpoint
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_tx.py . checkpoint             --tx-id TX-CP-ISS163-PORTABLE-001             --event-id EVT-CP-ISS163-PORTABLE-001             --actor chatgpt-sol-portable-20260922             --checkpoint /tmp/cp-portable.yaml             --base-ref origin/main

      - name: Publish portability handover
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_tx.py . handover             --tx-id TX-HANDOVER-ISS163-PORTABLE-001             --event-id EVT-HANDOVER-ISS163-PORTABLE-001             --actor chatgpt-sol-portable-20260922             --base-ref origin/main

      - name: Validate accepted V3 authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/protocol_cutover.py . validate

      - name: Commit checkpoint and handover to portability branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "[relay-v3] Accept Issue 163 portability checkpoint"
          git push origin HEAD:integration/issue-163-portable-workbench
