name: pr375-u1-remediation

on:
  push:
    branches:
      - feat/physics-tablet-standalone
    paths:
      - .github/workflows/pr375-u1-remediation.yml

permissions:
  contents: write

concurrency:
  group: pr375-u1-remediation
  cancel-in-progress: false

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply bounded U1 typography and tablet-layout remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.').resolve()
          ST = ROOT / 'standalone'
          PR = ST / 'practice'
          pages = [
              ST / 'core1a-motion-1d-straight-line-tablet.html',
              ST / 'core1a-motion-in-a-plane-tablet.html',
              ST / 'core1a-physics-nlm-tablet.html',
              ST / 'core1a-vector-add-sub-tablet.html',
              ST / 'core2-motion-in-a-plane-tablet.html',
              ST / 'core2-physics-thrust-pressure-tablet.html',
              PR / 'core1a-physics-motion-2d-ncert-tablet.html',
              PR / 'core1a-physics-nlm-tablet.html',
              PR / 'core1a-physics-vectors-tablet.html',
              PR / 'core1a-sba-06-07-trajectory-and-height-tablet.html',
              PR / 'core1a-sba-motion-in-a-plane-master-tablet.html',
              PR / 'core2-motion-1d-straight-line-tablet.html',
              PR / 'core2-motion-consolidated-practice-tablet.html',
              PR / 'core2-motion-in-a-plane-tablet.html',
              PR / 'core2-physics-thrust-pressure-tablet.html',
              PR / 'core2a-projectile-study.html',
              PR / 'index.html',
              PR / 'motion-in-1d-master-suite.html',
              PR / 'motion-in-2d-master-suite.html',
              PR / 'physics-motion-in-a-plane-interactive-suite.html',
          ]
          assert len(pages) == 20 and all(p.exists() for p in pages)

          def normalize_viewport(text: str) -> str:
              pat = re.compile(r'<meta\s+name=["\']viewport["\']\s+content=["\']([^"\']*)["\']\s*/?>', re.I)
              m = pat.search(text)
              if not m:
                  raise AssertionError('viewport meta missing')
              parts = [p.strip() for p in m.group(1).split(',') if p.strip()]
              parts = [p for p in parts if not re.match(r'(?i)maximum-scale\s*=|user-scalable\s*=', p)]
              parts.append('maximum-scale=5.0')
              replacement = '<meta name="viewport" content="' + ', '.join(parts) + '">'
              return text[:m.start()] + replacement + text[m.end():]

          base_css = r'''
          <style id="pr375-u1-remediation">
          /* U1 tablet readability floor and touch geometry. */
          html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
          body { overflow-wrap: anywhere; }
          p, li { line-height: 1.4; }
          :where(p, li, label, button, input, select, textarea, summary, td, th, figcaption,
                 .btn, .q-badge, .tag-pill, .hint-badge, .hint-tag, .subject-badge,
                 .step-label, .diag-header, .formula-box, #saveStatus, .save-status,
                 .tag, .q-count, .open-btn, .stat .label, section.section-header h2) {
            font-size: max(14px, 1em) !important;
          }
          :where(a[href="index.html"], header a, nav a, .breadcrumb a, a.g9-bridge-link,
                 [data-g9-block="entry_assumptions"] a) {
            min-height: 48px !important;
            min-width: 48px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center;
            padding-block: 10px !important;
            box-sizing: border-box !important;
          }
          @media (min-width: 1100px) {
            article[data-g9-role="CORE1A"] .g9-split {
              grid-template-columns: minmax(0, 1fr) !important;
            }
            article[data-g9-role="CORE1A"] .g9-col-support {
              position: static !important;
              top: auto !important;
            }
          }
          article[data-g9-role="CORE1A"] > .slot-identity [data-g9-section-route] a {
            white-space: normal !important;
            overflow: visible !important;
            text-overflow: clip !important;
            line-height: 1.35 !important;
            min-height: 48px !important;
          }
          </style>
          '''

          for path in pages:
              text = path.read_text(encoding='utf-8')
              text = normalize_viewport(text)
              text = re.sub(r'\s*<style id="pr375-u1-remediation">.*?</style>\s*', '\n', text, flags=re.S)

              if path.name == 'index.html' and path.parent == PR:
                  hub_css = r'''
                  <style id="pr375-u1-hub">
                  .stat .label, .card-desc, .tag, .q-count, .open-btn,
                  section.section-header h2, footer { font-size: 14px !important; }
                  </style>
                  '''
                  text = re.sub(r'\s*<style id="pr375-u1-hub">.*?</style>\s*', '\n', text, flags=re.S)
                  text = text.replace('</head>', hub_css + '\n</head>', 1)

              if path == PR / 'physics-motion-in-a-plane-interactive-suite.html':
                  katex_css = r'''
                  <style id="pr375-u1-katex">
                  .katex { font-size: 1.8em !important; }
                  </style>
                  '''
                  text = re.sub(r'\s*<style id="pr375-u1-katex">.*?</style>\s*', '\n', text, flags=re.S)
                  text = text.replace('</head>', katex_css + '\n</head>', 1)

              if path == PR / 'motion-in-2d-master-suite.html':
                  text = text.replace(
                      '<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>',
                      '<script src="../../public/vendor/tailwind/3.4.17/tailwind-play.js"></script>'
                  )
                  text = text.replace(
                      '<script src="../vendor/tailwind/3.4.17/tailwind-play.js"></script>',
                      '<script src="../../public/vendor/tailwind/3.4.17/tailwind-play.js"></script>'
                  )
                  tw_css = r'''
                  <style id="pr375-u1-tailwind-floor">
                  .text-xs, .text-\[10px\], .text-\[11px\], .text-\[12px\], .text-\[13px\] {
                    font-size: 14px !important;
                  }
                  a, button { min-height: 48px; }
                  </style>
                  '''
                  text = re.sub(r'\s*<style id="pr375-u1-tailwind-floor">.*?</style>\s*', '\n', text, flags=re.S)
                  text = text.replace('</head>', tw_css + '\n</head>', 1)

              if path == PR / 'motion-in-1d-master-suite.html':
                  text = text.replace('tailwind.config = {', '(window.tailwind = window.tailwind || {}).config = {', 1)
                  local = '<script src="../../public/vendor/tailwind/3.4.17/tailwind-play.js"></script>'
                  if local not in text and '../vendor/tailwind/3.4.17/tailwind-play.js' not in text:
                      text = text.replace('</head>', local + '\n</head>', 1)
                  elif '../vendor/tailwind/3.4.17/tailwind-play.js' in text:
                      text = text.replace('../vendor/tailwind/3.4.17/tailwind-play.js', '../../public/vendor/tailwind/3.4.17/tailwind-play.js')
                  tw1_css = r'''
                  <style id="pr375-u1-tailwind-floor">
                  .text-xs, .text-\[10px\], .text-\[11px\], .text-\[12px\], .text-\[13px\] {
                    font-size: 14px !important;
                  }
                  a, button { min-height: 48px; }
                  </style>
                  '''
                  text = re.sub(r'\s*<style id="pr375-u1-tailwind-floor">.*?</style>\s*', '\n', text, flags=re.S)
                  text = text.replace('</head>', tw1_css + '\n</head>', 1)

              text = text.replace('</head>', base_css + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')

          # Static invariants for all 20 pages.
          for path in pages:
              text = path.read_text(encoding='utf-8')
              m = re.search(r'<meta\s+name="viewport"\s+content="([^"]+)"', text, re.I)
              assert m and 'maximum-scale=5.0' in m.group(1), path
              assert 'user-scalable=no' not in m.group(1).lower(), path
              assert 'id="pr375-u1-remediation"' in text, path
          assert 'www.gstatic.com/antigravity/web/dev/tailwindcss.min.js' not in (PR/'motion-in-2d-master-suite.html').read_text(encoding='utf-8')
          assert '../../public/vendor/tailwind/3.4.17/tailwind-play.js' in (PR/'motion-in-2d-master-suite.html').read_text(encoding='utf-8')
          assert '../../public/vendor/tailwind/3.4.17/tailwind-play.js' in (PR/'motion-in-1d-master-suite.html').read_text(encoding='utf-8')
          print('U1 static remediation applied to 20 pages')
          PY

      - name: Install Chromium audit dependency
        shell: bash
        run: |
          npm install -g playwright@1.55.0
          playwright install chromium

      - name: Run 20-page x 4-viewport U1 browser audit
        shell: bash
        run: |
          python3 -m http.server 8101 -d . >/tmp/u1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          export NODE_PATH="$(npm root -g)"
          cat > /tmp/u1-audit.cjs <<'JS'
          const { chromium } = require('playwright');
          const pages = [
            'standalone/core1a-motion-1d-straight-line-tablet.html',
            'standalone/core1a-motion-in-a-plane-tablet.html',
            'standalone/core1a-physics-nlm-tablet.html',
            'standalone/core1a-vector-add-sub-tablet.html',
            'standalone/core2-motion-in-a-plane-tablet.html',
            'standalone/core2-physics-thrust-pressure-tablet.html',
            'standalone/practice/core1a-physics-motion-2d-ncert-tablet.html',
            'standalone/practice/core1a-physics-nlm-tablet.html',
            'standalone/practice/core1a-physics-vectors-tablet.html',
            'standalone/practice/core1a-sba-06-07-trajectory-and-height-tablet.html',
            'standalone/practice/core1a-sba-motion-in-a-plane-master-tablet.html',
            'standalone/practice/core2-motion-1d-straight-line-tablet.html',
            'standalone/practice/core2-motion-consolidated-practice-tablet.html',
            'standalone/practice/core2-motion-in-a-plane-tablet.html',
            'standalone/practice/core2-physics-thrust-pressure-tablet.html',
            'standalone/practice/core2a-projectile-study.html',
            'standalone/practice/index.html',
            'standalone/practice/motion-in-1d-master-suite.html',
            'standalone/practice/motion-in-2d-master-suite.html',
            'standalone/practice/physics-motion-in-a-plane-interactive-suite.html'
          ];
          const viewports = [[1366,854],[854,1366],[1280,800],[800,1280]];
          const browser = await chromium.launch({headless:true});
          let failures = [];
          let rows = 0;
          for (const file of pages) {
            for (const [width,height] of viewports) {
              const page = await browser.newPage({viewport:{width,height}});
              const errors = [];
              page.on('pageerror', e => errors.push(String(e)));
              await page.goto('http://127.0.0.1:8101/' + file, {waitUntil:'load', timeout:30000});
              await page.waitForTimeout(650);
              const result = await page.evaluate(({file,width}) => {
                const visible = el => {
                  const s = getComputedStyle(el); const r = el.getBoundingClientRect();
                  return s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity) !== 0 && r.width > 0 && r.height > 0;
                };
                const meta = document.querySelector('meta[name="viewport"]')?.content || '';
                const overflow = document.documentElement.scrollWidth - innerWidth;
                let under12 = [];
                const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
                while (walker.nextNode()) {
                  const n = walker.currentNode; const t = n.textContent.trim();
                  if (!t) continue;
                  const el = n.parentElement; if (!el || !visible(el)) continue;
                  const fs = parseFloat(getComputedStyle(el).fontSize);
                  if (fs < 11.95) under12.push({fs, text:t.slice(0,45), tag:el.tagName, cls:el.className?.toString().slice(0,60)});
                  if (under12.length >= 8) break;
                }
                const targeted = 'p,li,label,button,input,select,textarea,summary,td,th,figcaption,.btn,.q-badge,.tag-pill,.hint-badge,.hint-tag,.subject-badge,.step-label,.diag-header,.formula-box,#saveStatus,.save-status,.tag,.q-count,.open-btn,.stat .label,section.section-header h2';
                const under14 = [...document.querySelectorAll(targeted)].filter(visible).map(el => ({el,fs:parseFloat(getComputedStyle(el).fontSize)})).filter(x=>x.fs<13.95).slice(0,8).map(x=>({fs:x.fs, tag:x.el.tagName, text:(x.el.innerText||x.el.value||'').trim().slice(0,45)}));
                const touchSel = 'a[href="index.html"],header a,nav a,.breadcrumb a,a.g9-bridge-link,[data-g9-block="entry_assumptions"] a';
                const touch = [...document.querySelectorAll(touchSel)].filter(visible).map(el=>({el,r:el.getBoundingClientRect()})).filter(x=>x.r.height<47.5 || x.r.width<47.5).slice(0,8).map(x=>({w:x.r.width,h:x.r.height,text:(x.el.innerText||'').trim().slice(0,45)}));
                let svgSmall = [];
                if ((file.endsWith('core1a-motion-in-a-plane-tablet.html') || file.endsWith('core1a-physics-nlm-tablet.html')) && width >= 1100) {
                  svgSmall = [...document.querySelectorAll('svg text')].filter(visible).map(el=>({el,r:el.getBoundingClientRect()})).filter(x=>x.r.height<13.0).slice(0,8).map(x=>({h:x.r.height,text:(x.el.textContent||'').trim().slice(0,35)}));
                }
                let sticky = [];
                let clippedRoutes = [];
                if (width >= 1100 && file.includes('/core1a-') && !file.includes('/practice/')) {
                  sticky = [...document.querySelectorAll('.g9-col-support')].filter(visible).filter(el=>getComputedStyle(el).position==='sticky').map(el=>'sticky');
                  clippedRoutes = [...document.querySelectorAll('[data-g9-section-route] a')].filter(visible).filter(el=>el.scrollWidth>el.clientWidth+1 && getComputedStyle(el).overflow==='hidden').map(el=>(el.innerText||'').trim()).slice(0,8);
                }
                const remoteTailwind = file.endsWith('motion-in-2d-master-suite.html') && [...document.scripts].some(s=>/gstatic\.com\/antigravity/.test(s.src));
                return {meta,overflow,under12,under14,touch,svgSmall,sticky,clippedRoutes,remoteTailwind};
              }, {file,width});
              const bad = [];
              if (!result.meta.includes('maximum-scale=5.0')) bad.push('viewport');
              if (result.overflow > 1.5) bad.push('overflow='+result.overflow);
              if (result.under12.length) bad.push('under12='+JSON.stringify(result.under12));
              if (result.under14.length) bad.push('under14='+JSON.stringify(result.under14));
              if (result.touch.length) bad.push('touch='+JSON.stringify(result.touch));
              if (result.svgSmall.length) bad.push('svg='+JSON.stringify(result.svgSmall));
              if (result.sticky.length) bad.push('sticky-support');
              if (result.clippedRoutes.length) bad.push('clipped-routes='+JSON.stringify(result.clippedRoutes));
              if (result.remoteTailwind) bad.push('remote-tailwind');
              if (errors.length) bad.push('pageerror='+errors.slice(0,3).join(' | '));
              rows++;
              console.log(`${file} ${width}x${height} ${bad.length ? 'FAIL '+bad.join('; ') : 'PASS'}`);
              if (bad.length) failures.push(`${file} ${width}x${height}: ${bad.join('; ')}`);
              await page.close();
            }
          }
          await browser.close();
          console.log(`U1 matrix rows=${rows}, failures=${failures.length}`);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          JS
          node /tmp/u1-audit.cjs

      - name: Ensure feature branch did not advance during audit
        shell: bash
        run: |
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/physics-tablet-standalone | cut -f1)"
          echo "trigger=$GITHUB_SHA remote=$REMOTE_HEAD"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"

      - name: Commit verified U1 remediation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/pr375-u1-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standalone .github/workflows/pr375-u1-remediation.yml
          git diff --cached --check
          git commit -m "fix(physics): remediate U1 tablet typography and layout"
          git push origin HEAD:feat/physics-tablet-standalone
