name: regenerate-active-manifest-once

on:
  push:
    branches:
      - migration/v3-stage-20260922

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact active builder branch
        uses: actions/checkout@v4
        with:
          ref: builder/core-learning-pages-r1
          fetch-depth: 0

      - name: Verify expected active head
        shell: bash
        run: |
          set -euo pipefail
          expected="5459e56f4916cac59a6b8cf1fdcd4754b18da2a0"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "Active branch moved: expected $expected got $actual"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 Shared/tools/build_manifest.py
          git diff --exit-code -- public/core-learning/index.html standalone/core-learning/index.html public/core-learning/data.js public/js/core-learning || {
            echo "Generator changed product artifacts beyond the manifest; refusing automated commit."
            exit 1
          }
          git diff -- docs/architecture-manifest.json

      - name: Commit only derived manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "relay-manifest-bot"
          git config user.email "relay-manifest-bot@users.noreply.github.com"
          git add docs/architecture-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate architecture manifest for Core learner host parity"
          git push origin HEAD:builder/core-learning-pages-r1
