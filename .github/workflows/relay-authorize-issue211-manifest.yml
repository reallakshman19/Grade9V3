name: relay-authorize-issue211-manifest
on:
  push:
    branches:
      - relay/authorize-issue211-manifest
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readiness/issue-211-core-contracts
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1c168695f237a8bef184a9e189be80fab87d1e78
          path: _common_v31
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Authorize generated manifest refresh
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py MATERIAL_WRITE .             --path docs/architecture-manifest.json             --base-ref origin/main             --expected-custody-epoch 1
