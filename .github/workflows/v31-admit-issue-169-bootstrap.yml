name: v31-admit-issue-169

on:
  push:
    branches:
      - readiness/issue-169-grade9-exit-v31
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh Issue 169 branch
        uses: actions/checkout@v4
        with:
          ref: readiness/issue-169-grade9-exit-v31
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3.1
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: edb845f06f32c87453dee6fbfcc2f84937017279
          path: _common_v31
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relay dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Normalize completed-task context for new V3.1 admission
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path("relay/STATE.yaml")
          state = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert state["schema_version"] == "relay-v3.1"
          assert state["execution"]["lifecycle"] == "TERMINAL", state["execution"]
          assert state["accepted"]["checkpoint"] == "CP-PORTABLE-163-V31-001"
          state["execution"] = {"lifecycle": "IDLE", "ep": None, "lease": None, "route": None}
          state["accepted"] = {"checkpoint": None}
          state["delivery"] = {"required": False, "primary_vehicle": None}
          path.write_text(yaml.safe_dump(state, sort_keys=False), encoding="utf-8")
          PY

      - name: Write Issue 169 V3.1 admission
        run: |
          cat > /tmp/issue-169-v31.yaml <<'YAML'
          schema_version: relay-v3.1-task-admission
          roadmap:
            disposition: MAPPED_EXISTING_WP
            new_revision: RM-V31-ISS169-EXIT-001
            basis:
              - "WP-PORTABLE-163 is COMPLETE and Issue 163 is provider-closed."
              - "WP-TA-105 is the remaining planned Grade-9 exit-readiness work package."
              - "PR 170 and PR 181 are V2.5-era candidate/history only; no prior acceptance credit is imported."
              - "PR 194 is the fresh V3.1 delivery vehicle from current main."
            work_package:
              id: WP-TA-105
              title: Prove Grade-9 Physics exit readiness and Grade-10 transition
              weight: 7.0
              state: ACTIVE
              depends_on:
                - WP-TA-108
          ep:
            schema_version: relay-v3.1-ep
            id: EP-EXIT-169-V31-001
            work_package: WP-TA-105
            outcome:
              statement: "Deliver an auditable derived Grade-9 exit/Grade-10 transition view from canonical required scope and existing learner evidence, preserving unknowns, prerequisite blockers, optional enrichment boundaries, and the delivered Core2A/Core2B demand contract without a mastery score or second learner truth store."
            basis:
              predecessor_checkpoint: null
              material_base: ad1f5a3d512eeacdbbc5c2f1f8a1740fe2d5ffb0
              protocol_basis: "reallaksh19/Common@edb845f06f32c87453dee6fbfcc2f84937017279:skills/engineering-pr-delivery-v3.1"
              semantic_dependencies:
                - path: docs/grade9/grade9-physics-scope-coverage.json
                  reason: "Canonical required Grade-9 scope and blocker classification."
                - path: Shared/tools/learner_evidence.py
                  reason: "Existing learner evidence strength/independence semantics remain authoritative."
                - path: Physics/library/**
                  reason: "Canonical question exposure and transfer metadata supply derived demand-class context."
                - path: Shared/library/**
                  reason: "Delivered Core projection contract supplies Core2A/Core2B exposure semantics."
                - path: relay/MIGRATION/V3_TO_V31.yaml
                  reason: "Pins the current protocol-line migration boundary."
            scope:
              write:
                - Shared/tools/grade9_exit.py
                - tests/test_grade9_exit.py
                - docs/grade9/GRADE9-PHYSICS-EXIT-TRANSITION-REPORT.md
                - docs/architecture-manifest.json
              read:
                - Shared/tools/learner_evidence.py
                - Shared/tools/study_session.py
                - Shared/library/**
                - Physics/library/**
                - Physics/matrices/**
                - docs/grade9/**
                - agents/relay/roadmap/owner-decisions/ODR-0003-G9-PHYSICS-INDEPENDENCE.yaml
              protect:
                - Learners/**
                - Physics/**
                - Shared/library/**
                - Shared/publication_host/**
                - Shared/workbench/**
                - public/core-learning/**
                - standalone/core-learning/**
                - agents/relay/**
              prohibit:
                - "Do not add mastery percentages, probabilities, readiness scores or a second Grade-9 state store."
                - "Do not convert unknown/missing evidence into mastery or failure."
                - "Do not make authored Core2B inventory alone a transition requirement."
                - "Do not modify Physics or Learners canonical/persisted truth."
                - "Do not persist derived Core labels, family refs or transfer dimensions into learner observations."
            acceptance:
              - id: AC-169-DERIVED
                statement: "Exit readiness is a derived query/report over canonical Grade-9 scope plus existing learner evidence, with secure, usable-but-fragile, known-gap and insufficient/unknown categories and no persisted readiness score."
                evidence_requirements:
                  - test: "python -m unittest tests.test_grade9_exit"
              - id: AC-169-DEMAND
                statement: "Changed-demand evidence is recognized only from canonical Core2B exposure plus transfer metadata plus direct/no-help demonstrated evidence; Core2A or caller prose cannot manufacture transfer evidence."
                evidence_requirements:
                  - test: "focused Core2A/Core2B demand-class falsifiers"
              - id: AC-169-AUTHORITY
                statement: "Transfer availability, learner observation and transition-requiredness remain separate; authored changed-demand inventory alone does not block or defer Grade 10."
                evidence_requirements:
                  - test: "authority-driven changed-demand requirement falsifiers"
              - id: AC-169-TRANSITION
                statement: "Required/prerequisite known gaps block, unknown required evidence remains evidence-required, fragile evidence gets targeted rechecks, enrichment/later-grade gaps stay visible but non-blocking, and Grade 10 inherits explicit transition evidence rather than blanket recertification."
                evidence_requirements:
                  - test: "transition blocker/non-blocker and parent/agent report tests"
              - id: AC-169-BOUNDARY
                statement: "No material changes occur under Physics or Learners, and learner evidence ownership remains unchanged."
                evidence_requirements:
                  - oracle: "protected-domain diff against main is empty"
              - id: AC-169-REPO
                statement: "Exact-head guardrails and pinned V3.1 validation pass with generated manifest current."
                evidence_requirements:
                  - test: "guardrails and v31-relay on exact PR 194 head"
            quality_policy:
              level: STANDARD
              independent_review: OPTIONAL
            admission_policy:
              qualification: NOT_REQUIRED
              question_policy: NONE
            next:
              first_action: "Reuse only the bounded PR 170 product candidate, implement the post-Core2B compatibility corrections, replace authored-transfer-implies-required tests with authority-driven falsifiers, and regenerate the readable report/manifest."
              stop_conditions:
                - "Any need to mutate Physics or Learners requires a separately scoped defect."
                - "Do not import V2.5 relay/checkpoint/qualification files from PR 170 or PR 181."
                - "Do not make transfer evidence a completion denominator without explicit transition authority."
                - "No merge until fresh V3.1 checkpoint and V3.1 MERGE authorization pass."
          lease:
            id: LEASE-EXIT-169-V31-001
            executor_id: chatgpt-sol-exit-v31-20260922
            method: DETERMINISTIC
            qualification: null
            owner_basis: null
            branch: readiness/issue-169-grade9-exit-v31
          delivery:
            required: true
            primary_vehicle:
              provider: GITHUB
              kind: PULL_REQUEST
              number: 194
          YAML

      - name: Admit Issue 169 natively under V3.1
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . admit-task             --tx-id TX-V31-ADMIT-ISS169-001             --event-id EVT-V31-ADMIT-ISS169-001             --actor chatgpt-sol-exit-v31-20260922             --admission /tmp/issue-169-v31.yaml             --base-ref origin/main

      - name: Validate bounded V3.1 authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_default.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py MATERIAL_WRITE .             --path Shared/tools/grade9_exit.py --base-ref origin/main
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py MATERIAL_WRITE .             --path tests/test_grade9_exit.py --base-ref origin/main

      - name: Commit native Issue 169 admission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "[relay-v3.1] admit Issue 169 exit readiness"
          git push origin HEAD:readiness/issue-169-grade9-exit-v31
