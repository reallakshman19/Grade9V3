name: pr375-u4-remediation-r5

on:
  push:
    branches:
      - feat/physics-tablet-standalone
    paths:
      - .github/workflows/pr375-u4-remediation-r5.yml

permissions:
  contents: write

concurrency:
  group: pr375-u4-remediation-r5
  cancel-in-progress: false

jobs:
  remediate-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/physics-tablet-standalone
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct reviewed U4 candidate
        shell: bash
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          recipes = [
              ('.github/workflows/pr375-u4-remediation.yml', 'Apply bounded U4 accessibility remediation'),
              ('.github/workflows/pr375-u4-remediation-r3.yml', 'Apply residual phone reflow and dynamic-a11y fixes'),
          ]
          for workflow, step_name in recipes:
              data = yaml.safe_load(Path(workflow).read_text(encoding='utf-8'))
              step = next(s for s in data['jobs']['remediate-and-verify']['steps'] if s.get('name') == step_name)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], check=True)
          PY

      - name: Contain long phone formula without page clipping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('standalone/practice/physics-motion-in-a-plane-interactive-suite.html')
          text = path.read_text(encoding='utf-8')
          css = r'''
          <style id="pr375-u4-math-reflow">
          @media (max-width: 480px) {
            .formula-banner {
              max-width: 100% !important;
              min-width: 0 !important;
              overflow-x: auto !important;
              overflow-y: hidden !important;
              overscroll-behavior-inline: contain;
              -webkit-overflow-scrolling: touch;
              scrollbar-gutter: stable;
            }
            .formula-banner .katex-display {
              max-width: none !important;
              margin-inline: 0 !important;
              padding-block-end: .25rem;
            }
          }
          </style>
          '''.strip()
          js = r'''
          <script id="pr375-u4-math-reflow-script">
          (() => {
            const syncScrollableFormulae = () => {
              document.querySelectorAll('.formula-banner').forEach((el) => {
                const needsScroll = el.scrollWidth > el.clientWidth + 1;
                if (needsScroll) {
                  el.tabIndex = 0;
                  el.setAttribute('role', 'region');
                  el.setAttribute('aria-label', 'Scrollable formula');
                } else if (el.getAttribute('aria-label') === 'Scrollable formula') {
                  el.removeAttribute('tabindex');
                  el.removeAttribute('role');
                  el.removeAttribute('aria-label');
                }
              });
            };
            requestAnimationFrame(() => requestAnimationFrame(syncScrollableFormulae));
            setTimeout(syncScrollableFormulae, 120);
            addEventListener('resize', syncScrollableFormulae, { passive: true });
          })();
          </script>
          '''.strip()
          if 'id="pr375-u4-math-reflow"' not in text:
              text = text.replace('</head>', css + '\n</head>', 1)
          if 'id="pr375-u4-math-reflow-script"' not in text:
              text = text.replace('</body>', js + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact U4 static denominator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = [
              'standalone/core1a-motion-1d-straight-line-tablet.html',
              'standalone/core1a-motion-in-a-plane-tablet.html',
              'standalone/core1a-physics-nlm-tablet.html',
              'standalone/core1a-vector-add-sub-tablet.html',
              'standalone/core2-motion-in-a-plane-tablet.html',
              'standalone/core2-physics-thrust-pressure-tablet.html',
              'standalone/practice/core1a-physics-motion-2d-ncert-tablet.html',
              'standalone/practice/core1a-physics-nlm-tablet.html',
              'standalone/practice/core1a-physics-vectors-tablet.html',
              'standalone/practice/core1a-sba-06-07-trajectory-and-height-tablet.html',
              'standalone/practice/core1a-sba-motion-in-a-plane-master-tablet.html',
              'standalone/practice/core2-motion-1d-straight-line-tablet.html',
              'standalone/practice/core2-motion-consolidated-practice-tablet.html',
              'standalone/practice/core2-motion-in-a-plane-tablet.html',
              'standalone/practice/core2-physics-thrust-pressure-tablet.html',
              'standalone/practice/core2a-projectile-study.html',
              'standalone/practice/index.html',
              'standalone/practice/motion-in-1d-master-suite.html',
              'standalone/practice/motion-in-2d-master-suite.html',
              'standalone/practice/physics-motion-in-a-plane-interactive-suite.html',
          ]
          assert len(pages) == len(set(pages)) == 20
          for rel in pages:
              p = Path(rel)
              assert p.exists(), rel
              t = p.read_text(encoding='utf-8')
              for marker in ('pr375-u4-remediation','pr375-u4-remediation-script','pr375-u4-residual-remediation','pr375-u4-dynamic-remediation'):
                  assert f'id="{marker}"' in t, (rel, marker)
              assert 'prefers-reduced-motion: reduce' in t, rel
              assert 'forced-colors: active' in t, rel
          interactive = Path('standalone/practice/physics-motion-in-a-plane-interactive-suite.html').read_text(encoding='utf-8')
          assert 'id="pr375-u4-math-reflow"' in interactive
          assert 'id="pr375-u4-math-reflow-script"' in interactive
          master = Path('standalone/practice/motion-in-1d-master-suite.html').read_text(encoding='utf-8')
          assert '(window.tailwind = window.tailwind || {}).config' in master
          print('static U4 denominator: PASS (20/20 exact pages)')
          PY

      - name: Install Chromium audit dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run complete 20-page U4 browser matrix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          data = yaml.safe_load(Path('.github/workflows/pr375-u4-remediation.yml').read_text(encoding='utf-8'))
          step = next(s for s in data['jobs']['remediate-and-verify']['steps'] if s.get('name') == 'Browser U4 regression audit')
          script = step['run'].replace('/tmp/pr375-u4-audit.mjs', '.tmp-pr375-u4-audit.mjs')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', script], check=True)
          PY
          rm -f .tmp-pr375-u4-audit.mjs

      - name: Verify reported contrast, forced-colour, and formula regressions
        shell: bash
        run: |
          python3 -m http.server 8107 --directory . >/tmp/u4-targeted-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8107/standalone/practice/index.html >/dev/null && break; sleep .2; done
          cat >.tmp-u4-targeted.mjs <<'JS'
          import { chromium } from 'playwright';

          const rgb = (s) => {
            const m = String(s).match(/rgba?\(([^)]+)\)/i);
            if (!m) return null;
            const p = m[1].split(',').map(Number);
            return {r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1};
          };
          const lum = ({r,g,b}) => {
            const f = v => { v/=255; return v<=.04045 ? v/12.92 : ((v+.055)/1.055)**2.4; };
            return .2126*f(r)+.7152*f(g)+.0722*f(b);
          };
          const contrast = (a,b) => { const x=lum(a), y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
          const failures=[];
          const browser=await chromium.launch({headless:true});

          async function checkContrast(rel, theme, selectors) {
            const context=await browser.newContext({viewport:{width:1280,height:800}});
            const page=await context.newPage();
            await page.goto(`http://127.0.0.1:8107/${rel}`, {waitUntil:'domcontentloaded'});
            if (theme) await page.evaluate(t => document.documentElement.setAttribute('data-theme', t), theme);
            const rows=await page.evaluate((selectors) => selectors.flatMap(sel => [...document.querySelectorAll(sel)].filter(el => {
              const r=el.getBoundingClientRect(); return r.width>0 && r.height>0;
            }).slice(0,30).map(el => {
              const cs=getComputedStyle(el);
              let node=el, bg='rgba(0, 0, 0, 0)';
              while(node) {
                const c=getComputedStyle(node).backgroundColor;
                const m=c.match(/rgba?\(([^)]+)\)/i);
                const a=m ? (m[1].split(',').length>3 ? Number(m[1].split(',')[3]) : 1) : 0;
                if (a > .98) { bg=c; break; }
                node=node.parentElement;
              }
              return {sel,text:el.textContent.trim().slice(0,60),fg:cs.color,bg};
            })), selectors);
            for (const row of rows) {
              const a=rgb(row.fg), b=rgb(row.bg);
              if (a && b && contrast(a,b) < 4.5) failures.push(`${rel} ${theme||'default'} ${row.sel}: ${contrast(a,b).toFixed(2)}:1 ${row.text}`);
            }
            await context.close();
          }

          for (const rel of [
            'standalone/practice/core1a-physics-motion-2d-ncert-tablet.html',
            'standalone/practice/core1a-physics-nlm-tablet.html',
            'standalone/practice/core1a-physics-vectors-tablet.html',
            'standalone/practice/core1a-sba-motion-in-a-plane-master-tablet.html',
            'standalone/practice/core2-motion-1d-straight-line-tablet.html',
            'standalone/practice/core2-motion-consolidated-practice-tablet.html'
          ]) await checkContrast(rel, null, ['button.u4-clear-button']);

          await checkContrast('standalone/practice/core2-motion-in-a-plane-tablet.html','light',['.step-content-calc','.answer-banner','.badge-success','.badge-warning','.hint-tag']);
          await checkContrast('standalone/practice/core1a-sba-06-07-trajectory-and-height-tablet.html','light',['.formula-box','.math-banner']);
          await checkContrast('standalone/practice/index.html',null,['.q-count','.open-btn','footer']);

          {
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:8107/standalone/practice/physics-motion-in-a-plane-interactive-suite.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(250);
            const state=await page.evaluate(() => {
              const banner=[...document.querySelectorAll('.formula-banner')].find(el => el.scrollWidth > el.clientWidth + 1);
              return {
                doc:document.documentElement.scrollWidth, viewport:innerWidth,
                found:!!banner,
                overflow:banner ? getComputedStyle(banner).overflowX : '',
                tabindex:banner?.getAttribute('tabindex'),
                role:banner?.getAttribute('role'),
                label:banner?.getAttribute('aria-label'),
                sw:banner?.scrollWidth||0, cw:banner?.clientWidth||0
              };
            });
            if (state.doc > state.viewport + 1) failures.push(`interactive page still overflows ${state.doc}/${state.viewport}`);
            if (!state.found || !['auto','scroll'].includes(state.overflow) || state.tabindex !== '0' || state.role !== 'region' || !state.label) failures.push(`scrollable formula not keyboard-contained: ${JSON.stringify(state)}`);
            await context.close();
          }

          {
            const context=await browser.newContext({viewport:{width:1280,height:800},forcedColors:'active'});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:8107/standalone/practice/motion-in-2d-master-suite.html',{waitUntil:'domcontentloaded'});
            const fills=await page.evaluate(() => ['t3BodyLabel','relTxtRain','t2IntersectTxt','t4ApexTxt'].map(id => ({id,fill:document.getElementById(id)?getComputedStyle(document.getElementById(id)).fill:null})));
            for (const x of fills) if (x.fill === 'rgb(255, 255, 255)') failures.push(`forced-colour SVG text remains white: ${x.id}`);
            await context.close();
          }

          await browser.close();
          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log('targeted U4 contrast/forced-colour/formula regressions: PASS');
          JS
          node .tmp-u4-targeted.mjs
          rm -f .tmp-u4-targeted.mjs

      - name: Run 20-page keyboard and semantic smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          data = yaml.safe_load(Path('.github/workflows/pr375-u4-remediation-r3.yml').read_text(encoding='utf-8'))
          step = next(s for s in data['jobs']['remediate-and-verify']['steps'] if s.get('name') == 'Additional keyboard and semantic smoke test')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], check=True)
          PY

      - name: Ensure branch did not advance during final audit
        shell: bash
        run: |
          remote_sha=$(git ls-remote origin refs/heads/feat/physics-tablet-standalone | awk '{print $1}')
          test "$remote_sha" = "$GITHUB_SHA" || { echo "branch advanced from $GITHUB_SHA to $remote_sha; refusing to overwrite"; exit 1; }

      - name: Commit verified U4 remediation and remove U4 one-shot workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr375-u4-remediation.yml \
                 .github/workflows/pr375-u4-remediation-r2.yml \
                 .github/workflows/pr375-u4-remediation-r3.yml \
                 .github/workflows/pr375-u4-diagnostic-r4.yml \
                 .github/workflows/pr375-u4-remediation-r5.yml
          git add standalone/core1a-motion-1d-straight-line-tablet.html \
                  standalone/core1a-motion-in-a-plane-tablet.html \
                  standalone/core1a-physics-nlm-tablet.html \
                  standalone/core1a-vector-add-sub-tablet.html \
                  standalone/core2-motion-in-a-plane-tablet.html \
                  standalone/core2-physics-thrust-pressure-tablet.html \
                  standalone/practice/*.html
          git commit -m "fix(physics): remediate PR375 U4 accessibility findings"
          git push origin HEAD:feat/physics-tablet-standalone
