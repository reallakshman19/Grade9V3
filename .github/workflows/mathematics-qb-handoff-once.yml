name: mathematics-qb-handoff-once

on:
  push:
    branches: [feat/mathematics-tablet-standalone]
    paths:
      - ".github/workflows/mathematics-qb-handoff-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mathematics-tablet-standalone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make Mathematics Question Bank handoff truthful
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/standalone/practice/mathematics/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.practice-meta{display:flex;gap:8px;flex-wrap:wrap}', '.practice-meta{display:flex;gap:8px;flex-wrap:wrap}.practice-note{font-size:14px;color:var(--text-muted)}')
          s=s.replace('Standalone learner pages for conceptual geometry and algebra. Use the subject-filtered Question Bank alongside these practice pages for canonical source-question study.', 'Standalone learner pages for conceptual geometry and algebra. The canonical Mathematics Question Bank currently has no admitted questions, so these pages are published and searchable without pretending a question hand-off exists.')
          s=s.replace('<a class="btn outline" href="../../../question-bank/index.html?subject=Mathematics&q=geometry">Related questions</a>', '<span class="practice-note">Canonical Mathematics questions not yet admitted.</span>')
          s=s.replace('<a class="btn outline" href="../../../question-bank/index.html?subject=Mathematics&q=equation">Related questions</a>', '<span class="practice-note">Canonical Mathematics questions not yet admitted.</span>')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          python3 Shared/tools/build_pages_site.py
      - name: Verify Blueprint 1.9 and deterministic publication
        run: |
          python3 -m unittest tests.test_mathematics_tablet_standalone
          python3 Shared/tools/standalone_conformance.py \
            standalone/core1a-mathematics-euclids-geometry-tablet.html \
            standalone/core1a-mathematics-theory-of-equations-tablet.html \
            public/standalone/practice/mathematics/index.html \
            public/standalone/practice/mathematics/euclids-geometry.html \
            public/standalone/practice/mathematics/theory-of-equations.html \
            --enforce
          python3 Shared/tools/build_pages_site.py --check
      - name: Commit reconciliation
        run: |
          rm .github/workflows/mathematics-qb-handoff-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(math): align practice handoff with canonical QB state"
          git push origin HEAD:feat/mathematics-tablet-standalone
