name: finalize-physics-blueprint-v2-snapshots

on:
  push:
    branches: [feat/physics-tablet-standalone]
    paths:
      - .github/workflows/finalize-physics-blueprint-v2.yml

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified blueprint-v2 render artifact
        uses: actions/download-artifact@v4
        with:
          name: physics-blueprint-v2-render-snapshots
          path: /tmp/g9-export
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: reallaksh19/Grade9V3
          run-id: 36897258189
      - name: Adapt review packaging and verify exact denominators
        run: |
          set -euxo pipefail
          git fetch origin main --depth=1
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          repo = Path.cwd()
          src = Path('/tmp/g9-export')
          artifact_authority = (src/'main-authority-sha.txt').read_text(encoding='utf-8').strip()
          live_main = subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip()
          if artifact_authority != live_main:
              raise SystemExit(f'artifact authority {artifact_authority} != current main {live_main}')
          tablet_css = subprocess.check_output(
              ['git','show','origin/main:public/css/tablet-12-7.css'], text=True
          )
          manifest = json.loads(subprocess.check_output(
              ['git','show','origin/main:products/physics/phy-kin-2d-motion.manifest.json'], text=True
          ))

          specs = [
              ('core1a-motion-in-a-plane-tablet.html', 'BP-CORE1A-CONSTRUCTION@1.4.0', 3, 'CORE1A'),
              ('core1a-motion-1d-straight-line-tablet.html', 'BP-CORE1A-CONSTRUCTION@1.4.0', 7, 'CORE1A'),
              ('core1a-vector-add-sub-tablet.html', 'BP-CORE1A-CONSTRUCTION@1.4.0', 4, 'CORE1A'),
              ('core1a-physics-nlm-tablet.html', 'BP-CORE1A-CONSTRUCTION@1.4.0', 11, 'CORE1A'),
              ('core2-motion-in-a-plane-tablet.html', 'BP-CORE2-SOURCE-QUESTION@1.5.0', 15, 'CORE2'),
          ]

          def adapt(text, name, role):
              text, n = re.subn(
                  r'<link\b[^>]*href="\.\./\.\./\.\./css/tablet-12-7\.css"[^>]*>',
                  '<style data-g9-inlined-tablet-css>\n' + tablet_css + '\n</style>',
                  text, count=1, flags=re.I,
              )
              if n != 1:
                  raise SystemExit(f'{name}: tablet stylesheet link count={n}')
              text = re.sub(r'<a\b[^>]*data-g9-action="pdf"[^>]*>.*?</a>', '', text, count=1, flags=re.S)
              text = text.replace('../../../index.html', '../index.html')
              text = text.replace('../../../question-bank/index.html', '../question-bank/index.html')
              if role == 'CORE1A' and name == 'core1a-motion-in-a-plane-tablet.html':
                  nav = '<nav data-g9-breadcrumb aria-label="Breadcrumb"><a href="../index.html">Home</a><a href="../question-bank/index.html">Question bank</a><span aria-current="page">CORE1A</span><a href="core2-motion-in-a-plane-tablet.html">CORE2</a></nav>'
                  text = text.replace('href="core2.html#', 'href="core2-motion-in-a-plane-tablet.html#')
              elif role == 'CORE2':
                  nav = '<nav data-g9-breadcrumb aria-label="Breadcrumb"><a href="../index.html">Home</a><a href="../question-bank/index.html">Question bank</a><a href="core1a-motion-in-a-plane-tablet.html">CORE1A</a><span aria-current="page">CORE2</span></nav>'
                  text = text.replace('href="core1a.html#', 'href="core1a-motion-in-a-plane-tablet.html#')
              else:
                  nav = f'<nav data-g9-breadcrumb aria-label="Breadcrumb"><a href="../index.html">Home</a><a href="../question-bank/index.html">Question bank</a><span aria-current="page">{role}</span></nav>'
              text, n = re.subn(r'<nav\b[^>]*data-g9-breadcrumb[^>]*>.*?</nav>', nav, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{name}: breadcrumb count={n}')
              text = text.replace('<html ', f'<html data-g9-authority-sha="{artifact_authority}" data-g9-snapshot="review" ', 1)
              note = (f'<aside data-g9-snapshot-note class="g9-card" style="margin:0 0 14px">'
                      f'<strong>Review snapshot.</strong> Generated by render_core/2 from merged blueprint authority '
                      f'<code>main@{artifact_authority}</code>. Academic content is the governed manifest/package/bank projection; '
                      f'only standalone navigation, PDF-control removal and CSS inlining are adapted.</aside>')
              text, n = re.subn(r'(<main\b[^>]*>)', r'\1' + note, text, count=1)
              if n != 1:
                  raise SystemExit(f'{name}: main count={n}')
              return text

          for name, blueprint, count, role in specs:
              text = adapt((src/name).read_text(encoding='utf-8'), name, role)
              m = re.search(r'<body\b[^>]*data-blueprint-ref="([^"]+)"', text)
              if not m or m.group(1) != blueprint:
                  raise SystemExit(f'{name}: blueprint mismatch')
              units = re.findall(r'data-g9-unit="([^"]+)"', text)
              if len(units) != count:
                  raise SystemExit(f'{name}: expected {count} units, found {len(units)}')
              if re.search(r'<(?:script|link)\b[^>]*(?:src|href)="https?://', text, re.I):
                  raise SystemExit(f'{name}: external runtime dependency')
              text = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
              out = repo/'standalone'/name
              out.write_text(text, encoding='utf-8')
              print(name, 'units=', len(units), 'bytes=', out.stat().st_size)

          core2 = (repo/'standalone/core2-motion-in-a-plane-tablet.html').read_text(encoding='utf-8')
          actual = re.findall(r'<article\b[^>]*data-g9-unit="([^"]+)"[^>]*data-g9-kind="QUESTION"', core2)
          expected = manifest['selection']['core2']
          if actual != expected:
              raise SystemExit(f'Core2 manifest mismatch: {len(actual)}/{len(expected)}')
          print('Motion2D Core2 exact manifest tally:', len(actual), '/', len(expected))
          PY
      - name: Remove superseded parallel practice file
        run: rm -f standalone/motion-1d-practice-companion-tablet.html
      - name: Commit verified snapshots
        run: |
          set -eux
          rm -f .github/workflows/sync-physics-blueprint-v2.yml
          rm -f .github/workflows/finalize-physics-blueprint-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix(physics): regenerate standalone pages from blueprint v2 [skip ci]'
          git push origin HEAD:feat/physics-tablet-standalone
