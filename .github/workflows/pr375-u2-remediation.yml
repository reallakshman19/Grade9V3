name: pr375-u2-remediation

on:
  push:
    branches:
      - feat/physics-tablet-standalone
    paths:
      - .github/workflows/pr375-u2-remediation.yml

permissions:
  contents: write

concurrency:
  group: pr375-u2-remediation
  cancel-in-progress: false

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/physics-tablet-standalone
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply bounded U2 navigation and offline remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import os
          import re
          import shutil

          ROOT = Path('.').resolve()
          ST = ROOT / 'standalone'
          PR = ST / 'practice'

          PAGES = [
              ST / 'core1a-motion-1d-straight-line-tablet.html',
              ST / 'core1a-motion-in-a-plane-tablet.html',
              ST / 'core1a-physics-nlm-tablet.html',
              ST / 'core1a-vector-add-sub-tablet.html',
              ST / 'core2-motion-in-a-plane-tablet.html',
              ST / 'core2-physics-thrust-pressure-tablet.html',
              PR / 'core1a-physics-motion-2d-ncert-tablet.html',
              PR / 'core1a-physics-nlm-tablet.html',
              PR / 'core1a-physics-vectors-tablet.html',
              PR / 'core1a-sba-06-07-trajectory-and-height-tablet.html',
              PR / 'core1a-sba-motion-in-a-plane-master-tablet.html',
              PR / 'core2-motion-1d-straight-line-tablet.html',
              PR / 'core2-motion-consolidated-practice-tablet.html',
              PR / 'core2-motion-in-a-plane-tablet.html',
              PR / 'core2-physics-thrust-pressure-tablet.html',
              PR / 'core2a-projectile-study.html',
              PR / 'index.html',
              PR / 'motion-in-1d-master-suite.html',
              PR / 'motion-in-2d-master-suite.html',
              PR / 'physics-motion-in-a-plane-interactive-suite.html',
          ]
          ROOT_PAGES = PAGES[:6]
          assert len(PAGES) == 20 and all(p.exists() for p in PAGES)

          changed = set()

          def save(path: Path, text: str):
              old = path.read_text(encoding='utf-8')
              if text != old:
                  path.write_text(text, encoding='utf-8')
                  changed.add(path.relative_to(ROOT).as_posix())

          # U2-1/U2-3/U2-4: make runtime dependencies genuinely local to standalone/.
          vendors = [
              ('katex', '0.16.8'),
              ('tailwind', '3.4.17'),
          ]
          for package, version in vendors:
              src = ROOT / 'public' / 'vendor' / package / version
              dst = ST / 'vendor' / package / version
              assert src.is_dir(), src
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.copytree(src, dst)

          katex_pages = [
              PR / 'core2a-projectile-study.html',
              PR / 'motion-in-1d-master-suite.html',
              PR / 'motion-in-2d-master-suite.html',
              PR / 'physics-motion-in-a-plane-interactive-suite.html',
          ]
          for path in katex_pages:
              text = path.read_text(encoding='utf-8')
              text = text.replace('../../public/vendor/katex/0.16.8/', '../vendor/katex/0.16.8/')
              save(path, text)

          motion2d = PR / 'motion-in-2d-master-suite.html'
          text = motion2d.read_text(encoding='utf-8')
          remote_tailwind = '<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>'
          local_tailwind = '<script src="../vendor/tailwind/3.4.17/tailwind-play.js"></script>'
          if remote_tailwind in text:
              text = text.replace(remote_tailwind, local_tailwind, 1)
          assert local_tailwind in text
          text = text.replace('CDN libraries remain remote.', 'Shared runtime dependencies are vendored under standalone/vendor.')
          # U2-7: collapse the one duplicate runtime DOM id.
          while text.count('id="sbTeacherChalk"') > 1:
              text, n = re.subn(
                  r'(<g id="sbTeacherChalk" style="display: none;"></g>\s*)<g id="sbTeacherChalk" style="display: none;"></g>',
                  r'\1', text, count=1,
              )
              assert n == 1, 'duplicate sbTeacherChalk could not be safely collapsed'
          save(motion2d, text)

          motion1d = PR / 'motion-in-1d-master-suite.html'
          text = motion1d.read_text(encoding='utf-8')
          if '../vendor/tailwind/3.4.17/tailwind-play.js' not in text:
              config_pos = text.find('tailwind.config')
              if config_pos < 0:
                  config_pos = text.find('(window.tailwind = window.tailwind || {}).config')
              assert config_pos >= 0, 'Tailwind config marker missing from 1D master'
              script_pos = text.rfind('<script', 0, config_pos)
              assert script_pos >= 0
              text = text[:script_pos] + local_tailwind + '\n  ' + text[script_pos:]
          # U2-5: replace the icon-only return control with the same visible label used elsewhere.
          hub_anchor = re.compile(
              r'(<a\b[^>]*href="index\.html"[^>]*aria-label="Back to Practice Hub"[^>]*>)(.*?)(</a>)',
              re.S,
          )
          match = hub_anchor.search(text)
          if match and 'Practice Hub' not in re.sub(r'<[^>]+>', '', match.group(2)):
              text = text[:match.start()] + match.group(1) + '← Practice Hub' + match.group(3) + text[match.end():]
          save(motion1d, text)

          # U2-3: the Thrust product already has Practice Hub navigation; remove the extra full-site
          # Question Bank dependency so a copied standalone/ tree stays self-contained.
          for path in [PR / 'core2-physics-thrust-pressure-tablet.html']:
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'<a\b[^>]*href="\.\./\.\./public/question-bank/index\.html"[^>]*>\s*Question bank\s*</a>',
                  '', text,
              )
              save(path, text)

          # Build a fragment index over the exact U2 denominator, then repair legacy generated
          # core1a.html/core2.html links to concrete surviving standalone products.
          ids_by_file = {}
          locations = defaultdict(list)
          for path in PAGES:
              ids = set(re.findall(r'\bid="([^"]+)"', path.read_text(encoding='utf-8')))
              ids_by_file[path] = ids
              for item in ids:
                  locations[item].append(path)

          fallback = {
              'core1a-motion-1d-straight-line-tablet.html': PR / 'core2-motion-1d-straight-line-tablet.html',
              'core1a-motion-in-a-plane-tablet.html': PR / 'core2-motion-in-a-plane-tablet.html',
              'core1a-physics-nlm-tablet.html': PR / 'core1a-physics-nlm-tablet.html',
              'core1a-vector-add-sub-tablet.html': PR / 'core1a-physics-vectors-tablet.html',
              'core2-motion-in-a-plane-tablet.html': ST / 'core1a-motion-in-a-plane-tablet.html',
              'core2-physics-thrust-pressure-tablet.html': PR / 'core2-physics-thrust-pressure-tablet.html',
          }
          fallback_uses = []

          def rel_href(source: Path, target: Path, fragment: str | None = None) -> str:
              rel = os.path.relpath(target, source.parent).replace(os.sep, '/')
              return rel + (('#' + fragment) if fragment else '')

          def choose_fragment_target(source: Path, legacy_kind: str, fragment: str):
              # Same-page concept references are strongest.
              if fragment in ids_by_file.get(source, set()):
                  return '#' + fragment
              candidates = [p for p in locations.get(fragment, []) if p != source]
              if candidates:
                  if legacy_kind == 'core1a':
                      candidates.sort(key=lambda p: (p.parent == PR, p.as_posix()))
                  else:
                      candidates.sort(key=lambda p: (p.parent != PR, p.as_posix()))
                  return rel_href(source, candidates[0], fragment)
              target = fallback[source.name]
              fallback_uses.append((source.name, legacy_kind, fragment, target.name))
              return rel_href(source, target)

          legacy_re = re.compile(r'href="(core1a|core2)\.html#([^"]+)"')
          for path in ROOT_PAGES:
              text = path.read_text(encoding='utf-8')
              # Home now lands on the actual offline Practice Hub.
              text = text.replace('href="../index.html"', 'href="practice/index.html"')
              # Remove dead/full-site Question Bank links from the standalone review snapshots.
              text = re.sub(
                  r'<a\b[^>]*href="\.\./question-bank/index\.html"[^>]*>\s*Question bank\s*</a>',
                  '', text,
              )
              # Root Thrust had an index.html link that resolved to nonexistent standalone/index.html.
              text = text.replace('href="index.html"', 'href="practice/index.html"')

              def legacy_replace(match):
                  kind, fragment = match.group(1), match.group(2)
                  href = choose_fragment_target(path, kind, fragment)
                  return f'href="{href}"'

              text = legacy_re.sub(legacy_replace, text)
              save(path, text)

          print(f'legacy deep-link fallbacks without exact surviving fragment: {len(fallback_uses)}')
          for item in fallback_uses:
              print('  fallback:', item)

          # U2-6/U2-9a: make Answer Matrix and Fast Jump share one state-safe jump path.
          core2 = PR / 'core2-motion-in-a-plane-tablet.html'
          text = core2.read_text(encoding='utf-8')
          if 'function jumpToQuestion(qId)' not in text:
              helper = r'''
          // U2 navigation: every jump first returns to the complete visible question set.
          function jumpToQuestion(qId) {
            const allTab = document.querySelector('.tab-btn[data-topic="all"]');
            document.querySelectorAll('.tab-btn[data-topic]').forEach(btn => {
              btn.classList.toggle('active', btn === allTab);
            });
            const matrix = document.getElementById('answer-matrix-view');
            if (matrix) matrix.style.display = 'none';
            const search = document.getElementById('search-input');
            if (search) search.value = '';
            document.querySelectorAll('article.challenge-card').forEach(card => {
              card.style.display = '';
            });
            const targetEl = document.getElementById(qId);
            if (!targetEl) return false;
            if (location.hash !== '#' + qId) history.pushState(null, '', '#' + qId);
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            const jumpSelect = document.getElementById('jump-select');
            if (jumpSelect) jumpSelect.value = qId;
            return true;
          }

          '''
              marker = '// 4. Fast Jump Selector'
              assert marker in text
              text = text.replace(marker, helper + marker, 1)

          old_jump = re.compile(
              r'''const targetEl = document\.getElementById\(qId\);\s*if \(targetEl\) \{\s*targetEl\.style\.display = '';\s*targetEl\.scrollIntoView\(\{ behavior: 'smooth', block: 'start' \}\);\s*\}'''
          )
          text, n = old_jump.subn("jumpToQuestion(qId);", text, count=1)
          assert n == 1 or 'jumpToQuestion(qId);' in text

          def matrix_link(match):
              qid, style = match.group(1), match.group(2)
              style = style.replace('min-height:36px', 'min-height:48px')
              style = style.replace('min-width:36px', 'min-width:48px')
              style = style.replace('padding:4px 10px', 'padding:10px 14px')
              style = style.replace('font-size:12px', 'font-size:13.5px')
              return (f'<a href="#{qid}" class="btn jump-link" style="{style}" '
                      f'onclick="jumpToQuestion(\'{qid}\'); return false;">Jump</a>')

          matrix_pattern = re.compile(r'<a href="#(q\d{2})" class="btn" style="([^"]*)">Jump</a>')
          text, matrix_count = matrix_pattern.subn(matrix_link, text)
          assert matrix_count in (0, 59), matrix_count
          assert text.count('onclick="jumpToQuestion(') >= 59
          save(core2, text)

          # U2-5: make every local Practice-Hub anchor retain a >=48px offline hit target even if
          # a page-specific styling runtime is unavailable.
          return_style = '''<style id="u2-practice-hub-target">\n  a[href="index.html"]{min-height:48px!important;min-width:48px!important;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center}\n</style>\n'''
          for path in [p for p in PAGES if p.parent == PR and p.name != 'index.html']:
              text = path.read_text(encoding='utf-8')
              if 'id="u2-practice-hub-target"' not in text:
                  assert '</head>' in text
                  text = text.replace('</head>', return_style + '</head>', 1)
              save(path, text)

          # U2-8: correct hub counts from the content actually present.
          hub = PR / 'index.html'
          text = hub.read_text(encoding='utf-8')
          text = text.replace('354 questions', '59 questions')
          topic_count = len(re.findall(r'<section class="section-header"><h2>', text))
          q_counts = []
          for value in re.findall(r'<div class="q-count">([^<]+)</div>', text):
              m = re.search(r'\d+', value)
              if m:
                  q_counts.append(int(m.group()))
          text = re.sub(
              r'(<div class="stat"><div class="number">)\d+\+?(</div><div class="label">Questions</div>)',
              lambda m: m.group(1) + str(sum(q_counts)) + '+' + m.group(2), text, count=1,
          )
          text = re.sub(
              r'(<div class="stat"><div class="number">)\d+(</div><div class="label">Topics</div>)',
              lambda m: m.group(1) + str(topic_count) + m.group(2), text, count=1,
          )
          # U2-9b: replace the malformed NLM card arrow with the same valid glyph path as its peers.
          standard_arrow = 'M3 8a.75.75 0 0 1 .75-.75h6.19L7.47 4.78a.75.75 0 0 1 1.06-1.06l3.5 3.5a.75.75 0 0 1 0 1.06l-3.5 3.5a.75.75 0 1 1-1.06-1.06l2.47-2.47H3.75A.75.75 0 0 1 3 8z'
          nlm_card = re.compile(r'(<a class="card" href="core1a-physics-nlm-tablet\.html">.*?<svg[^>]*><path d=")[^"]+("/>)', re.S)
          text, _ = nlm_card.subn(lambda m: m.group(1) + standard_arrow + m.group(2), text, count=1)
          save(hub, text)

          # U2-9d: external source anchors remain intentionally online; make that visible to learners.
          online_style = '''<style id="u2-online-link-note">\n  a[href^="https://"]::after,a[href^="http://"]::after{content:" · online";font-size:.85em;font-weight:600}\n</style>\n'''
          for path in PAGES:
              text = path.read_text(encoding='utf-8')
              if re.search(r'<a\b[^>]*href="https?://', text) and 'id="u2-online-link-note"' not in text:
                  assert '</head>' in text
                  text = text.replace('</head>', online_style + '</head>', 1)
                  save(path, text)

          # U2-9c metadata: disambiguate the one exact duplicate title between root and practice Thrust.
          root_thrust = ST / 'core2-physics-thrust-pressure-tablet.html'
          practice_thrust = PR / 'core2-physics-thrust-pressure-tablet.html'
          rt = root_thrust.read_text(encoding='utf-8')
          pt = practice_thrust.read_text(encoding='utf-8')
          root_title = re.search(r'<title>(.*?)</title>', rt, re.S)
          practice_title = re.search(r'<title>(.*?)</title>', pt, re.S)
          if root_title and practice_title and root_title.group(1) == practice_title.group(1):
              rt = rt[:root_title.start(1)] + root_title.group(1) + ' · Root review snapshot' + rt[root_title.end(1):]
              save(root_thrust, rt)

          # Durable regression test for the exact U2 denominator.
          test_path = ROOT / 'tests' / 'test_pr375_u2_standalone.py'
          test_path.write_text(r'''from __future__ import annotations

from collections import Counter
from pathlib import Path
import re
import unittest
from urllib.parse import unquote, urlsplit

ROOT = Path(__file__).resolve().parents[1]
PAGES = [
    ROOT / 'standalone/core1a-motion-1d-straight-line-tablet.html',
    ROOT / 'standalone/core1a-motion-in-a-plane-tablet.html',
    ROOT / 'standalone/core1a-physics-nlm-tablet.html',
    ROOT / 'standalone/core1a-vector-add-sub-tablet.html',
    ROOT / 'standalone/core2-motion-in-a-plane-tablet.html',
    ROOT / 'standalone/core2-physics-thrust-pressure-tablet.html',
    ROOT / 'standalone/practice/core1a-physics-motion-2d-ncert-tablet.html',
    ROOT / 'standalone/practice/core1a-physics-nlm-tablet.html',
    ROOT / 'standalone/practice/core1a-physics-vectors-tablet.html',
    ROOT / 'standalone/practice/core1a-sba-06-07-trajectory-and-height-tablet.html',
    ROOT / 'standalone/practice/core1a-sba-motion-in-a-plane-master-tablet.html',
    ROOT / 'standalone/practice/core2-motion-1d-straight-line-tablet.html',
    ROOT / 'standalone/practice/core2-motion-consolidated-practice-tablet.html',
    ROOT / 'standalone/practice/core2-motion-in-a-plane-tablet.html',
    ROOT / 'standalone/practice/core2-physics-thrust-pressure-tablet.html',
    ROOT / 'standalone/practice/core2a-projectile-study.html',
    ROOT / 'standalone/practice/index.html',
    ROOT / 'standalone/practice/motion-in-1d-master-suite.html',
    ROOT / 'standalone/practice/motion-in-2d-master-suite.html',
    ROOT / 'standalone/practice/physics-motion-in-a-plane-interactive-suite.html',
]
LOCAL_ATTR_RE = re.compile(r'\b(?:href|src|action|poster|data)=["\']([^"\']+)["\']', re.I)
REMOTE_DEP_RE = re.compile(
    r'<(?:script|link|img|iframe|source|embed|object|video|audio)\b[^>]*(?:src|href|data|poster)=["\']https?://',
    re.I,
)
ID_RE = re.compile(r'\bid=["\']([^"\']+)["\']', re.I)


def ids_for(path: Path) -> set[str]:
    return set(ID_RE.findall(path.read_text(encoding='utf-8')))


class TestPR375U2Standalone(unittest.TestCase):
    def test_exact_denominator_exists(self):
        self.assertEqual(20, len(PAGES))
        self.assertEqual(20, len(set(PAGES)))
        for page in PAGES:
            self.assertTrue(page.is_file(), page)

    def test_no_remote_runtime_dependencies_or_legacy_vendor_paths(self):
        for page in PAGES:
            text = page.read_text(encoding='utf-8')
            self.assertIsNone(REMOTE_DEP_RE.search(text), page)
            self.assertNotIn('www.gstatic.com/antigravity/web/dev/tailwindcss.min.js', text, page)
            self.assertNotIn('../../public/vendor/katex/0.16.8/', text, page)
        self.assertTrue((ROOT / 'standalone/vendor/katex/0.16.8/katex.min.css').is_file())
        self.assertTrue((ROOT / 'standalone/vendor/tailwind/3.4.17/tailwind-play.js').is_file())

    def test_relative_files_and_cross_file_fragments_resolve(self):
        id_cache = {page.resolve(): ids_for(page) for page in PAGES}
        for page in PAGES:
            text = page.read_text(encoding='utf-8')
            for ref in LOCAL_ATTR_RE.findall(text):
                ref = ref.strip()
                if not ref or ref.startswith(('#', '?', 'data:', 'javascript:', 'mailto:', 'tel:', 'blob:', '//')):
                    continue
                parts = urlsplit(ref)
                if parts.scheme in {'http', 'https'}:
                    continue
                target = (page.parent / unquote(parts.path)).resolve()
                self.assertTrue(target.exists(), f'{page}: {ref} -> {target}')
                if parts.fragment and target.suffix.lower() in {'.html', '.htm'}:
                    target_ids = id_cache.get(target)
                    if target_ids is None:
                        target_ids = ids_for(target)
                        id_cache[target] = target_ids
                    self.assertIn(unquote(parts.fragment), target_ids, f'{page}: {ref}')

    def test_no_duplicate_ids(self):
        for page in PAGES:
            ids = ID_RE.findall(page.read_text(encoding='utf-8'))
            dupes = [key for key, count in Counter(ids).items() if count > 1]
            self.assertEqual([], dupes, f'{page}: duplicate ids {dupes}')

    def test_root_legacy_navigation_is_gone(self):
        for page in PAGES[:6]:
            text = page.read_text(encoding='utf-8')
            self.assertNotIn('href="../index.html"', text, page)
            self.assertNotIn('href="../question-bank/index.html"', text, page)
            self.assertNotRegex(text, r'href="core1a\.html#')
            self.assertNotRegex(text, r'href="core2\.html#')

    def test_hub_inventory_and_claims(self):
        hub = (ROOT / 'standalone/practice/index.html').read_text(encoding='utf-8')
        self.assertEqual(13, len(re.findall(r'<a class="card" href="[^"]+">', hub)))
        self.assertIn('59 questions', hub)
        self.assertRegex(hub, r'<div class="number">7</div><div class="label">Topics</div>')
        self.assertRegex(hub, r'<div class="number">0</div><div class="label">Remote CDN</div>')

    def test_answer_matrix_jump_contract(self):
        text = (ROOT / 'standalone/practice/core2-motion-in-a-plane-tablet.html').read_text(encoding='utf-8')
        self.assertIn('function jumpToQuestion(qId)', text)
        self.assertEqual(59, len(re.findall(r'onclick="jumpToQuestion\(\'q\d{2}\'\); return false;"', text)))
        self.assertNotIn('min-height:36px;min-width:36px', text)

    def test_return_links_have_offline_touch_fallback(self):
        modules = [page for page in PAGES if page.parent.name == 'practice' and page.name != 'index.html']
        self.assertEqual(13, len(modules))
        for page in modules:
            text = page.read_text(encoding='utf-8')
            self.assertIn('href="index.html"', text, page)
            self.assertIn('id="u2-practice-hub-target"', text, page)


if __name__ == '__main__':
    unittest.main()
''', encoding='utf-8')
          changed.add(test_path.relative_to(ROOT).as_posix())

          # Keep the new static U2 regression in the existing informational code-test signal.
          workflow = ROOT / '.github/workflows/learner-quality.yml'
          wf = workflow.read_text(encoding='utf-8')
          if 'tests.test_pr375_u2_standalone' not in wf:
              needle = '          tests.test_renderer_inventory\n'
              assert needle in wf
              wf = wf.replace(needle, needle + '          tests.test_pr375_u2_standalone\n', 1)
              workflow.write_text(wf, encoding='utf-8')
              changed.add(workflow.relative_to(ROOT).as_posix())

          print('U2 changed paths:')
          for path in sorted(changed):
              print(' ', path)
          PY

      - name: Static U2 regression crawl
        shell: bash
        run: |
          python3 -m unittest tests.test_pr375_u2_standalone
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages = [
              Path('standalone/core1a-motion-1d-straight-line-tablet.html'),
              Path('standalone/core1a-motion-in-a-plane-tablet.html'),
              Path('standalone/core1a-physics-nlm-tablet.html'),
              Path('standalone/core1a-vector-add-sub-tablet.html'),
              Path('standalone/core2-motion-in-a-plane-tablet.html'),
              Path('standalone/core2-physics-thrust-pressure-tablet.html'),
              *sorted(Path('standalone/practice').glob('*.html')),
          ]
          # The exact denominator is six root pages + fourteen practice pages.
          pages = pages[:6] + [p for p in pages[6:] if p.name in {
              'core1a-physics-motion-2d-ncert-tablet.html','core1a-physics-nlm-tablet.html',
              'core1a-physics-vectors-tablet.html','core1a-sba-06-07-trajectory-and-height-tablet.html',
              'core1a-sba-motion-in-a-plane-master-tablet.html','core2-motion-1d-straight-line-tablet.html',
              'core2-motion-consolidated-practice-tablet.html','core2-motion-in-a-plane-tablet.html',
              'core2-physics-thrust-pressure-tablet.html','core2a-projectile-study.html','index.html',
              'motion-in-1d-master-suite.html','motion-in-2d-master-suite.html',
              'physics-motion-in-a-plane-interactive-suite.html'}}]
          assert len(pages) == 20, len(pages)
          total_refs = 0
          for p in pages:
              total_refs += len(re.findall(r'\b(?:href|src|action|poster|data)=["\'][^"\']+["\']', p.read_text(encoding='utf-8')))
          print(f'static U2 crawl: PASS ({len(pages)}/20 pages, {total_refs} HTML refs)')
          PY

      - name: Install Chromium audit dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser U2 regression audit
        shell: bash
        run: |
          python3 -m http.server 8766 --directory . >/tmp/pr375-u2-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket, time
          for _ in range(100):
              try:
                  with socket.create_connection(('127.0.0.1', 8766), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('local HTTP server did not start')
          PY
          cat > /tmp/pr375-u2-audit.mjs <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          const { pathToFileURL } = require('url');

          function assert(cond, message) {
            if (!cond) throw new Error(message);
          }

          const browser = await chromium.launch({headless:true});
          const base = 'http://127.0.0.1:8766/standalone/practice/';
          const criticalErrors = [];

          async function configure(page, external) {
            page.on('pageerror', err => {
              const msg = String(err);
              if (/tailwind is not defined/i.test(msg)) criticalErrors.push(msg);
            });
            page.on('request', req => {
              try {
                const u = new URL(req.url());
                if ((u.protocol === 'http:' || u.protocol === 'https:') && !['127.0.0.1','localhost'].includes(u.hostname)) {
                  external.push(req.url());
                }
              } catch {}
            });
          }

          const ctx = await browser.newContext({viewport:{width:1366,height:854}});
          const page = await ctx.newPage();
          let external = [];
          await configure(page, external);

          // U2-1 + U2-5: local Tailwind and a real >=48px return target.
          await page.goto(base + 'motion-in-2d-master-suite.html', {waitUntil:'load'});
          await page.waitForTimeout(800);
          assert(external.length === 0, '2D master made external requests: ' + external.join(', '));
          let hubBox = await page.locator('a[href="index.html"]').first().boundingBox();
          assert(hubBox && hubBox.height >= 47.5 && hubBox.width >= 47.5, '2D master hub target too small');

          external = [];
          await page.goto(base + 'motion-in-1d-master-suite.html', {waitUntil:'load'});
          await page.waitForTimeout(800);
          assert(external.length === 0, '1D master made external requests: ' + external.join(', '));
          assert(criticalErrors.length === 0, 'critical page error: ' + criticalErrors.join(' | '));
          const overflow = await page.evaluate(() => ({sw:document.documentElement.scrollWidth, iw:innerWidth}));
          assert(overflow.sw <= overflow.iw + 1, `1D master horizontal overflow ${overflow.sw} > ${overflow.iw}`);
          const hubText = (await page.locator('a[href="index.html"]').first().innerText()).trim();
          assert(hubText.includes('Practice Hub'), '1D master return link is still icon-only');

          // Hub denominator and round-trip history on all 13 modules.
          await page.goto(base + 'index.html');
          const hrefs = await page.locator('a.card').evaluateAll(nodes => nodes.map(n => n.getAttribute('href')));
          assert(hrefs.length === 13, `hub cards ${hrefs.length} != 13`);
          for (const href of hrefs) {
            await page.goto(base + href, {waitUntil:'load'});
            const link = page.locator('a[href="index.html"]').first();
            assert(await link.count(), `missing Practice Hub link on ${href}`);
            const box = await link.boundingBox();
            assert(box && box.height >= 47.5 && box.width >= 47.5, `small return target on ${href}`);
            await link.click();
            await page.waitForLoadState('load');
            assert(page.url().endsWith('/standalone/practice/index.html'), `return link wrong for ${href}`);
            await page.goBack();
            assert(page.url().includes(href), `Back failed for ${href}`);
            await page.goForward();
            assert(page.url().endsWith('/standalone/practice/index.html'), `Forward failed for ${href}`);
            await page.reload();
          }

          // U2-6/U2-9a: every matrix jump lands on a visible card and resets the filter to All.
          await page.goto(base + 'core2-motion-in-a-plane-tablet.html', {waitUntil:'load'});
          const matrixTab = page.locator('.tab-btn[data-topic="matrix"]');
          const jumpCount = await page.locator('#answer-matrix-view a[href^="#q"]').count();
          assert(jumpCount === 59, `matrix jumps ${jumpCount} != 59`);
          for (let i = 0; i < jumpCount; i++) {
            await matrixTab.click();
            const link = page.locator('#answer-matrix-view a[href^="#q"]').nth(i);
            const qid = (await link.getAttribute('href')).slice(1);
            await link.click();
            const visible = await page.locator('#' + qid).evaluate(el => getComputedStyle(el).display !== 'none' && el.getBoundingClientRect().height > 0);
            assert(visible, `matrix jump did not reveal ${qid}`);
            assert(await page.locator('.tab-btn[data-topic="all"]').evaluate(el => el.classList.contains('active')), `All tab not active after ${qid}`);
          }
          await page.locator('.tab-btn[data-topic="horizontal"]').click();
          await page.locator('#jump-select').selectOption('q01');
          assert(await page.locator('#q01').evaluate(el => getComputedStyle(el).display !== 'none'), 'Fast Jump did not reveal q01');
          assert(await page.locator('.tab-btn[data-topic="all"]').evaluate(el => el.classList.contains('active')), 'Fast Jump left stale topic active');

          await ctx.close();

          // True file:// + offline pass for the pages with vendored runtime dependencies.
          const offline = await browser.newContext({viewport:{width:1366,height:854}, offline:true});
          const op = await offline.newPage();
          const offlineExternal = [];
          await configure(op, offlineExternal);
          const repo = process.cwd();
          for (const rel of [
            'standalone/practice/motion-in-2d-master-suite.html',
            'standalone/practice/motion-in-1d-master-suite.html',
            'standalone/practice/core2a-projectile-study.html',
            'standalone/practice/physics-motion-in-a-plane-interactive-suite.html'
          ]) {
            await op.goto(pathToFileURL(path.join(repo, rel)).href, {waitUntil:'load'});
            await op.waitForTimeout(500);
          }
          assert(offlineExternal.length === 0, 'offline file pages requested network: ' + offlineExternal.join(', '));
          assert(criticalErrors.length === 0, 'critical offline page error: ' + criticalErrors.join(' | '));
          await offline.close();
          await browser.close();
          console.log('browser U2 audit: PASS (13/13 round trips, 59/59 matrix jumps, http + file offline)');
          JS
          node /tmp/pr375-u2-audit.mjs

      - name: Ensure feature branch did not advance during audit
        shell: bash
        run: |
          remote_sha=$(git ls-remote origin refs/heads/feat/physics-tablet-standalone | awk '{print $1}')
          test "$remote_sha" = "$GITHUB_SHA" || { echo "branch advanced from $GITHUB_SHA to $remote_sha; refusing to overwrite"; exit 1; }

      - name: Commit verified U2 remediation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr375-u2-remediation.yml
          git add .github/workflows/learner-quality.yml \
                  tests/test_pr375_u2_standalone.py \
                  standalone/vendor \
                  standalone/core1a-motion-1d-straight-line-tablet.html \
                  standalone/core1a-motion-in-a-plane-tablet.html \
                  standalone/core1a-physics-nlm-tablet.html \
                  standalone/core1a-vector-add-sub-tablet.html \
                  standalone/core2-motion-in-a-plane-tablet.html \
                  standalone/core2-physics-thrust-pressure-tablet.html \
                  standalone/practice/*.html
          git diff --cached --check
          git commit -m "fix(physics): remediate PR375 U2 navigation offline findings"
          git push origin HEAD:feat/physics-tablet-standalone
