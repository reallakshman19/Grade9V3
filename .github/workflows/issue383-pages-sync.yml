name: issue383-pages-sync

on:
  push:
    branches:
      - physics/thrust-pressure-competitive-383
    paths:
      - ".github/workflows/issue383-pages-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: physics/thrust-pressure-competitive-383
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate governed Pages mirror and push exact output
        run: |
          python3 Shared/tools/build_pages_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "chore(pages): sync Thrust question-bank mirror"
            git push origin HEAD:physics/thrust-pressure-competitive-383
          fi
