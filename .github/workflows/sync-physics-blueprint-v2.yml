name: sync-physics-blueprint-v2-snapshots

on:
  push:
    branches: [feat/physics-tablet-standalone]
    paths:
      - .github/workflows/sync-physics-blueprint-v2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer dependencies
        run: pip install --quiet jsonschema pypdf
      - name: Render from current merged main
        run: |
          set -euxo pipefail
          git fetch origin main --depth=1
          rm -rf /tmp/g9-main /tmp/g9-sync
          git worktree add --detach /tmp/g9-main origin/main
          mkdir -p /tmp/g9-sync/{motion2d,motion1d,vectors,nlm}
          cd /tmp/g9-main
          python3 Shared/tools/render_core.py build --manifest products/physics/phy-kin-2d-motion.manifest.json --out /tmp/g9-sync/motion2d --mode SINGLE_FILE --draft
          python3 Shared/tools/render_core.py build --manifest products/physics/phy-kin-1d-motion.manifest.json --out /tmp/g9-sync/motion1d --mode SINGLE_FILE --draft
          python3 Shared/tools/render_core.py build --manifest products/physics/phy-vec-add-sub.manifest.json --out /tmp/g9-sync/vectors --mode SINGLE_FILE --draft
          python3 Shared/tools/render_core.py build --manifest products/physics/phy-nlm-first-law.manifest.json --out /tmp/g9-sync/nlm --mode SINGLE_FILE --draft
      - name: Adapt only standalone packaging and verify semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          repo = Path.cwd()
          main = Path('/tmp/g9-main')
          authority = subprocess.check_output(['git','-C',str(main),'rev-parse','HEAD'], text=True).strip()

          specs = [
              ('motion2d/core1a.html', 'standalone/core1a-motion-in-a-plane-tablet.html', 'BP-CORE1A-CONSTRUCTION@1.4.0', 3, 'CORE1A'),
              ('motion1d/core1a.html', 'standalone/core1a-motion-1d-straight-line-tablet.html', 'BP-CORE1A-CONSTRUCTION@1.4.0', 7, 'CORE1A'),
              ('vectors/core1a.html', 'standalone/core1a-vector-add-sub-tablet.html', 'BP-CORE1A-CONSTRUCTION@1.4.0', 4, 'CORE1A'),
              ('nlm/core1a.html', 'standalone/core1a-physics-nlm-tablet.html', 'BP-CORE1A-CONSTRUCTION@1.4.0', 11, 'CORE1A'),
              ('motion2d/core2.html', 'standalone/core2-motion-in-a-plane-tablet.html', 'BP-CORE2-SOURCE-QUESTION@1.5.0', 15, 'CORE2'),
          ]

          def package(text, dst, role):
              if 'data-g9-mode="SINGLE_FILE"' not in text:
                  raise SystemExit(f'{dst}: renderer did not produce SINGLE_FILE packaging')
              # SINGLE_FILE should already be self-contained. Remove any generated PDF control
              # because this review snapshot does not ship a sibling PDF.
              text = re.sub(r'<a\b[^>]*data-g9-action="pdf"[^>]*>.*?</a>', '', text, count=1, flags=re.S)
              text = text.replace('../../../index.html', '../index.html')
              text = text.replace('../../../question-bank/index.html', '../question-bank/index.html')
              # Standalone review set only exposes destinations that actually exist in this PR.
              if role == 'CORE1A' and 'motion-in-a-plane' in dst:
                  nav = '<nav data-g9-breadcrumb aria-label="Breadcrumb"><a href="../index.html">Home</a><a href="../question-bank/index.html">Question bank</a><span aria-current="page">CORE1A</span><a href="core2-motion-in-a-plane-tablet.html">CORE2</a></nav>'
              elif role == 'CORE2':
                  nav = '<nav data-g9-breadcrumb aria-label="Breadcrumb"><a href="../index.html">Home</a><a href="../question-bank/index.html">Question bank</a><a href="core1a-motion-in-a-plane-tablet.html">CORE1A</a><span aria-current="page">CORE2</span></nav>'
              else:
                  nav = f'<nav data-g9-breadcrumb aria-label="Breadcrumb"><a href="../index.html">Home</a><a href="../question-bank/index.html">Question bank</a><span aria-current="page">{role}</span></nav>'
              text, n = re.subn(r'<nav\b[^>]*data-g9-breadcrumb[^>]*>.*?</nav>', nav, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{dst}: breadcrumb adaptation failed')
              if role == 'CORE1A' and 'motion-in-a-plane' in dst:
                  text = text.replace('href="core2.html#', 'href="core2-motion-in-a-plane-tablet.html#')
              if role == 'CORE2':
                  text = text.replace('href="core1a.html#', 'href="core1a-motion-in-a-plane-tablet.html#')
              text = text.replace('<html ', f'<html data-g9-authority-sha="{authority}" data-g9-snapshot="review" ', 1)
              note = (f'<aside data-g9-snapshot-note style="border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px;color:var(--muted);font-size:.9rem">'
                      f'Review snapshot generated by render_core/2 from merged blueprint authority main@{authority}. Academic content is the governed manifest/package/bank projection; only standalone navigation/PDF packaging is adapted.</aside>')
              text, n = re.subn(r'(<main\b[^>]*>)', r'\1' + note, text, count=1)
              if n != 1:
                  raise SystemExit(f'{dst}: main snapshot note insertion failed')
              return text

          for src_rel, dst_rel, bp, expected_units, role in specs:
              src = Path('/tmp/g9-sync') / src_rel
              text = package(src.read_text(encoding='utf-8'), dst_rel, role)
              body = re.search(r'<body\b[^>]*data-blueprint-ref="([^"]+)"', text)
              if not body or body.group(1) != bp:
                  raise SystemExit(f'{dst_rel}: blueprint mismatch: {body.group(1) if body else None} != {bp}')
              units = re.findall(r'data-g9-unit="([^"]+)"', text)
              if len(units) != expected_units:
                  raise SystemExit(f'{dst_rel}: expected {expected_units} units, found {len(units)}')
              if re.search(r'<(?:script|link)\b[^>]*(?:src|href)="https?://', text, re.I):
                  raise SystemExit(f'{dst_rel}: external runtime dependency present')
              out = repo / dst_rel
              out.write_text(text, encoding='utf-8')
              print(dst_rel, 'units=', len(units), 'bytes=', out.stat().st_size)

          manifest = json.loads((main/'products/physics/phy-kin-2d-motion.manifest.json').read_text())
          expected = manifest['selection']['core2']
          core2 = (repo/'standalone/core2-motion-in-a-plane-tablet.html').read_text(encoding='utf-8')
          actual = re.findall(r'<article\b[^>]*data-g9-unit="([^"]+)"[^>]*data-g9-kind="QUESTION"', core2)
          if actual != expected:
              raise SystemExit(f'Motion2D Core2 denominator/order mismatch: {len(actual)} vs {len(expected)}')
          print('Motion2D Core2 exact manifest tally:', len(actual), '/', len(expected))
          PY
      - name: Remove parallel practice corpus and update audit set
        run: |
          rm -f standalone/motion-1d-practice-companion-tablet.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/learner-quality.yml')
          text = p.read_text(encoding='utf-8')
          old = '''          cp standalone/motion-1d-practice-companion-tablet.html \\
            /tmp/g9-physics-tablet-standalone/core-related-motion-1d-practice-companion-tablet.html\n'''
          new = '''          cp standalone/core2-motion-in-a-plane-tablet.html /tmp/g9-physics-tablet-standalone/\n'''
          if old not in text:
              raise SystemExit('expected practice-companion audit block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit regenerated snapshots to this PR branch
        run: |
          set -eux
          rm -f .github/workflows/sync-physics-blueprint-v2.yml
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(physics): regenerate standalone pages from blueprint v2 [skip ci]'
          git push origin HEAD:feat/physics-tablet-standalone
