name: relay-admit-issue125-v31-exact
on:
  push:
    branches:
      - relay/admit-issue125-v31-1c168

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: relay/admit-issue125-v31-1c168
          fetch-depth: 0

      - name: Ensure base ref
        run: git fetch origin main:refs/remotes/origin/main

      - name: Stop after successful admission
        id: state
        run: |
          if grep -q 'lifecycle: IDLE' relay/STATE.yaml; then
            echo "needs_admission=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_admission=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact Engineering Relay V3.1
        if: steps.state.outputs.needs_admission == 'true'
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1c168695f237a8bef184a9e189be80fab87d1e78
          path: _common_v31
          fetch-depth: 1

      - name: Set up Python
        if: steps.state.outputs.needs_admission == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Relay dependencies
        if: steps.state.outputs.needs_admission == 'true'
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Build task admission
        if: steps.state.outputs.needs_admission == 'true'
        run: |
          cat > /tmp/issue125-admission.yaml <<'YAML'
          schema_version: relay-v3.1-task-admission
          roadmap:
            disposition: ADDED_EXECUTION_WP
            new_revision: RM-V31-ISS125-ACCELERATED-FRAMES-001
            basis:
              - "Direct Owner continuation at 2026-09-23T03:42:45Z: continue the next governed backlog work."
              - "Issue 125 is justified by existing ExamSIDE accelerating-observer / hanging-bob demand and remains a non-default Grade-9 extension."
              - "PR 199 already contains a candidate implementation; admission governs reconciliation, exact V3.1 validation, checkpointing, and delivery from current main."
              - "Engineering Relay protocol basis is pinned exactly to Common@1c168695f237a8bef184a9e189be80fab87d1e78."
            work_package:
              id: WP-ISS125-ACCELERATED-FRAMES
              title: Deliver demand-gated accelerated-frame and elevator extension explorer
              weight: 3
              state: ACTIVE
              depends_on:
                - WP-TA-105
          ep:
            schema_version: relay-v3.1-ep
            id: EP-ISS125-ACCELERATED-FRAMES-V31-001
            work_package: WP-ISS125-ACCELERATED-FRAMES
            outcome:
              statement: "Reconcile and deliver Issue 125 as a non-default, explicit-demand NLM extension with subject-owned elevator/pseudo-force/hanging-bob relations, one canonical accelerating-frame representation and learner explorer, without promoting R4 into ordinary Grade-9 completion scope."
            basis:
              predecessor_checkpoint: null
              material_base: c6e2e825e9bd3e67f1e37228d6ddca19081edb23
              protocol_basis: "reallaksh19/Common@1c168695f237a8bef184a9e189be80fab87d1e78:skills/engineering-pr-delivery-v3.1"
              semantic_dependencies:
                - path: Physics/library/phy-nlm-first-law.v1.json
                  reason: "Canonical NLM capability, relation, representation, question, and activity truth."
                - path: Physics/matrices/phy-nlm-first-law.rungs.json
                  reason: "Authority that R4 frame choice remains non-default."
                - path: Physics/gates/foundational-relations.v1.json
                  reason: "Subject-owned quantitative relation authority."
                - path: Shared/library/package.schema.json
                  reason: "Canonical library structure and representation contract."
                - path: docs/grade9/G9-2-FORCE-LAWS-AUTHORING-AUDIT.md
                  reason: "Grade-9 scope boundary: frame choice is QUESTION_DEMAND / DECLARED_EXTENSION."
            scope:
              write:
                - .github/workflows/v3-relay.yml
                - Physics/gates/foundational-relations.v1.json
                - Physics/library/phy-nlm-first-law.v1.json
                - public/physics/nlm/explorers/accelerated-frames/index.html
                - tests/test_issue125_accelerated_frames_explorer.py
                - tests/test_gates.py
                - tests/test_grade9_physics_learner_loop.py
                - tests/test_issue19_physics_content.py
                - tests/test_library.py
                - tools/data.js
                - public/data/data.js
                - docs/architecture-manifest.json
              read:
                - Physics/matrices/phy-nlm-first-law.rungs.json
                - Physics/library/**
                - Physics/gates/**
                - Shared/library/**
                - docs/grade9/**
                - tests/**
              protect:
                - Learners/**
                - Mathematics/**
                - Chemistry/**
                - agents/relay/**
                - Shared/publication_host/**
                - Shared/workbench/**
                - standalone/**
              prohibit:
                - "Do not promote R4 / CAP-NLM-FRAME-CHOICE into default Grade-9 completion or exit-readiness scope."
                - "Do not add circular-motion / centripetal-force dynamics under Issue 125."
                - "Do not create learner mastery state, readiness scores, or a second truth store."
                - "Do not let the HTML page become independent scientific authority for equations owned by Physics gates/library relations."
                - "Do not merge without an accepted fresh V3.1 checkpoint and explicit Owner MERGE authority."
            acceptance:
              - id: AC-125-SCOPE
                statement: "R4 remains non-default and the accelerated-frame activity is explicitly demand-gated."
                evidence_requirements:
                  - test: "tests/test_issue125_accelerated_frames_explorer.py::AcceleratedFrameExplorerContract::test_r4_remains_nondefault_explicit_demand_extension"
              - id: AC-125-GATE
                statement: "Elevator support, pseudo-force, and hanging-bob quantitative claims are gate-owned with explicit validity conditions."
                evidence_requirements:
                  - test: "tests/test_issue125_accelerated_frames_explorer.py::AcceleratedFrameExplorerContract::test_quantitative_relations_are_gate_owned"
              - id: AC-125-REPRESENTATION
                statement: "The frame-choice microtopic binds one canonical representation and one authored activity using declared Physics representation kinds."
                evidence_requirements:
                  - test: "tests/test_issue125_accelerated_frames_explorer.py::AcceleratedFrameExplorerContract::test_microtopic_and_resource_bind_one_canonical_representation"
              - id: AC-125-BEHAVIOR
                statement: "The explorer separates velocity from acceleration, preserves mg in free fall, applies pseudo-force only to accelerating-frame bookkeeping, and provides bounded hanging-bob transfer."
                evidence_requirements:
                  - test: "tests/test_issue125_accelerated_frames_explorer.py"
              - id: AC-125-BOUNDARY
                statement: "No circular-motion scope leak or default-route expansion is introduced."
                evidence_requirements:
                  - test: "tests/test_issue125_accelerated_frames_explorer.py::AcceleratedFrameExplorerContract::test_no_circular_motion_scope_leak"
              - id: AC-125-REPO
                statement: "Repository-wide guardrails pass and v31-relay validates against exact Common@1c168695f237a8bef184a9e189be80fab87d1e78."
                evidence_requirements:
                  - oracle: "GitHub Actions guardrails + v31-relay on the exact PR head."
            quality_policy:
              level: STANDARD
              independent_review: OPTIONAL
            admission_policy:
              qualification: NOT_REQUIRED
              question_policy: NONE
            next:
              first_action: "Treat current PR 199 bytes as candidate work, repin .github/workflows/v3-relay.yml to exact Common@1c168695f237a8bef184a9e189be80fab87d1e78, then re-run exact-head falsifiers before checkpoint."
              stop_conditions:
                - "Stop if exact V3.1 authorization denies a material write or checkpoint."
                - "Stop if any change promotes R4 into default Grade-9 scope."
                - "Stop if circular-motion dynamics enter the Issue 125 slice."
                - "Stop before merge unless a fresh accepted checkpoint exists and explicit Owner MERGE authority is present."
          lease:
            id: LEASE-ISS125-ACCELERATED-FRAMES-V31-001
            executor_id: chatgpt-sol-issue125-v31-20260923
            method: DETERMINISTIC
            qualification: null
            owner_basis: null
            branch: explorer/issue-125-accelerated-frames
            recovery_after_seconds: 3600
            recovery_policy: TAKEOVER_AFTER_EXPIRY
          delivery:
            required: true
            primary_vehicle:
              provider: GITHUB
              kind: PULL_REQUEST
              number: 199
          YAML

      - name: Admit Issue 125 transactionally
        if: steps.state.outputs.needs_admission == 'true'
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . admit-task             --tx-id TX-V31-ADMIT-ISS125-001             --event-id EVT-V31-ADMIT-ISS125-001             --actor chatgpt-sol-issue125-v31-20260923             --admission /tmp/issue125-admission.yaml             --base-ref origin/main

      - name: Validate exact V3.1 authority
        if: steps.state.outputs.needs_admission == 'true'
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate

      - name: Commit transaction after-images
        if: steps.state.outputs.needs_admission == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "relay: admit issue 125 under exact v3.1"
          git push origin HEAD:relay/admit-issue125-v31-1c168
