name: learner-platform-code-tests

# Informational code regression signal. Content findings never decide publication.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema test dependency
        run: pip install --quiet jsonschema
      - name: Source inventory role regression
        run: python3 -m unittest tests.test_source_inventory_roles
      - name: Package-owned Core2 selection regression
        run: python3 -m unittest tests.test_package_core2_selection
      - name: Build and validate #350 Polynomials source package
        run: python3 Mathematics/research/tools/build_polynomials_source_package.py
      - name: Generated Polynomials package has no drift
        run: git diff --exit-code -- Mathematics/library/polynomials.v1.json
      - name: Render complete Polynomials Core2 question bank
        run: python3 Mathematics/research/tools/build_polynomials_core2_html.py
      - name: Generated Polynomials Core2 full-bank browser render has no drift
        run: git diff --exit-code -- products/mathematics/polynomials.manifest.json public/mathematics/polynomials/core2.html public/mathematics/polynomials/core2.render.json
      - name: Upload Polynomials Core2 render
        uses: actions/upload-artifact@v4
        with:
          name: polynomials-core2-html
          path: |
            products/mathematics/polynomials.manifest.json
            public/mathematics/polynomials/core2.html
            public/mathematics/polynomials/core2.render.json
            public/css/question-bank.css
            public/css/tablet-12-7.css
      - name: Informational platform code tests
        continue-on-error: true
        run: >-
          python3 -m unittest
          tests.test_publication
          tests.test_render_core
          tests.test_renderer_inventory
          tests.test_quality_contract
