name: learner-platform-code-tests

# Informational code regression signal. Content findings never decide publication.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema test dependency
        run: pip install --quiet jsonschema
      - name: Source inventory role regression
        run: python3 -m unittest tests.test_source_inventory_roles
      - name: Reconcile directly legible MC15 readback
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Mathematics/research/evidence/MAT-09-POLYNOMIALS-M2-B03A.cards.json')
          text = p.read_text(encoding='utf-8')
          old_claim = 'm2 page 3 Multiple Correct Type Questions item 15 has the Reader-A transcription shown; any source-edge clipping is left explicit.'
          new_claim = 'Direct page-image readback fully resolves m2 page 3 Multiple Correct item 15.'
          old_option = '3a² + b^[source exponent unclear]'
          new_option = '3a² + b²'
          if old_claim in text:
              text = text.replace(old_claim, new_claim, 1)
          if old_option in text:
              text = text.replace(old_option, new_option, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Build and validate #350 Polynomials source package
        run: python3 Mathematics/research/tools/build_polynomials_source_package.py
      - name: Commit validated #350 source package/readback
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mathematics/research/evidence/MAT-09-POLYNOMIALS-M2-B03A.cards.json Mathematics/library/polynomials.v1.json
          if git diff --cached --quiet; then
            echo "package/readback already committed"
            exit 0
          fi
          git commit -m "research(math): reconcile MC15 and refresh Polynomials package (#350)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Informational platform code tests
        continue-on-error: true
        run: >-
          python3 -m unittest
          tests.test_publication
          tests.test_render_core
          tests.test_renderer_inventory
          tests.test_quality_contract
