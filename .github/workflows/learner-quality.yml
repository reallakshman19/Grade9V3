name: learner-platform-code-tests

# Informational code regression signal. Content findings never decide publication.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema test dependency
        run: pip install --quiet jsonschema
      - name: Source inventory role regression
        run: python3 -m unittest tests.test_source_inventory_roles
      - name: Build #350 combined source inventory candidate
        shell: python
        run: |
          import hashlib
          import json
          import re
          from pathlib import Path
          from Shared.tools import evidence_check

          evidence_dir = Path("Mathematics/research/evidence")
          source_files = (
              sorted(evidence_dir.glob("MAT-09-POLYNOMIALS-M1-B*.cards.json"))
              + sorted(evidence_dir.glob("MAT-09-POLYNOMIALS-M2-B*.cards.json"))
          )
          support_files = [evidence_dir / "MAT-09-POLYNOMIALS-M1-CHECKPOINT-KEYS.cards.json"]

          all_cards = {}
          docs = {}
          for path in source_files + support_files:
              doc = json.loads(path.read_text(encoding="utf-8"))
              docs[path] = doc
              for card in doc.get("cards", []):
                  cid = card["card_id"]
                  if cid in all_cards:
                      raise SystemExit(f"duplicate evidence card id: {cid}")
                  all_cards[cid] = card

          def slug(value):
              text = re.sub(r"[^A-Za-z0-9]+", "-", str(value)).strip("-").upper()
              return text or "ITEM"

          def item_format(card):
              if card["kind"] == "WORKED_EXAMPLE":
                  return "OTHER"
              section = (card.get("locator") or {}).get("section", "").lower()
              q = card.get("question") or {}
              if "fill" in section:
                  return "FILL_BLANK"
              if "true" in section and "false" in section:
                  return "TRUE_FALSE"
              if "multiple correct" in section:
                  return "MULTIPLE_CORRECT"
              if "single correct" in section:
                  return "SINGLE_CORRECT"
              if "match" in section:
                  return "MATCH"
              if "assertion" in section:
                  return "ASSERTION_REASON"
              if "comprehension" in section:
                  return "COMPREHENSION"
              if "numerical" in section:
                  return "NUMERIC"
              if "hots" in section:
                  return "HOTS"
              if "long answer" in section:
                  return "LONG"
              if "very short" in section or "short answer" in section or "check point" in section:
                  return "SHORT"
              if "archive corner" in section or q.get("options"):
                  return "SINGLE_CORRECT"
              return "OTHER"

          items = []
          seen_ids = set()
          for path in source_files:
              for card in docs[path].get("cards", []):
                  if card.get("kind") not in {"QUESTION", "WORKED_EXAMPLE"}:
                      continue
                  loc = card["locator"]
                  acq = card["acquisition_ref"]
                  source_tag = "M1" if acq == "ACQ-0B3450C353FF29985152" else "M2"
                  section = loc["section"]
                  qn = str(loc["question_number"])
                  item_id = f"{source_tag}-P{int(loc['page']):02d}-{slug(section)}-{slug(qn)}"
                  if item_id in seen_ids:
                      raise SystemExit(f"duplicate derived item id: {item_id}")
                  seen_ids.add(item_id)

                  label = section if qn in section else f"{section} {qn}"
                  key = {"state": "ABSENT"}
                  if card["kind"] == "QUESTION":
                      q = card.get("question") or {}
                      key_ref = q.get("answer_key_card_ref")
                      if not key_ref and source_tag == "M1" and section.startswith("Check Point "):
                          cp = "CP1" if section.endswith("1") else "CP2"
                          candidate = f"EV-MAT-09-POL-M1-{cp}-{int(qn):02d}-K"
                          if candidate in all_cards:
                              key_ref = candidate
                      if key_ref:
                          key_card = all_cards.get(key_ref)
                          if not key_card or key_card.get("kind") != "ANSWER_KEY":
                              raise SystemExit(f"invalid answer-key reference {key_ref} for {card['card_id']}")
                          key = {"state": "PRESENT", "card": key_ref}

                  items.append({
                      "item_id": item_id,
                      "locator": {
                          "acquisition_ref": acq,
                          "page": int(loc["page"]),
                          "label": label,
                      },
                      "format": item_format(card),
                      "source_role": card["kind"],
                      "question_card": card["card_id"],
                      "key": key,
                  })

          counts = {
              "items": len(items),
              "key_present": sum(1 for item in items if item["key"]["state"] == "PRESENT"),
              "key_absent": sum(1 for item in items if item["key"]["state"] == "ABSENT"),
              "key_ambiguous": sum(1 for item in items if item["key"]["state"] == "AMBIGUOUS"),
          }
          role_counts = {
              role: sum(1 for item in items if item["source_role"] == role)
              for role in ("QUESTION", "WORKED_EXAMPLE")
          }
          expected_counts = {"items": 212, "key_present": 167, "key_absent": 45, "key_ambiguous": 0}
          expected_roles = {"QUESTION": 172, "WORKED_EXAMPLE": 40}
          if counts != expected_counts:
              raise SystemExit(f"unexpected inventory counts: {counts} != {expected_counts}")
          if role_counts != expected_roles:
              raise SystemExit(f"unexpected source-role counts: {role_counts} != {expected_roles}")

          inventory = {
              "schema": "source-inventory/v1",
              "inventory_id": "INV-MAT-09-POLYNOMIALS-M1P33-50-M2P1-11",
              "subject": "Mathematics",
              "members": [
                  {
                      "acquisition_ref": "ACQ-0B3450C353FF29985152",
                      "sha256": "0b3450c353ff299851528edd4469bc01413920135b0fd041fe89286a00086afa",
                      "pages": "33-50",
                  },
                  {
                      "acquisition_ref": "ACQ-1DD05CE5AA04B532EC68",
                      "sha256": "1dd05ce5aa04b532ec68c4054f55af1677ecb210be00b8f3085d6f29215a230c",
                      "pages": "1-11",
                  },
              ],
              "declared_scope": "PAGE_RANGE",
              "completeness_unit": "every numbered source item in m1 PDF pages 33-50 and m2 PDF pages 1-11",
              "items": items,
              "counts": counts,
              "digest": evidence_check.inventory_digest(items),
              "supersedes": None,
          }

          out = Path("Mathematics/research/inventories") / f"{inventory['inventory_id']}.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(inventory, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          findings = evidence_check.inventory_findings("Mathematics", all_cards)
          if findings:
              raise SystemExit("inventory_findings failed:\n" + json.dumps(findings, indent=2))

          print(json.dumps({
              "path": str(out),
              "counts": counts,
              "role_counts": role_counts,
              "digest": inventory["digest"],
          }, indent=2))
      - name: Upload #350 source inventory candidate
        uses: actions/upload-artifact@v4
        with:
          name: issue-350-source-inventory
          path: Mathematics/research/inventories/INV-MAT-09-POLYNOMIALS-M1P33-50-M2P1-11.json
          if-no-files-found: error
      - name: Informational platform code tests
        continue-on-error: true
        run: >-
          python3 -m unittest
          tests.test_publication
          tests.test_render_core
          tests.test_renderer_inventory
          tests.test_quality_contract
