name: relay-repin-issue125-v31-exact
on:
  push:
    branches:
      - relay/repin-issue125-v31-1c168

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed product branch
        uses: actions/checkout@v4
        with:
          ref: explorer/issue-125-accelerated-frames
          fetch-depth: 0

      - name: Ensure base ref
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout exact Engineering Relay V3.1
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1c168695f237a8bef184a9e189be80fab87d1e78
          path: _common_v31
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Relay dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Authorize workflow repin
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py MATERIAL_WRITE .             --path .github/workflows/v3-relay.yml             --base-ref origin/main             --expected-custody-epoch 1

      - name: Repin V3.1 validator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/v3-relay.yml")
          text=p.read_text()
          old="edb845f06f32c87453dee6fbfcc2f84937017279"
          new="1c168695f237a8bef184a9e189be80fab87d1e78"
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("expected old protocol pin not found")
          p.write_text(text.replace(old,new))
          PY

      - name: Validate exact V3.1 foundation
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate

      - name: Commit authorized repin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v3-relay.yml
          if git diff --cached --quiet; then
            echo "Already pinned"
            exit 0
          fi
          git commit -m "ci: pin relay validation to exact v3.1 basis"
          git push origin HEAD:explorer/issue-125-accelerated-frames
