name: relay-refresh-issue211-manifest
on:
  push:
    branches:
      - relay/refresh-issue211-manifest
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readiness/issue-211-core-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - run: python Shared/tools/build_manifest.py
      - run: python Shared/tools/build_manifest.py --check
      - name: Commit generated manifest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json
          git commit -m "chore: refresh architecture manifest for issue 211"
          git push origin HEAD:readiness/issue-211-core-contracts
