name: relay-authorize-issue201-repin-ep002
on:
  push:
    branches:
      - relay/authorize-issue201-repin-ep002
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: question-bank/pass1-provenance
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 1c168695f237a8bef184a9e189be80fab87d1e78
          path: _common_v31
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Authorize exact workflow repin
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py MATERIAL_WRITE . \
            --path .github/workflows/v3-relay.yml \
            --base-ref origin/main \
            --expected-custody-epoch 1
      - name: Validate current authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate
