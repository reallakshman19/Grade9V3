name: reconcile-learner-tests-411

on:
  push:
    branches:
      - audit/learner-resource-reconciliation-411
    paths:
      - "tools/_reconcile_learner_tests_411.py"
      - ".github/workflows/_reconcile-learner-tests-411.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/learner-resource-reconciliation-411
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconcile stale TEST learner contracts
        run: python3 tools/_reconcile_learner_tests_411.py
      - name: Validate edited test syntax
        run: |
          python3 -m py_compile tests/test_test_area.py
          node --check tests/test_area_browser.mjs
      - name: Remove one-shot reconciliation machinery
        run: |
          rm tools/_reconcile_learner_tests_411.py
          rm .github/workflows/_reconcile-learner-tests-411.yml
      - name: Commit reconciled tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(#411): reconcile internal TEST audience contract"
          git push origin HEAD:audit/learner-resource-reconciliation-411
