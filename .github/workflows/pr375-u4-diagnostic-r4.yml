name: pr375-u4-diagnostic-r4

on:
  push:
    branches:
      - feat/physics-tablet-standalone
    paths:
      - .github/workflows/pr375-u4-diagnostic-r4.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/physics-tablet-standalone
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct current U4 candidate in runner only
        shell: bash
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          for workflow, step_name in [
              ('.github/workflows/pr375-u4-remediation.yml', 'Apply bounded U4 accessibility remediation'),
              ('.github/workflows/pr375-u4-remediation-r3.yml', 'Apply residual phone reflow and dynamic-a11y fixes'),
          ]:
              data = yaml.safe_load(Path(workflow).read_text(encoding='utf-8'))
              step = next(s for s in data['jobs']['remediate-and-verify']['steps'] if s.get('name') == step_name)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], check=True)
          PY

      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Diagnose 390px overflow precisely
        shell: bash
        run: |
          python3 -m http.server 8106 --directory . >/tmp/u4diag-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8106/standalone/practice/index.html >/dev/null && break; sleep .2; done
          cat >.tmp-u4diag.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:844}});
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:8106/standalone/practice/physics-motion-in-a-plane-interactive-suite.html', {waitUntil:'domcontentloaded'});
          await page.waitForTimeout(500);
          const report = await page.evaluate(() => {
            const vw = innerWidth;
            const describe = el => {
              const r = el.getBoundingClientRect();
              const cs = getComputedStyle(el);
              const text = (el.textContent || '').replace(/\s+/g,' ').trim().slice(0,100);
              return {
                tag: el.tagName,
                id: el.id,
                cls: typeof el.className === 'string' ? el.className.slice(0,180) : '',
                text,
                left: +r.left.toFixed(1), right: +r.right.toFixed(1), width: +r.width.toFixed(1),
                scrollWidth: el.scrollWidth, clientWidth: el.clientWidth,
                display: cs.display, position: cs.position,
                widthCss: cs.width, minWidth: cs.minWidth, maxWidth: cs.maxWidth,
                whiteSpace: cs.whiteSpace, overflowX: cs.overflowX,
                gridTemplateColumns: cs.gridTemplateColumns,
                flex: cs.flex,
              };
            };
            const all = [...document.querySelectorAll('body *')];
            const outside = all.filter(el => {
              const r = el.getBoundingClientRect();
              return r.right > vw + 1 || r.left < -1;
            }).map(describe).sort((a,b) => (b.right-vw)-(a.right-vw));
            const internal = all.filter(el => el.scrollWidth > el.clientWidth + 1)
              .map(describe).sort((a,b) => (b.scrollWidth-b.clientWidth)-(a.scrollWidth-a.clientWidth));
            return {
              viewport: vw,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body.scrollWidth,
              outside: outside.slice(0,40),
              internal: internal.slice(0,40),
            };
          });
          console.log(JSON.stringify(report, null, 2));
          await context.close();
          await browser.close();
          JS
          node .tmp-u4diag.mjs
          rm -f .tmp-u4diag.mjs
