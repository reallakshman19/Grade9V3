<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Redox states and agent roles">
<title>Redox states and agent roles</title><desc>A staged zinc and copper redox ledger separating oxidation-state change, electron transfer and agent naming.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="REDOX-OA-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Track oxidation states</text><rect x="24" y="46" width="392" height="44" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="220" y="74" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Zn: 0 → +2     Cu: +2 → 0</text></g>
<g data-g9-stage-id="REDOX-OA-S2" id="stage-2"><text x="24" y="124" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Show the electron transfer</text><text x="220" y="154" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Zn → Zn²⁺ + 2e⁻</text><text x="220" y="182" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Cu²⁺ + 2e⁻ → Cu</text></g>
<g data-g9-stage-id="REDOX-OA-S3" id="stage-3"><text x="24" y="222" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Name agents from their change</text><rect x="24" y="238" width="188" height="42" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="118" y="264" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Zn: reducing agent</text><rect x="228" y="238" width="188" height="42" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="322" y="264" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Cu²⁺: oxidising agent</text></g></svg>
