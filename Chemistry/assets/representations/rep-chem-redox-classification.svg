<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Redox classification">
<title>Redox classification</title><desc>A staged visual requiring a before-and-after oxidation-state map and showing disproportionation as a branch from one initial state.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="REDOX-CL-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Map states before naming the type</text><rect x="24" y="46" width="392" height="42" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="220" y="73" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">reaction label alone is not redox evidence</text></g>
<g data-g9-stage-id="REDOX-CL-S2" id="stage-2"><text x="24" y="124" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Redox needs both directions</text><text x="145" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">ON ↑  oxidation</text><text x="300" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">ON ↓  reduction</text><line x1="205" y1="153" x2="240" y2="153" stroke="#334155" stroke-width="2"/></g>
<g data-g9-stage-id="REDOX-CL-S3" id="stage-3"><text x="24" y="208" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Disproportionation branches</text><circle cx="220" cy="238" r="8" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="220" y="244" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">0</text><line x1="212" y1="242" x2="145" y2="272" stroke="#334155" stroke-width="2"/><line x1="228" y1="242" x2="295" y2="272" stroke="#334155" stroke-width="2"/><text x="132" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">−1</text><text x="308" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">+1</text></g></svg>
