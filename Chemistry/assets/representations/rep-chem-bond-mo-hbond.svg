<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="MO occupancy and hydrogen bonding">
<title>MO occupancy and hydrogen bonding</title><desc>A staged visual using O2 occupancy to separate bond order from magnetism, then showing hydrogen bonding as a separate donor-acceptor interaction.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="BOND-MH-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  O₂: write occupancy first</text><rect x="24" y="46" width="392" height="48" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="220" y="76" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">π*2p:  ↑   ↑   (two unpaired e⁻)</text></g>
<g data-g9-stage-id="BOND-MH-S2" id="stage-2"><text x="24" y="126" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Two separate readouts</text><rect x="24" y="140" width="188" height="44" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="118" y="168" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">BO = 2</text><rect x="228" y="140" width="188" height="44" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="322" y="168" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">paramagnetic</text></g>
<g data-g9-stage-id="BOND-MH-S3" id="stage-3"><text x="24" y="218" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Different intermolecular model</text><text x="220" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">donor — H ··· acceptor</text><text x="220" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">require donor and lone-pair acceptor</text></g></svg>
