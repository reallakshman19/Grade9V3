<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Half-reaction balance and n-factor">
<title>Half-reaction balance and n-factor</title><desc>A staged acidic permanganate and iron(II) construction from half-reactions through electron cancellation to atom and charge ledgers.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="REDOX-BN-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Balance each half</text><text x="220" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O</text><text x="220" y="88" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Fe²⁺ → Fe³⁺ + e⁻</text></g>
<g data-g9-stage-id="REDOX-BN-S2" id="stage-2"><text x="24" y="126" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Scale Fe half ×5; cancel 5e⁻</text><rect x="24" y="140" width="392" height="60" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="220" y="166" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">MnO₄⁻ + 8H⁺ + 5Fe²⁺ →</text><text x="220" y="191" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Mn²⁺ + 4H₂O + 5Fe³⁺</text></g>
<g data-g9-stage-id="REDOX-BN-S3" id="stage-3"><text x="24" y="232" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Close atom and charge ledgers</text><rect x="24" y="248" width="188" height="38" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="118" y="273" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">atoms: balanced</text><rect x="228" y="248" width="188" height="38" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="322" y="273" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">charge: +17 = +17</text></g></svg>
