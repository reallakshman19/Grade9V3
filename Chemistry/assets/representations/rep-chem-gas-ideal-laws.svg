<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Gas-law constraints">
<title>Gas-law constraints</title><desc>A staged visual naming state variables, applying the ideal-gas relation and separating pressure bookkeeping from transport rate.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="GAS-IL-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Name state variables</text><rect x="24" y="46" width="392" height="46" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="220" y="75" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">P  •  V  •  n  •  T</text></g>
<g data-g9-stage-id="GAS-IL-S2" id="stage-2"><text x="24" y="126" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  State the constraints</text><rect x="24" y="140" width="392" height="48" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="220" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">PV = nRT   |   fixed n,T ⇒ P ∝ 1/V</text></g>
<g data-g9-stage-id="GAS-IL-S3" id="stage-3"><text x="24" y="222" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Keep observables separate</text><rect x="24" y="238" width="185" height="40" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="116" y="264" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Dalton: pressure</text><rect x="231" y="238" width="185" height="40" rx="8" fill="#fce7f3" stroke="#64748b" stroke-width="2"/><text x="323" y="264" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Graham: rate</text></g></svg>
