<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Real-gas deviation and critical point">
<title>Real-gas deviation and critical point</title><desc>A staged visual using compressibility factor as a reference, adding real-gas effects and marking the critical endpoint.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="GAS-RC-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Ideal reference</text><line x1="54" y1="92" x2="390" y2="92" stroke="#334155" stroke-width="2"/><text x="220" y="76" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Z = 1</text><text x="54" y="112" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">pressure →</text></g>
<g data-g9-stage-id="GAS-RC-S2" id="stage-2"><text x="24" y="142" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  State-dependent deviation</text><path d="M60 201 C135 186 195 168 260 178 C325 188 352 211 398 216" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="132" y="181" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">attraction can lower Z</text><text x="325" y="208" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">finite size can raise Z</text></g>
<g data-g9-stage-id="GAS-RC-S3" id="stage-3"><text x="24" y="240" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Critical endpoint</text><line x1="70" y1="270" x2="250" y2="270" stroke="#334155" stroke-width="2"/><circle cx="270" cy="270" r="6" fill="#fecaca" stroke="#334155" stroke-width="2"/><text x="285" y="276" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">critical point</text><text x="70" y="294" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">coexistence curve ends at Tc</text></g></svg>
