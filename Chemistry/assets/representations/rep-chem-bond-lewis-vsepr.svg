<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="NH3 Lewis to VSEPR">
<title>NH3 Lewis to VSEPR</title><desc>A staged species-level construction from electron inventory through formal charge to electron-domain geometry and molecular shape.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="BOND-LV-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  NH₃ electron inventory</text><rect x="24" y="46" width="392" height="44" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="220" y="74" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">N: 5 e⁻ + 3×H: 3 e⁻ = 8 e⁻</text></g>
<g data-g9-stage-id="BOND-LV-S2" id="stage-2"><text x="24" y="122" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Lewis bookkeeping</text><text x="220" y="148" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">··</text><text x="220" y="174" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">H — N — H</text><text x="220" y="198" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">|</text><text x="220" y="220" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">H</text><text x="24" y="218" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">FC(N)=5−2−6/2=0</text></g>
<g data-g9-stage-id="BOND-LV-S3" id="stage-3"><text x="24" y="250" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Domains versus shape</text><rect x="24" y="262" width="188" height="28" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="118" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">4 domains: tetrahedral</text><rect x="228" y="262" width="188" height="28" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="322" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">3 atoms: pyramidal</text></g></svg>
