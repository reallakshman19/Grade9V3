<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Mass to moles to entities">
<title>Mass to moles to entities</title><desc>A staged bridge from sample mass to amount of substance to explicitly named entity count.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="MOLE-FM-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Mass bridge</text><rect x="24" y="46" width="392" height="48" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="220" y="76" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">18.0 g H₂O ÷ 18.0 g mol⁻¹ = 1.00 mol</text></g>
<g data-g9-stage-id="MOLE-FM-S2" id="stage-2"><text x="24" y="126" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Entity bridge</text><rect x="24" y="140" width="392" height="48" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="220" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">1.00 mol H₂O × NA = NA molecules</text></g>
<g data-g9-stage-id="MOLE-FM-S3" id="stage-3"><text x="24" y="222" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Name the counted entity</text><text x="220" y="254" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">molecules ≠ atoms ≠ ions ≠ formula units</text><text x="220" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">the entity label is part of the answer</text></g></svg>
