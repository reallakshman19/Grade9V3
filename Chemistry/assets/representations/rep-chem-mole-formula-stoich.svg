<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Formula ratio and limiting reagent">
<title>Formula ratio and limiting reagent</title><desc>A staged numerical construction from percentage masses to mole ratio, then from balanced coefficients to limiting extent and leftovers.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="MOLE-FS-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Mass data → mole ratio</text><text x="220" y="60" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">40.0%C/12 : 6.7%H/1 : 53.3%O/16</text><rect x="24" y="72" width="392" height="38" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="220" y="97" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">3.33 : 6.65 : 3.33 ≈ 1 : 2 : 1 → CH₂O</text></g>
<g data-g9-stage-id="MOLE-FS-S2" id="stage-2"><text x="24" y="142" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Reaction inventory</text><text x="220" y="168" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2H₂ + O₂ → 2H₂O</text><rect x="24" y="178" width="392" height="38" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="220" y="203" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">H₂: 3.0/2=1.5   O₂: 2.0/1=2.0</text></g>
<g data-g9-stage-id="MOLE-FS-S3" id="stage-3"><text x="24" y="246" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Smaller extent sets the result</text><text x="220" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">H₂ limiting; H₂O 3.0 mol; O₂ left 0.5 mol</text><text x="220" y="296" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">coefficients are reacting, not starting, ratios</text></g></svg>
