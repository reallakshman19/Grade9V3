<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Concentration denominators">
<title>Concentration denominators</title><desc>A staged denominator-first comparison of molarity, molality and mole fraction for a closed sample.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="MOLE-CO-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Write each denominator first</text><text x="220" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">c = nsolute / Vsolution</text><text x="220" y="87" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">b = nsolute / msolvent</text><text x="220" y="112" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">xi = ni / Σnj</text></g>
<g data-g9-stage-id="MOLE-CO-S2" id="stage-2"><text x="24" y="148" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Closed sample warms</text><rect x="24" y="162" width="392" height="44" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><text x="220" y="189" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">V can change; n and solvent mass stay fixed</text></g>
<g data-g9-stage-id="MOLE-CO-S3" id="stage-3"><text x="24" y="236" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Audit the denominator</text><rect x="24" y="252" width="118" height="34" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="83" y="275" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">c can change</text><rect x="160" y="252" width="118" height="34" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="219" y="275" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">b unchanged</text><rect x="296" y="252" width="120" height="34" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="356" y="275" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">xi unchanged</text></g></svg>
