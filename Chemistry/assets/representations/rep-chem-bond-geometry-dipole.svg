<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="PCl5 geometry and dipole">
<title>PCl5 geometry and dipole</title><desc>A staged isolated-molecule PCl5 model showing axial and equatorial directions, vector cancellation and the phase-model boundary.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="BOND-GD-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">1  Isolated PCl₅ molecule</text><circle cx="220" cy="122" r="12" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="220" y="128" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">P</text><circle cx="220" cy="60" r="9" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><circle cx="220" cy="184" r="9" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><circle cx="140" cy="122" r="9" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><circle cx="300" cy="122" r="9" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><circle cx="260" cy="88" r="9" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><line x1="220" y1="110" x2="220" y2="69" stroke="#334155" stroke-width="2"/><line x1="220" y1="134" x2="220" y2="175" stroke="#334155" stroke-width="2"/><line x1="208" y1="122" x2="149" y2="122" stroke="#334155" stroke-width="2"/><line x1="232" y1="122" x2="291" y2="122" stroke="#334155" stroke-width="2"/><line x1="230" y1="112" x2="253" y2="95" stroke="#334155" stroke-width="2"/><text x="78" y="206" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">axial–equatorial: 90°</text><text x="78" y="228" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">equatorial–equatorial: 120°</text></g>
<g data-g9-stage-id="BOND-GD-S2" id="stage-2"><text x="24" y="252" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">2  Vector symmetry cancels</text><text x="290" y="252" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">μnet = Σ μ⃗bond = 0</text></g>
<g data-g9-stage-id="BOND-GD-S3" id="stage-3"><text x="24" y="280" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">3  Gas/isolated model; not solid PCl₅</text><text x="24" y="298" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">sp3d is shorthand, not orbital proof</text></g></svg>
