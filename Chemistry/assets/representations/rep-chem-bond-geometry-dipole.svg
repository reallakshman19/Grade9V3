<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-label="PCl5 geometry, model shorthand and molecular dipoles particle geometry bridge">
  <title>PCl5 geometry, model shorthand and molecular dipoles particle geometry bridge</title>
  <desc>Static particle-level schematic of PCl5 with one phosphorus centre, three equatorial chlorine directions and two axial chlorine directions. This is geometry evidence only and is not proof of literal d-orbital hybridisation or a reaction mechanism.</desc>
  <rect x="1" y="1" width="558" height="328" rx="18" fill="white" stroke="#94a3b8" stroke-width="2"/>
  <text x="28" y="38" font-family="sans-serif" font-size="17" font-weight="700" fill="#172c42">PCl5 geometry, model shorthand and molecular dipoles</text>
  <text x="28" y="62" font-family="sans-serif" font-size="13" fill="#475569">Particle/molecular schematic · 3 equatorial + 2 axial directions</text>
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="280" y1="176" x2="280" y2="88"/>
    <line x1="280" y1="176" x2="280" y2="264"/>
    <line x1="280" y1="176" x2="168" y2="176"/>
    <line x1="280" y1="176" x2="370" y2="112"/>
    <line x1="280" y1="176" x2="370" y2="240"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-weight="700">
    <circle cx="280" cy="176" r="25" fill="#e9f2f8" stroke="#135b89" stroke-width="2"/><text x="280" y="182" font-size="16" fill="#172c42">P</text>
    <circle cx="280" cy="88" r="22" fill="#f8fafc" stroke="#135b89" stroke-width="2"/><text x="280" y="94" font-size="14" fill="#172c42">Cl</text>
    <circle cx="280" cy="264" r="22" fill="#f8fafc" stroke="#135b89" stroke-width="2"/><text x="280" y="270" font-size="14" fill="#172c42">Cl</text>
    <circle cx="168" cy="176" r="22" fill="#f8fafc" stroke="#135b89" stroke-width="2"/><text x="168" y="182" font-size="14" fill="#172c42">Cl</text>
    <circle cx="370" cy="112" r="22" fill="#f8fafc" stroke="#135b89" stroke-width="2"/><text x="370" y="118" font-size="14" fill="#172c42">Cl</text>
    <circle cx="370" cy="240" r="22" fill="#f8fafc" stroke="#135b89" stroke-width="2"/><text x="370" y="246" font-size="14" fill="#172c42">Cl</text>
  </g>
  <text x="28" y="312" font-family="sans-serif" font-size="12.5" fill="#475569">Model limit: static geometry shorthand; not an orbital-composition measurement or mechanism.</text>
</svg>
