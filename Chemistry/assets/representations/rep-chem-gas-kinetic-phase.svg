<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Particle distributions and boiling">
<title>Particle distributions and boiling</title><desc>A staged visual separating molecular speed distributions from the pressure condition for bulk boiling.</desc>
<rect x="1" y="1" width="438" height="298" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="GAS-KP-S1" id="stage-1"><text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">One temperature, many speeds</text><rect x="24" y="45" width="392" height="62" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><circle cx="70" cy="76" r="7" fill="#bae6fd" stroke="#334155" stroke-width="2"/><circle cx="145" cy="68" r="7" fill="#bae6fd" stroke="#334155" stroke-width="2"/><circle cx="220" cy="86" r="7" fill="#bae6fd" stroke="#334155" stroke-width="2"/><circle cx="300" cy="65" r="7" fill="#bae6fd" stroke="#334155" stroke-width="2"/><circle cx="370" cy="84" r="7" fill="#bae6fd" stroke="#334155" stroke-width="2"/><line x1="78" y1="76" x2="104" y2="76" stroke="#334155" stroke-width="2"/><line x1="153" y1="68" x2="190" y2="68" stroke="#334155" stroke-width="2"/><line x1="228" y1="86" x2="247" y2="86" stroke="#334155" stroke-width="2"/><line x1="308" y1="65" x2="356" y2="65" stroke="#334155" stroke-width="2"/><line x1="378" y1="84" x2="400" y2="84" stroke="#334155" stroke-width="2"/><text x="220" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">same sample, different molecular speeds</text></g>
<g data-g9-stage-id="GAS-KP-S2" id="stage-2"><text x="24" y="132" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Higher T shifts a distribution</text><line x1="48" y1="202" x2="390" y2="202" stroke="#334155" stroke-width="2"/><line x1="48" y1="202" x2="48" y2="150" stroke="#334155" stroke-width="2"/><path d="M55 199 C105 192 120 157 165 163 C215 169 230 193 270 199" fill="none" stroke="#0284c7" stroke-width="3"/><path d="M70 199 C145 196 195 168 255 170 C320 172 350 192 390 199" fill="none" stroke="#c2410c" stroke-width="3"/><text x="132" y="155" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">T₁</text><text x="278" y="164" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">T₂ > T₁</text></g>
<g data-g9-stage-id="GAS-KP-S3" id="stage-3"><text x="24" y="232" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Bulk boiling: a pressure condition</text><rect x="24" y="246" width="392" height="36" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="220" y="270" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#0f172a">Pvap(Tb) = Pext; evaporation is distinct</text></g></svg>
