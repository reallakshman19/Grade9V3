<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
<title id="title">Contact interface: normal, friction and resultant table reaction</title>
<desc id="desc">A block on a rough horizontal table. Stages select the body, add the normal interaction, add friction, then combine table contact components into one resultant reaction.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
<rect width="440" height="300" fill="white"/>
<g data-g9-stage-id="interface-body"><rect x="145" y="105" width="150" height="85" rx="10" fill="#eef2ff" stroke="#253858" stroke-width="3"/><text x="220" y="145" text-anchor="middle" font-size="20" font-family="system-ui">chosen body Q</text><line x1="55" y1="205" x2="385" y2="205" stroke="#475569" stroke-width="5"/><text x="58" y="232" font-size="16" font-family="system-ui">rough table · interface</text></g>
<g data-g9-stage-id="interface-normal" color="#166534"><line x1="220" y1="205" x2="220" y2="95" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/><text x="234" y="112" font-size="18" font-family="system-ui">N</text><line x1="330" y1="205" x2="330" y2="252" stroke="currentColor" stroke-width="4" marker-end="url(#arrow)"/><text x="342" y="250" font-size="15" font-family="system-ui">partner force on table</text></g>
<g data-g9-stage-id="interface-friction" color="#b45309"><line x1="145" y1="175" x2="75" y2="175" stroke="currentColor" stroke-width="5" marker-end="url(#arrow)"/><text x="84" y="162" font-size="18" font-family="system-ui">f</text><text x="302" y="178" font-size="15" font-family="system-ui">table acts on Q in two components</text></g>
<g data-g9-stage-id="interface-resultant" color="#7c3aed"><line x1="220" y1="190" x2="135" y2="83" stroke="currentColor" stroke-width="6" marker-end="url(#arrow)"/><text x="116" y="77" font-size="18" font-family="system-ui">Rtable</text><path d="M220 160 A30 30 0 0 0 195 172" fill="none" stroke="#7c3aed" stroke-width="2"/><text x="294" y="270" font-size="16" font-family="system-ui">Rtable = vector sum of N and f</text></g>
</svg>