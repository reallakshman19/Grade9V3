<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
<title id="title">Same thrust, different actual contact area</title>
<desc id="desc">The same rectangular block is shown on a broad face and a narrow face. Stages keep its weight and normal thrust fixed, identify the actual contact areas, then compare average pressure.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs><rect width="440" height="300" fill="white"/>
<g data-g9-stage-id="area-same-block"><line x1="35" y1="220" x2="405" y2="220" stroke="#64748b" stroke-width="4"/><rect x="68" y="145" width="135" height="70" rx="8" fill="#e0f2fe" stroke="#075985" stroke-width="3"/><rect x="285" y="85" width="70" height="130" rx="8" fill="#e0f2fe" stroke="#075985" stroke-width="3"/><text x="135" y="138" text-anchor="middle" font-size="16" font-family="system-ui">same block</text><text x="320" y="78" text-anchor="middle" font-size="16" font-family="system-ui">same block</text></g>
<g data-g9-stage-id="area-same-thrust" color="#166534"><line x1="135" y1="160" x2="135" y2="105" stroke="currentColor" stroke-width="5" marker-end="url(#a)"/><line x1="320" y1="120" x2="320" y2="65" stroke="currentColor" stroke-width="5" marker-end="url(#a)"/><text x="148" y="112" font-size="17" font-family="system-ui">N</text><text x="333" y="72" font-size="17" font-family="system-ui">N</text><text x="110" y="256" font-size="16" font-family="system-ui">horizontal equilibrium case: same N</text></g>
<g data-g9-stage-id="area-contact"><line x1="68" y1="216" x2="203" y2="216" stroke="#b45309" stroke-width="8"/><line x1="285" y1="216" x2="355" y2="216" stroke="#b45309" stroke-width="8"/><text x="93" y="198" font-size="17" font-family="system-ui">A_large</text><text x="286" y="198" font-size="17" font-family="system-ui">A_small</text></g>
<g data-g9-stage-id="area-pressure"><rect x="45" y="20" width="350" height="55" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="64" y="44" font-size="18" font-family="system-ui">p_avg = N / A_contact</text><text x="64" y="67" font-size="16" font-family="system-ui">same N + smaller actual contact area → larger average pressure</text></g>
</svg>