<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
<title id="title">Uniform pressure on a tilted planar surface</title>
<desc id="desc">A tilted table face of fixed actual area is shown with normal pressure-force arrows. Stages identify scalar pressure, surface-normal directions, the resultant pA, and reject using horizontal projected area for the force magnitude.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs><rect width="440" height="300" fill="white"/>
<g data-g9-stage-id="orient-face"><line x1="90" y1="220" x2="340" y2="105" stroke="#334155" stroke-width="12" stroke-linecap="round"/><text x="98" y="246" font-size="17" font-family="system-ui">actual face area A = 2 m²</text><path d="M96 220 A45 45 0 0 1 136 197" fill="none" stroke="#64748b" stroke-width="2"/><text x="122" y="222" font-size="16" font-family="system-ui">45°</text></g>
<g data-g9-stage-id="orient-local" color="#0284c7"><line x1="155" y1="190" x2="128" y2="132" stroke="currentColor" stroke-width="4" marker-end="url(#a)"/><line x1="220" y1="160" x2="193" y2="102" stroke="currentColor" stroke-width="4" marker-end="url(#a)"/><line x1="285" y1="130" x2="258" y2="72" stroke="currentColor" stroke-width="4" marker-end="url(#a)"/><text x="300" y="68" font-size="16" font-family="system-ui">each dF is normal to dA</text></g>
<g data-g9-stage-id="orient-resultant" color="#7c3aed"><line x1="220" y1="160" x2="165" y2="43" stroke="currentColor" stroke-width="7" marker-end="url(#a)"/><text x="178" y="42" font-size="19" font-family="system-ui">F = pA</text><text x="285" y="256" font-size="16" font-family="system-ui">tilt rotates F; it does not shrink A</text></g>
<g data-g9-stage-id="orient-trap"><line x1="90" y1="266" x2="340" y2="266" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6"/><text x="92" y="289" font-size="16" font-family="system-ui" fill="#b91c1c">✗ do not replace actual area by A cos45° here</text></g>
</svg>