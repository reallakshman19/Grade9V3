<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
<title id="title">Absolute pressure from free surface to lake bottom</title>
<desc id="desc">A water column with a gas bubble at the bottom and surface. Stages mark atmospheric pressure, hydrostatic contribution, absolute bottom pressure, and the Boyle-law pressure ratio used in INJSO 2012 Q39.</desc><rect width="440" height="300" fill="white"/>
<g data-g9-stage-id="hydro-column"><path d="M80 45 L80 255 L350 255 L350 45" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><line x1="80" y1="72" x2="350" y2="72" stroke="#0284c7" stroke-width="3"/><text x="95" y="64" font-size="16" font-family="system-ui">free surface</text><circle cx="220" cy="220" r="18" fill="white" stroke="#0f766e" stroke-width="3"/><text x="246" y="225" font-size="16" font-family="system-ui">bottom bubble V</text></g>
<g data-g9-stage-id="hydro-surface"><circle cx="220" cy="88" r="38" fill="white" stroke="#0f766e" stroke-width="3"/><text x="267" y="94" font-size="16" font-family="system-ui">surface bubble 10V</text><text x="94" y="30" font-size="18" font-family="system-ui">surface absolute pressure = P_atm</text></g>
<g data-g9-stage-id="hydro-gauge"><line x1="55" y1="76" x2="55" y2="250" stroke="#7c3aed" stroke-width="3"/><line x1="47" y1="76" x2="63" y2="76" stroke="#7c3aed" stroke-width="3"/><line x1="47" y1="250" x2="63" y2="250" stroke="#7c3aed" stroke-width="3"/><text x="18" y="165" transform="rotate(-90 18 165)" font-size="17" font-family="system-ui">depth h</text><rect x="105" y="263" width="240" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="118" y="284" font-size="16" font-family="system-ui">P_bottom = P_atm + ρgh</text></g>
<g data-g9-stage-id="hydro-ratio"><rect x="92" y="120" width="255" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="108" y="144" font-size="17" font-family="system-ui">Boyle: P_bottom V = P_atm(10V)</text><text x="108" y="169" font-size="18" font-family="system-ui">⇒ P_bottom = 10P_atm</text></g>
</svg>