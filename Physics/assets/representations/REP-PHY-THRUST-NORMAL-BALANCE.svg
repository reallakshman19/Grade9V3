<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
<title id="title">Normal force is solved from the whole perpendicular force balance</title>
<desc id="desc">A block on a horizontal table is pulled obliquely upward. Stages add weight and normal, resolve the applied pull, write the vertical balance, then show the loss-of-contact boundary.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs><rect width="440" height="300" fill="white"/>
<g data-g9-stage-id="normal-body"><line x1="55" y1="215" x2="385" y2="215" stroke="#64748b" stroke-width="5"/><rect x="145" y="130" width="150" height="80" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="220" y="172" text-anchor="middle" font-size="20" font-family="system-ui">block m</text></g>
<g data-g9-stage-id="normal-forces"><g color="#166534"><line x1="220" y1="130" x2="220" y2="62" stroke="currentColor" stroke-width="5" marker-end="url(#a)"/><text x="234" y="80" font-size="18" font-family="system-ui">N</text></g><g color="#b91c1c"><line x1="220" y1="170" x2="220" y2="257" stroke="currentColor" stroke-width="5" marker-end="url(#a)"/><text x="235" y="252" font-size="18" font-family="system-ui">mg</text></g></g>
<g data-g9-stage-id="normal-applied" color="#1d4ed8"><line x1="295" y1="145" x2="365" y2="88" stroke="currentColor" stroke-width="5" marker-end="url(#a)"/><text x="362" y="78" font-size="18" font-family="system-ui">F</text><line x1="295" y1="145" x2="295" y2="88" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a)"/><text x="304" y="108" font-size="16" font-family="system-ui">F⊥</text><line x1="295" y1="145" x2="354" y2="145" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><text x="320" y="167" font-size="15" font-family="system-ui">θ</text></g>
<g data-g9-stage-id="normal-balance"><rect x="35" y="20" width="210" height="58" rx="8" fill="#eef2ff" stroke="#6366f1"/><text x="49" y="45" font-size="16" font-family="system-ui">vertical equilibrium:</text><text x="49" y="67" font-size="18" font-family="system-ui">N + F⊥ − mg = 0</text><text x="270" y="272" font-size="16" font-family="system-ui">N = mg − F⊥, only while N ≥ 0</text><text x="270" y="293" font-size="15" font-family="system-ui">If the algebra asks N&lt;0, contact is lost.</text></g>
</svg>