schema_version: relay-v3-controls
controls:
- id: CTRL-MIGRATION-RECONCILE
  kind: PROTOCOL
  state: RESOLVED
  source:
    type: VALIDATOR
    ref: relay/MIGRATION/V25_REPORT.yaml
  condition: Legacy V2.5 intent/evidence has not yet been reconciled into native V3
    execution authority.
  blocks:
  - MATERIAL_WRITE
  - TEST
  - CHECKPOINT
  - HANDOVER
  - LOCAL_EXECUTION_EXPORT
  - DRAFT_PR_UPDATE
  - PR_READY
  - MERGE
  - RELEASE
  - CLOSE_TASK
  permits:
  - READ
  - ANALYZE
  resolution:
    condition: Native V3 roadmap/frontier/EP/lease/checkpoint disposition is established
      without rewriting V2.5 history.
    evidence:
    - Pinned Common@c87cf87b V3 bootstrap completed from the preserved live V2.5 tree.
    - Native present execution is intentionally IDLE; no legacy EP, lease, qualification
      or acceptance was promoted.
    - 'Owner current goal preserves #162/#173 and separates #174 NLM delivery from
      Motion-in-2D follow-up.'
- id: CTRL-V25-INTELLIGENCE-CONTINUITY
  kind: PROTOCOL
  state: RESOLVED
  source:
    type: REPOSITORY
    ref: Common#421
  condition: V3 cutover must not retire V2.5 roadmap admission, ROADMAP_EVENTS, checkpoint/progress
    reconciliation, discovery, Owner-delta, or handover intelligence before continuity
    is proven.
  blocks:
  - PROTOCOL_CUTOVER
  permits:
  - READ
  - ANALYZE
  resolution:
    condition: 'Common#421 continuity acceptance is evidenced: governed roadmap/event/checkpoint/progress
      intelligence remains semantically intact across the selected V3 authority boundary.'
    evidence:
    - relay/GENERATED/INTELLIGENCE_CONTINUITY.yaml ready=true under Common@c87cf87b
    - Final legacy freeze digest is bound in relay/PROTOCOL_SELECTION.yaml
