schema_version: relay-v3-controls
controls:
- id: CTRL-MIGRATION-RECONCILE
  kind: PROTOCOL
  state: RESOLVED
  source:
    type: VALIDATOR
    ref: relay/MIGRATION/V25_REPORT.yaml
  condition: Legacy V2.5 intent/evidence has not yet been reconciled into native V3
    execution authority.
  blocks:
  - MATERIAL_WRITE
  - TEST
  - CHECKPOINT
  - HANDOVER
  - LOCAL_EXECUTION_EXPORT
  - DRAFT_PR_UPDATE
  - PR_READY
  - MERGE
  - RELEASE
  - CLOSE_TASK
  permits:
  - READ
  - ANALYZE
  resolution:
    condition: Native V3 roadmap/frontier/EP/lease/checkpoint disposition is established
      without rewriting V2.5 history.
    evidence:
    - Fresh V3 migration report digest sha256:e75a3da11e6b992981b6bc177974c260c30700b625f6053af15c9f76e87390f2
      inventories the current legacy source tree.
    - Fresh migration source state is IDLE at roadmap RM-0014.
    - Legacy last checkpoint CP-TA-012 remains read-only migration evidence and is
      not imported as a native V3 checkpoint.
    - Native V3 authority is reconciled to IDLE at roadmap RM-0014 with no EP or lease.
    - No V2.5 DISC/QSET/QUAL/TC/checkpoint/projection object is promoted into native
      V3 action authority.
- id: CTRL-V25-INTELLIGENCE-CONTINUITY
  kind: PROTOCOL
  state: OPEN
  source:
    type: REPOSITORY
    ref: Common#421
  condition: V3 cutover must not retire V2.5 roadmap admission, ROADMAP_EVENTS, checkpoint/progress
    reconciliation, discovery, Owner-delta, or handover intelligence before continuity
    is proven.
  blocks:
  - PROTOCOL_CUTOVER
  permits:
  - READ
  - ANALYZE
  resolution:
    condition: 'Common#421 continuity acceptance is evidenced: governed roadmap/event/checkpoint/progress
      intelligence remains semantically intact across the selected V3 authority boundary.'
    evidence: []
