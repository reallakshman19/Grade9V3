    reason: Refresh generated architecture evidence.
  - path: agents/relay/**
    reason: Record bounded execution/evidence.
  protected:
  - invariant: Redo restores prior validated semantic state and does not call the domain adapter.
    reason: Domain validity belongs to the adapter at original commit time.
  - invariant: New accepted semantic commits after undo clear redo history.
    reason: Reversible history must not preserve an abandoned semantic branch.
  - invariant: History remains per-runtime instance and is not persisted globally.
    reason: Preserve isolation.
  prohibited:
  - domain: canonical academic content or adapter validity changes
    reason: Not needed for generic redo.
  - domain: timeline persistence or external-host packaging
    reason: Outside this bounded Core slice.
  owner_reserved:
  - decision: Merge PR #165
    reason: Deferred.
anti_drift:
  do_not:
  - id: ADR-R01
    restriction: Do not implement redo by replaying TRANSFER_REQUEST through the adapter.
    reason: Redo must restore a previously accepted semantic state exactly, not make a fresh domain decision.
  stale_if:
  - id: STALE-R01
    condition: Owner changes #162 ownership or revokes continuation.
    effect: STOP
    rationale: Scope authority would change.
implementation_plan:
- id: STEP-R01
  objective: Add an instance-local redo stack with monotonic revision and branch invalidation on new accepted commit.
  targets: [Shared/workbench/runtime.mjs, tests/workbench_runtime.test.mjs]
  inputs: [INPUT-R01]
  acceptance: [AC-R01, AC-R02]
  tests: [TEST-R01]
  expected_state: commit→undo→redo restores semantic entities/projections while revision advances; undo→new commit leaves nothing to redo.
  stop_conditions:
  - Stop if redo requires adapter replay or subject-specific logic.
- id: STEP-R02
  objective: Add the Redo UI/status path and prove it in real Chrome without regressing interaction/focus/text-summary behavior.
  targets: [Shared/workbench/semantic-workbench.mjs, tests/workbench_browser.test.mjs, docs/architecture-manifest.json]
  inputs: [INPUT-R01]
  acceptance: [AC-R01, AC-R02, AC-R03]
  tests: [TEST-R01, TEST-R02]
  expected_state: Browser undo→redo restores the derived object and summary; redo is disabled/invalid after a new semantic branch.
  stop_conditions:
  - Stop if redo introduces global state or accessibility regression.
