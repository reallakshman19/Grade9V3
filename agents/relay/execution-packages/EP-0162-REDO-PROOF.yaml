scope:
  allowed:
  - path: Shared/workbench/runtime.mjs
    reason: Add generic redo stack and REDO intent/event semantics.
  - path: Shared/workbench/semantic-workbench.mjs
    reason: Add generic Redo control/status and preserve focus/state-summary behavior.
  - path: tests/workbench_runtime.test.mjs
    reason: Prove redo restoration and branch invalidation.
  - path: tests/workbench_browser.test.mjs
