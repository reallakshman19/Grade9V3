outcome:
  user_visible:
  - Inspecting one representation exposes its linked representations of the same semantic entity across logical grids without relying on color alone.
  engineering:
  - Correspondence becomes an explicit runtime/event contract rather than an incidental CSS side effect.
context_capsule:
  product_goal: Make semantic identity observable across multiple representations while keeping rendering, domain validity, learner routing, and canonical authoring separate.
  roadmap_position: Successor Core slice under Issue #162; prior browser-proof merge-head validation remains deferred by Owner direction.
  why_this_work_exists: The current runtime can render multiple projections for one entity and visually activates them together, but INSPECT does not identify its projection of origin or explicitly enumerate linked projections for hosts/renderers.
  current_architecture: WorkbenchRuntime stores entity/projection identity and SemanticWorkbench renders projections in one or more named logical grids using Shadow DOM.
  prior_owner_decisions:
  - ODR-0162-OWNER-CONTINUE-DESPITE-DRIFT authorizes bounded Core coding despite deferred merge reconciliation.
  - ODR-0162-DEFER-MERGE-ADVANCE-CORRESPONDENCE authorizes this successor while prior AC-05 remains pending.
  current_implementation_state: Real Chrome and 934 repository tests pass on head 8c8c9793280eee315498d016a73adf3a3734b9a5; PR #165 remains draft/conflicted with current main.
  known_problems:
  - ENTITY_INSPECTED exposes entityRef but not projectionRef or linked projection refs.
  - Correspondence visual state is not explicitly labelled for non-color interpretation.
  - Multiple logical grids are supported by data structures but not explicitly falsified by the current fixture.
  deliberate_non_goals:
  - No new academic domain.
  - No canonical package compiler or external host.
  - No learner evidence/mastery semantics.
  - No full accessibility certification.
  terminology:
    Projection: A rendered representation of one semantic entity.
    Correspondence: The relation among projections sharing one semantic entity identity.
