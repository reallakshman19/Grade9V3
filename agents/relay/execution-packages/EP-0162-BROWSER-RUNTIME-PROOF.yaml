  user_visible:
  - The existing semantic workbench interaction contract has real-browser evidence for equivalent source/target operation paths, responsive layout, reduced motion, cancellation, undo, and sibling isolation.
  engineering:
  - Browser evidence is produced without moving domain validity into Core and without adding a mandatory frontend package/runtime dependency.
context_capsule:
  product_goal: Provide a small subject-neutral browser runtime that can manipulate semantic teaching objects while canonical academic truth, learner routing, and external-host packaging remain independently owned.
  roadmap_position: This EP executes WP-162-BROWSER-RUNTIME-PROOF under the existing Topic Atlas/Core completion objective and reconciliation phase.
  why_this_work_exists: PR #165 proved the transaction boundary with Node DOM-lite tests, but issue #162 still lacks real-browser evidence for focus, pointer, touch, responsive layout, reduced motion, cancel, undo, and multi-instance behavior.
  current_architecture: Shared/workbench contains a standards-only ES-module runtime and Shadow-DOM custom element. Domain decisions enter through an injected evaluateTransfer adapter; logical placement uses named rows and columns.
  prior_owner_decisions:
  - The Owner requested continued execution under engineering-pr-delivery-v2.5 at Common commit d9b84069683977b5c370f536f1c50095de926338.
  - Issue #162 owns the generic browser runtime only; issue #159 owns learner routing, #160 owns NLM/Atlas authoring, and #163 owns canonical-to-portable compilation plus external-host/offline/cross-domain portability proof.
  current_implementation_state: PR #165 is open and review-ready. Its pre-relay product head 5757dcefbe8af3031c2001f2a2f05259855c73aa passed the Grade9V3 guardrails with 933 repository tests, but the workbench interaction suite is not a real-browser certification.
  known_problems:
  - No repository browser automation harness currently exercises semantic-workbench in an actual browser.
  - Existing unit evidence does not establish touch/pointer event behavior, responsive CSS resolution, or prefers-reduced-motion behavior in Chrome.
  deliberate_non_goals:
  - Do not add a second subject proof package.
  - Do not perform production Redox migration.
  - Do not prove external-host, offline, single-file, or canonical-package compilation behavior owned by #163.
  - Do not introduce Lit, TypeScript, Vite, npm dependencies, or another frontend framework solely for this proof.
  terminology:
    Core: Subject-neutral semantic interaction/runtime mechanics.
    Adapter: Injected authority that decides domain-specific transfer validity and returns accepted semantic patches or rejections.
    Browser proof: Real Chrome/ChromeDriver execution of the existing one-domain test witness, not a portability or accessibility certification.
