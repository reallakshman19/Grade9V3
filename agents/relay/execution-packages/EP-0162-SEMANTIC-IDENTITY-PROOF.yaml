  protected:
  - invariant: Semantic entity 156 remains distinct from semantic entity 15.
    reason: A learner-established intermediate cannot be represented as merely a relabelled projection of the original quantity.
  - invariant: Academic validity remains adapter-owned.
    reason: Core must not calculate partial dividends or quotient digits.
  - invariant: New Core machinery requires a failing generic falsifier.
    reason: Improvement must remain minimal rather than architecture-driven.
  - invariant: Undo/redo restore recorded semantic state without adapter replay.
    reason: Preserve the green reversible-history contract.
  - invariant: Domain validity is input-modality neutral.
    reason: Pointer, click, keyboard and touch may use different browser mechanics, but evaluateTransfer must receive the same semantic request for the same source/target/operation.
  - invariant: Host observers cannot alter semantic dispatch outcome.
    reason: Event observation is downstream of Core state transitions and must not throw through or mutate the Core event result.
  - invariant: Provenance source lineage is acyclic.
    reason: sourceEntityRefs describe semantic source lineage; runtime-created entities can only point to pre-existing identities, so initial scenes must not admit lineage impossible for runtime history to produce.
  - invariant: Live target references are structurally trustworthy.
    reason: Host guidance and transformation destinations must not name nonexistent targets; declarative transformation sources may remain deferred because runtime transactions can establish them later.
  - invariant: Declared provenance sources resolve to canonical semantic entities.
    reason: Core must not admit dangling semantic lineage merely because an entity arrived in the initial scene instead of an adapter patch.
  - invariant: Semantic dispatch is non-reentrant.
    reason: Synchronous observers and adapters may run during dispatch, but they must not interleave a second Core transaction before the active dispatch returns.
  - invariant: Committed semantic and projection IDs are lifetime-stable within one runtime instance.
    reason: Undo may remove an object from the current branch, but it must not allow the same identifier to be rebound to a different semantic object or representation later in that runtime.
  prohibited:
  - domain: learner evidence/support routing
    reason: Owned by Issue #159.
  - domain: canonical NLM/Atlas authoring
    reason: Owned by Issue #160.
  - domain: portability/compiler/offline/cross-domain integration
