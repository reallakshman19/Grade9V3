    restriction: Do not add partialDividend, quotientDigit, placeValue or other arithmetic-specific fields/types to Shared/workbench Core.
    reason: Subject semantics belong to fixture/adapter data, not Core.
  - id: ADR-I02
    restriction: Do not introduce a new runtime operation if two existing adapter-approved add-entity transactions can express the witness truthfully.
    reason: The falsifier must earn architecture.
