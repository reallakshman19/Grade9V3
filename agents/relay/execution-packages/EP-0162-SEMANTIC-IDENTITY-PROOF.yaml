outcome:
  user_visible:
  - The long-division witness distinguishes the original dividend 156 from the learner-established partial dividend 15, then derives quotient digit 1 from the correct semantic sources.
  engineering:
  - Prove whether the existing generic entity/projection/adapter-patch/history model already supports creation, correspondence, provenance, undo and redo for a newly established intermediate semantic entity.
context_capsule:
  product_goal: Strengthen the smallest semantic-identity falsifier before adding any new Core architecture.
  roadmap_position: Fifth bounded #162 Core proof slice; prior browser, correspondence, text-summary and redo slices are green while merge reconciliation remains deferred.
  why_this_work_exists: The current fixture labels a projection of dividend-156 as "Use the leading 15 as the first partial dividend", so it does not prove that the newly established partial dividend 15 can have its own semantic identity, provenance and reversible lifecycle.
  current_architecture: WorkbenchRuntime can atomically add entities/projections supplied by an adapter, validate source provenance against existing entities, inspect linked projections by entity identity, and undo/redo validated snapshots without adapter replay.
  prior_owner_decisions:
  - ODR-0162-OWNER-CONTINUE-DESPITE-DRIFT
  - ODR-0162-ADVANCE-REDO
  - ODR-0162-ADVANCE-SEMANTIC-IDENTITY
  current_implementation_state: Material Core code is unchanged since the green redo proof; the live branch head contains only later relay/handover bookkeeping.
  known_problems:
  - The existing division witness conflates the textual idea "leading 15" with a projection of semantic entity dividend-156.
  deliberate_non_goals:
  - No arithmetic-specific Core API or entity type.
  - No generic derivation taxonomy in Core.
  - No pedagogy progression engine.
  - No renderer plugin architecture.
  - No second-domain or external-host proof.
  - No merge/rebase reconciliation in this slice.
