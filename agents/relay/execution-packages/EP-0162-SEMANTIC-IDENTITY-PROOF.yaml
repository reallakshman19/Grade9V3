  - The long-division witness distinguishes the original dividend 156 from the learner-established partial dividend 15, then derives quotient digit 1 from the correct semantic sources.
  engineering:
  - Prove whether the existing generic entity/projection/adapter-patch/history model already supports creation, correspondence, provenance, undo and redo for a newly established intermediate semantic entity.
context_capsule:
  product_goal: Strengthen the smallest semantic-identity falsifier before adding any new Core architecture.
  roadmap_position: Fifth bounded #162 Core proof slice; prior browser, correspondence, text-summary and redo slices are green while merge reconciliation remains deferred.
  why_this_work_exists: The current fixture labels a projection of dividend-156 as "Use the leading 15 as the first partial dividend", so it does not prove that the newly established partial dividend 15 can have its own semantic identity, provenance and reversible lifecycle.
  current_architecture: WorkbenchRuntime can atomically add entities/projections supplied by an adapter, validate source provenance against existing entities, inspect linked projections by entity identity, and undo/redo validated snapshots without adapter replay.
  prior_owner_decisions:
  - ODR-0162-OWNER-CONTINUE-DESPITE-DRIFT
  - ODR-0162-ADVANCE-REDO
  - ODR-0162-ADVANCE-SEMANTIC-IDENTITY
  - ODR-0162-CONTINUE-CORE-CODING
  - ODR-0162-ADVANCE-TRANSACTION-INTEGRITY
  - ODR-0162-ADVANCE-PROVENANCE-INTEGRITY
  - ODR-0162-ADVANCE-REENTRANCY-INTEGRITY
  current_implementation_state: The truthful identity witness plus channel-neutral validity, non-empty commit enforcement, provenance referential/DAG integrity, observer containment, lifecycle-aware reference integrity, non-reentrant dispatch, and runtime-lifetime ID stability are authored; canonicalTransformation metadata remains descriptive and does not override adapter validity. Exact-head Node/browser/full-guardrail evidence remains pending.
  known_problems:
  - Exact-head semantic-identity evidence remains pending and must not be reported as complete.
  - Exact-head channel-neutral adapter evidence remains pending and must not be reported as complete.
  - The accepted-empty-patch defect is fixed on 979afce99ec2beddd895fc5b1a12e5541915e5a3, but exact-head Node/browser/full-guardrail evidence remains pending.
  - Initial-scene provenance dangling-source validation is implemented on f715a2a0bb348825e7aef28f380a71031631dc88, but exact-head Node/browser/full-guardrail evidence remains pending.
  - Reentrant-dispatch containment is implemented on 8003880e84a5798f9a5eba0f8dfdc762c767845f, but exact-head Node/browser/full-guardrail evidence remains pending.
  - Canonical-transformation/history coupling was falsified as the wrong authority boundary: adapter validity remains authoritative and no coupling was added.
  - Runtime-lifetime ID stability is implemented at 34d9111cdb0c95ef608b98b0f24b1fe15ce43afc: initial and successfully committed entity/projection IDs remain reserved across undo/branching; rejected candidate IDs are not reserved. Exact-head evidence remains pending.
  deliberate_non_goals:
  - No arithmetic-specific Core API or entity type.
  - No generic derivation taxonomy in Core.
  - No pedagogy progression engine.
  - No renderer plugin architecture.
  - No second-domain or external-host proof.
  - No merge/rebase reconciliation in this slice.
