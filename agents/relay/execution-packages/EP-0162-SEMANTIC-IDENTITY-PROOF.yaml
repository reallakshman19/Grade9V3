    reason: The falsifier must earn architecture.
  - id: ADR-I03
    restriction: Do not remove channel observability from semantic events merely to hide it from the domain adapter.
    reason: Input mechanics remain useful telemetry; only academic/domain validity must be modality-neutral.
  - id: ADR-I04
    restriction: Do not add a second event bus, observer retry queue or subject-specific error handling to contain eventSink failures.
    reason: A cloned observer payload plus synchronous exception containment is sufficient for this falsifier.
  - id: ADR-I05
    restriction: Do not make semantic dispatch asynchronous or queue nested intents to solve synchronous callback reentrancy.
    reason: The smallest Core boundary is to reject interleaving while the active transaction owns dispatch.
  - id: ADR-I04
    restriction: Do not turn provenance referential integrity into a provenance taxonomy, executable derivation graph, cycle checker, or transaction ledger.
    reason: This slice only closes dangling source references in initial canonical state.
