id: ODR-0162-CONTINUE-CORE-CODING
decision:
  authority: OWNER
  kind: AUTHORIZATION
  statement: >-
    Continue bounded Issue #162 Core coding on PR #165 even though exact-head
    evidence for the semantic-identity slice and merge/base reconciliation remain
    pending. Head/merge/evidence issues may be dealt with later. Advance only
    generic Core invariants; do not broaden into #159 learner routing, #160
    NLM/Atlas authoring, or #163 portability/integration.
  source: >-
    Owner instruction in the active Grade9V3 engineering session on 2026-09-21:
    "Proceed core coding, head issues can be dealt later".
