required_reconciliation:
- Model partial-dividend 15 as a distinct entity if the existing generic entity/projection/patch model can express it.
- Preserve dividend 156 identity; do not relabel a projection of 156 as though it were semantic entity 15.
- Derive the quotient from the established partial-dividend entity plus divisor when the witness reaches that step.
- Prove undo/redo preserve the created semantic identities without adapter replay.
- Do not add arithmetic-specific runtime vocabulary or a new Core primitive unless the stronger witness fails without one.
- Keep Issue #159 learner routing, Issue #160 NLM/Atlas authoring, and Issue #163 portability/integration outside this slice.
- Keep PR #165 draft until merge/base reconciliation is complete.
