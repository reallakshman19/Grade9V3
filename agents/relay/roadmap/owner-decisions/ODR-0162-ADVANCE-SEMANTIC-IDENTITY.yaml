id: ODR-0162-ADVANCE-SEMANTIC-IDENTITY
decision:
  authority: OWNER
  kind: AUTHORIZATION
  statement: >-
    Continue the next bounded Issue #162 Core slice by strengthening the 156 ÷ 12
    falsifier so the leading 15 is represented as a distinct semantic entity with
    provenance and reversible lifecycle. First attempt the stronger witness using
    the existing Core model; change Core only if that witness exposes a structural
    inability. Keep merge/base reconciliation deferred and do not broaden into
    pedagogy routing, renderer architecture, packaging, or another subject.
  source: >-
    Owner instruction in the active Grade9V3 engineering session on 2026-09-20:
    "Start fix", following the explicit requirement to find the smallest justified
    Core improvement and to use 156 ÷ 12 as the semantic falsifier.
